# Rhombus Discovery Pipeline Configuration Stub
# NOTE: All physical thresholds below are strictly PROVISIONAL until calibrated
# against empirical benchmarks (OBELiX / LiIon). Never treat provisional values as physical laws.

# Dataset Sources & Anchors
datasets:
  # Path to local clone of OBELiX repository (github.com/NRC-Mila/OBELiX)
  # Invariant: Must use published leakage-aware grouped split without local re-shuffling
  obelix_repo: "data/obelix"

  # Path to LiIon temperature-resolved ionic conductivity dataset (~820 entries)
  # Invariant: Must never be merged into OBELiX rows or have temperatures averaged
  # NOTE: File lives inside the OBELiX repo clone, not a separate data/liion/ dir.
  liion_source: "data/obelix/data/misc/LiIonDatabase.csv"

# Pipeline Determinism
random_seed: 42

# Generation Stage ([G]: G1 perturbation + G2 substitution, CPU-only)
# All magnitudes below are PROVISIONAL (uncalibrated placeholders).
generation:
  # Parent sources for generate_children drivers / smoke runs
  parent_sources:
    obelix: true
    liion: true  # structureless rows retrievable, not perturbable

  # Children generated per parent per run (operator sampled per child)
  children_per_parent: 3

  # Per-run seed (combined with parent index for deterministic sharding)
  random_seed: 42

  # G1 (a): Gaussian atomic displacement sigma in Angstrom
  # PROVISIONAL: small vs. typical bond lengths; huge values must trip P0 clash
  displacement_sigma_A_provisional: 0.05

  # G1 (b): uniform symmetric lattice strain bound (fraction)
  # PROVISIONAL: +-2% is within elastic-response territory for most ceramics
  strain_max_fraction_provisional: 0.02

  # Mobile-ion sublattice for vacancy/interstitial operators
  mobile_ion: "Li"

  # G1 (c): which defect modes the "defect" slot may sample
  defect_modes:
    - "vacancy"
    - "interstitial"

  # G2: allowed element swaps (dominant-site element -> alternatives).
  # PROVISIONAL heuristic allowlist; every swap is SMACT-checked and the
  # resulting child always faces P0, so bad swaps FAIL loudly instead of
  # passing silently.
  allowed_swaps_provisional:
    Li: ["Na", "Mg"]
    Na: ["Li"]
    O: ["S"]
    S: ["O", "Se"]
    Cl: ["Br"]
    Br: ["Cl"]
    La: ["Nd"]
    Zr: ["Ti"]

  # Novelty-tagging tolerances (StructureMatcher), all PROVISIONAL.
  # Calibration 2026-09 (temp scripts, small OBELiX CIFs, temp-dir only):
  #  - 12-setting sweep (ltol .05-.2 x stol .1-.3 x angle 2-5): every setting
  #    matched all 4 true duplicates (identity, 1e-6 noise, operating sigma /
  #    strain) and matched 0/6 distinct pairs (cross-material, 10x magnitudes).
  #  - Sensitivity: operating-magnitude rattles match at EVERY reasonable
  #    tolerance (correctly so -- sigma=0.05 rarely escapes the parent basin);
  #    hyper-tight (0.001) breaks experimental-variance duplicate detection.
  #  - Verdict: keep pymatgen defaults as the calibrated value (wide plateau,
  #    margin both sides). The 25/60 smoke rediscoveries are TRUE same-basin
  #    rediscoveries (a generator-magnitude observation), not mistags.
  matcher:
    ltol_provisional: 0.2
    stol_provisional: 0.3
    angle_tol_provisional: 5.0

# Machine Learning Interatomic Potential (MLIP) Checkpoints
mlip:
  # Primary model: Default is mace_mp("medium-mpa-0") under MIT license (NOT MACE-MP-0)
  primary_checkpoint: "medium-mpa-0"

  # Cross-check model: Distinct dataset distribution (SevenNet or CHGNet)
  # Invariant: Same-seed ensembles of the same base model are strictly banned
  cross_check_model: "sevennet"

  # P1 checkpoint pinning (DESIGN.md section 4): verified pre-run, loud fail
  # on mismatch. Hash recorded 2026-09 from the release asset below.
  checkpoint_url: "https://github.com/ACEsuit/mace-mp/releases/download/mace_mpa_0/mace-mpa-0-medium.model"
  checkpoint_sha256: "75428afe3a1d7d8062e19bcaabd5c433623cabf308242ec9fb493e38604fb638"

  # P1 relaxation gates (PROVISIONAL until calibrated on real relaxations)
  force_tol_ev_A: 0.01
  max_relax_steps: 200
  precision: "float64"
  energy_match_tol_mev_per_atom_provisional: 5.0

# P2 550 K NVT stability screen (GPU defaults; pilot overrides via CLI).
# All gates PROVISIONAL (uncalibrated placeholders); see rudeus/mlip/p2.py.
# Trajectory policy is a PROVISIONAL screening-efficiency choice (NOT a
# transport-convergence claim): 2 ps equil, then cumulative 1/3/8 ps tiers
# on one continuous trajectory with early stop on clear PASS/FAIL evidence.
p2:
  dtype: "float32"
  p2_protocol_version: "p2-adaptive-v2-fixcom-constraint-provisional"
  trajectory_policy: "adaptive-1000-3000-8000-v1-provisional"
  production_tier_schedule_provisional: [1000, 3000, 8000]
  temperature_K: 550.0
  timestep_fs: 1.0
  equil_steps: 2000
  production_steps: 8000
  sample_interval_steps: 10
  thermostat: "langevin"
  friction_fs_inv_provisional: 0.02
  fix_center_of_mass: true
  mobile_species: "Li"
  base_seed: 550
  min_production_frames_provisional: 50
  min_mobile_ions_provisional: 4
  host_rmsd_fail_A_provisional: 1.0
  lindemann_fail_provisional: 0.20
  lindemann_corr_rmsd_A_provisional: 0.7
  lindemann_corr_min_dist_A_provisional: 1.2
  lindemann_corr_coord_provisional: 1.0
  volume_drift_fail_fraction_provisional: 0.15
  min_distance_fail_A_provisional: 0.8
  coord_mean_change_fail_provisional: 2.0
  temp_mean_tol_K_provisional: 150.0
  temp_std_fail_K_provisional: 150.0
  energy_drift_fail_ev_per_ps_per_atom_provisional: 0.05
  explosion_abort_A_provisional: 3.0

# PROVISIONAL Physical & Dynamical Screening Thresholds
# All numeric cutoffs in this section are uncalibrated placeholders.
# They MUST be calibrated via rudeus.bench before gating discovery decisions.
thresholds:
  # P0 / P1 Thermodynamic Stability: Energy above convex hull (eV/atom)
  # PROVISIONAL: Needs empirical calibration against synthesis survival rates
  energy_above_hull_ev_per_atom_provisional: 0.050

  # P2 Dynamical Stability: Lindemann criterion threshold for melting/amorphization
  # PROVISIONAL: Needs calibration against finite-T crystalline persistence
  lindemann_criterion_provisional: 0.150

  # F2 Geometric/Electrostatic: BVSE percolation barrier cutoff (eV)
  # REMOVED 2026-09 — bench verdict REMOVE (official-split AUC 0.44, negative
  # Spearman, falsification FAIL). Value retained for the record ONLY; the
  # discovery pipeline must not use it. See AGENTS.md section 8.
  bvse_percolation_barrier_ev_provisional: 0.600

  # F3 Diffusive-Regime Validator: Minimum mobile-ion-only MSD slope (A^2/ps)
  # PROVISIONAL: Needs calibration against true diffusive regimes
  msd_mobile_ion_min_slope_provisional: 1.0e-4

  # F3 Diffusive-Regime Validator: Maximum non-Gaussian parameter alpha_2
  # PROVISIONAL: Used to rule out anomalous jump-cage trapping vs continuous diffusion
  alpha2_max_cutoff_provisional: 0.200

  # P3 Ionic Transport: Arrhenius activation energy cutoff (eV)
  # PROVISIONAL: Benchmark-calibrated target for room-temperature fast ion conductors
  activation_energy_max_ev_provisional: 0.400
