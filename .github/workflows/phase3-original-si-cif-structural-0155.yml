name: Phase 3 Actual Original 8 Publisher CIF vs 2 OBELiX TRAIN 0155
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phase3-original-si-v-train-0155-${{ github.ref }}
  cancel-in-progress: true
jobs:
  actual-physical-source-crystal-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OPENBLAS_NUM_THREADS: "2"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      ORIGINAL_OBELIX_COMMIT: 4eaac889809dd489e3bae468c45d5c0e02b9147a
    steps:
      - name: Checkout exact triggering Rhombus commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Python 3.11 for first-party crystallography
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install pinned 0151 scientific dependencies
        run: |
          set -euo pipefail
          python -m pip install -c scripts/ci/constraints.txt pytest numpy scipy pyyaml pymatgen smact ase scikit-learn
      - name: Test structure match and occupancy falsification fixtures
        run: python -m pytest -q tests/test_phase3_original_si_cif_join_0155.py
      - name: Fetch exact publisher OBELiX first-party original repository
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none --no-checkout https://github.com/NRC-Mila/OBELiX.git "$RUNNER_TEMP/OBELiX-0155"
          git -C "$RUNNER_TEMP/OBELiX-0155" checkout --quiet --detach "$ORIGINAL_OBELIX_COMMIT"
          test "$(git -C "$RUNNER_TEMP/OBELiX-0155" rev-parse HEAD)" = "$ORIGINAL_OBELIX_COMMIT"
          test -z "$(git -C "$RUNNER_TEMP/OBELiX-0155" status --porcelain --untracked-files=all)"
      - name: Download genuine pinned SI ZIP then analyze publisher 8 CIF against 2 original TRAIN
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE" python scripts/science/obelix_original_si_cif_0155.py \
            --original-obelix-checkout "$RUNNER_TEMP/OBELiX-0155" \
            --output-dir "$RUNNER_TEMP/0155-real-CIF-join" --live-original
      - name: Assert original source population, 16 pair attempts and zero paper sample claims
        run: |
          python - "$RUNNER_TEMP/0155-real-CIF-join" <<'PY'
          import json,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          assert [f.name for f in root.iterdir()] == ["original_primary_CIF_crosscheck.json"]
          x=json.loads((root/"original_primary_CIF_crosscheck.json").read_text())
          assert x["original_public_TRAIN_rows"] == 478
          assert x["original_public_TEST_rows_reserved_unread"] == 121
          assert x["exact_match_original_TRAIN_rows_reexamined"] == 2
          assert x["publisher_original_SI_CIF_members_reexamined"] == 8
          assert x["structure_pair_attempts"] == 16
          assert len(x["pair_diagnostics"]) == 16
          assert x["independent_experimental_specimens_verified"] == 0
          assert x["source_row_sample_x_and_experimental_phase_qualified"] == 0
          assert x["source_row_temperature_bulk_total_conductivity_qualified"] == 0
          assert x["disorder_rounded_or_model_qualified"] is False
          assert x["MD_transport_computed"] is False and x["scientific_GO"] is False
          assert all(z["measured_sample_or_phase_match"] == "UNVERIFIED" for z in x["pair_diagnostics"])
          assert all(x[y] == "BLOCKED" for y in ("P0_01_status","P0_02_status","P0_03_status"))
          print("0155_ORIGINAL_8_SI_CIF_X_2_TRAIN_CIF_REAL_SOURCE_NEGATIVE_CLAIM_PASS")
          PY
      - name: Retain only bounded crystallographic source aggregate without CIF structures
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase3-0155-actual-8-firstparty-CIF-x-2-TRAIN-structure-diagnostic
          path: ${{ runner.temp }}/0155-real-CIF-join/original_primary_CIF_crosscheck.json
          if-no-files-found: error
          retention-days: 30
