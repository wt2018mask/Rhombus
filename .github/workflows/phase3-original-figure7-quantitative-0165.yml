name: Phase 3 0165 Pinned Original Figure 7 Quantitative Data Availability and Graphics Audit
on:
  pull_request:
    paths:
      - "scripts/science/obelix_public_manuscript_0153.py"
      - "scripts/science/obelix_original_si_cif_0155.py"
      - "scripts/science/obelix_lagp_*.py"
      - "scripts/science/obelix_train_only_transport_0163.py"
      - "scripts/science/obelix_original_figure*.py"
      - "scripts/science/obelix_figshare_source_0154.py"
      - "scripts/science/obelix_supplementary_source_0154.py"
      - "tests/test_phase3_public_manuscript_0153.py"
      - "tests/test_phase3_lagp*.py"
      - "tests/test_phase3_strict_train_only_0163.py"
      - "scripts/ci/constraints.txt"
      - ".github/workflows/phase3-original-figure7-quantitative-0165.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phase3-original-si-v-train-0165-${{ github.ref }}
  cancel-in-progress: true
jobs:
  actual-physical-source-crystal-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OPENBLAS_NUM_THREADS: "2"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      ORIGINAL_OBELIX_COMMIT: 4eaac889809dd489e3bae468c45d5c0e02b9147a
    steps:
      - name: Checkout exact triggering Rhombus commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Python 3.11 for first-party crystallography
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install pinned 0151 scientific dependencies
        run: |
          set -euo pipefail
          python -m pip install -c scripts/ci/constraints.txt pytest numpy scipy pyyaml pymatgen smact ase scikit-learn
          python -m pip install 'pypdf==5.9.0'
      - name: Test structure match and occupancy falsification fixtures
        run: python -m pytest -q tests/test_phase3_lagp_figure7_numeric_0165.py
      - name: Fetch exact publisher OBELiX first-party original repository
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none --no-checkout https://github.com/NRC-Mila/OBELiX.git "$RUNNER_TEMP/OBELiX-0165"
          git -C "$RUNNER_TEMP/OBELiX-0165" checkout --quiet --detach "$ORIGINAL_OBELIX_COMMIT"
          test "$(git -C "$RUNNER_TEMP/OBELiX-0165" rev-parse HEAD)" = "$ORIGINAL_OBELIX_COMMIT"
          test -z "$(git -C "$RUNNER_TEMP/OBELiX-0165" status --porcelain --untracked-files=all)"
      - name: Download genuine pinned SI ZIP then analyze publisher 8 CIF against 2 original TRAIN
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE" python scripts/science/obelix_lagp_figure7_numeric_0165.py \
            --original-obelix-checkout "$RUNNER_TEMP/OBELiX-0165" \
            --output-dir "$RUNNER_TEMP/0165-real-CIF-join"
      - name: Validate Figure 7 actual PDF drawing object census without inventing numeric means/SD
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/0165-real-CIF-join" <<'PY'
          import json,math,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          assert sorted(x.name for x in root.iterdir())==["original_figure7_quantitative_readiness_0165.json"]
          d=json.loads((root/"original_figure7_quantitative_readiness_0165.json").read_text())
          assert d["original_DOI"]=="10.1021/acsami.8b00842"
          assert d["original_OBELIX_TRAIN_pinned_sha"]=="4eaac889809dd489e3bae468c45d5c0e02b9147a"
          assert d["firstparty_accepted_manuscript_pdf_sha"]=="e5fc22ec69db52f403f8776cbcf10e11ed771d6abf69b3c3ac610bb30edfe368"
          assert d["original_pdf_figure7_caption_page"]==17
          assert d["original_fig7_caption_reported_multiple_samples_with_SD"] is True
          graphic=d["PDF_graphics_readiness"]
          assert graphic["original_sha256"]==d["firstparty_accepted_manuscript_pdf_sha"]
          assert graphic["original_pages"]==26
          assert [x["pdf_page_one_based"] for x in graphic["figure_neighborhood_graphics"]]==[15,16,17]
          for q in graphic["figure_neighborhood_graphics"]:
            assert 0<=q["pdf_operations"]<=160000
            assert 0<q["source_content_bytes"]<=4000000
            assert q["numeric_axis_ticks_are_not_measurement_points"] is True
            assert q["original_source_data_series_recovered"]==0
          assert graphic["per_point_figure7_numeric_data_extracted"]==0
          assert graphic["figure7_mean_errorbar_digitization"] is False
          assert graphic["coordinate_axis_calibration_independently_verified"] is False
          assert graphic["underlying_replicate_measurement_table_verified"] is False
          x=d["physical_experimental_target_eligibility"]
          assert x["observation_unit"]=="NOMINAL_COMPOSITION_PELLET_GROUP_MEAN_SD"
          assert x["group_summary_numerically_ready"] is False
          assert x["individual_pellet_truth_ready"] is False
          assert x["independent_blind_qualified"] is False
          assert "SOURCE_SD_ERROR_BAR_NOT_DIGITIZED" in x["blockers"]
          assert "EXACT_INDEPENDENT_PELLET_N_UNKNOWN" in x["blockers"]
          assert math.isclose(d["processed_original_TRAIN_2_CIF_log10_contrast"],0.76937121,abs_tol=1e-8)
          assert d["actual_raw_experimental_replicate_count_verified"] is None
          assert d["individual_experimental_pellet_truths_qualified"]==0
          assert d["actual_group_mean_and_SD_numeric_points_qualified"]==0
          assert d["original_TEST_composition_DOI_conductivity_cells_parsed"]==0
          assert d["original_mixed_CSV_TEST_raw_bytes_passed_over"] is True
          assert all(d[k]=="BLOCKED" for k in ("P0_01","P0_02","P0_03"))
          assert d["new_finite_T_MD"] is False
          assert d["scientific_GO"] is False
          print("0165_FIRSTPARTY_FIGURE7_PAGE_GRAPHICS_NUMERIC_POINTS_NOT_INVENTED_PASS")
          print(json.dumps({"page_graphics":graphic["figure_neighborhood_graphics"],
                            "group_numeric_points_admitted":0,"individual_pellets":0},sort_keys=True))
          PY
      - name: Retain only bounded crystallographic source aggregate without CIF structures
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase3-0165-original-figure7-graphics-numeric-readiness
          path: ${{ runner.temp }}/0165-real-CIF-join/original_figure7_quantitative_readiness_0165.json
          if-no-files-found: error
          retention-days: 30
