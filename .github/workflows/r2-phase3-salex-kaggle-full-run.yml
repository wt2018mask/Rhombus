name: Phase 3 sAlex Kaggle Full Run

on:
  pull_request:
    paths:
      - "data/development/phase3_salex_kaggle_full_run_request_v1.json"
      - "data/development/phase3_salex_kaggle_full_run_plan_v1.json"
      - "scripts/kaggle/salex_phase3_full_run.py"
      - ".github/workflows/r2-phase3-salex-kaggle-full-run.yml"
      - "tests/test_phase3_salex_kaggle_automation.py"
  workflow_dispatch:
    inputs:
      operation:
        description: "Recovery only; new submissions blocked pending durable consumption"
        required: true
        default: "retrieve"
        type: choice
        options:
          - submit
          - resume
          - retrieve
      expected_commit:
        description: "Exact historical Rhombus commit bound to the existing Kaggle run"
        required: false
        default: ""
        type: string
      recovery_dataset_ref:
        description: "Optional PRIVATE wt2018mask Kaggle dataset holding the original 8 output files. Leave blank for normal kernel retrieval."
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: r2-phase3-salex-kaggle-full-run
  cancel-in-progress: false

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out exact PR commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # resolved v5
        with:
          python-version: "3.11"
      - name: Validate one-shot Kaggle automation contract
        run: |
          python -m pip install -c scripts/ci/constraints.txt pytest pyyaml
          python -m pytest -q tests/test_phase3_salex_kaggle_automation.py

  controller:
    # RT-P1-04: no durable atomic consumed-request ledger is available.
    # Never admit submit, even when the production variable is enabled.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.operation == 'resume' || inputs.operation == 'retrieve') &&
      inputs.expected_commit == '643b8a260b6fcff78bb02f3a63f348c29fd91317'
    runs-on: ubuntu-24.04
    environment: kaggle-production
    permissions:
      contents: read
      actions: write
    timeout-minutes: 350
    steps:
      - name: Reject new submissions without durable consumption
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          REQUESTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          set -euo pipefail
          case "$OPERATION" in
            resume|retrieve) ;;
            *) echo "SALEX_SUBMISSION_DENIED_NO_DURABLE_CONSUMPTION"; exit 1 ;;
          esac
          test "$REQUESTED_COMMIT" = "643b8a260b6fcff78bb02f3a63f348c29fd91317"
          echo "SALEX_EXISTING_RUN_RECOVERY_ONLY"

      - name: Resolve immutable run identity
        id: identity
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          REQUESTED_COMMIT: ${{ inputs.expected_commit }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          commit="$REQUESTED_COMMIT"
          if ! echo "$commit" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "INVALID_EXPECTED_COMMIT=$commit"
            exit 1
          fi
          short="${commit:0:12}"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "short=$short" >> "$GITHUB_OUTPUT"
          echo "dataset_ref=wt2018mask/rhombus-phase3-salex-$short" >> "$GITHUB_OUTPUT"
          echo "kernel_ref=wt2018mask/rhombus-salexcpu-$short" >> "$GITHUB_OUTPUT"
          echo "kernel_title=rhombus-salexcpu-$short" >> "$GITHUB_OUTPUT"
          echo "slug=rhombus-phase3-salex-$short" >> "$GITHUB_OUTPUT"

      - name: Check out exact bound Rhombus commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ steps.identity.outputs.commit }}
          fetch-depth: 1

      - name: Verify production authorization
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ steps.identity.outputs.commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          python - <<'PY'
          import json
          from pathlib import Path
          request = json.loads(
              Path("data/development/phase3_salex_kaggle_full_run_request_v1.json").read_text()
          )
          assert request["enabled"] is True
          assert request["backend"] == "KAGGLE_CPU"
          assert request["authorization"]["full_run_authorized"] is True
          assert request["authorization"]["unseen_generalization_claim"] is False
          assert request["frozen_sources"]["salex"]["expected_records"] == 10447765
          assert request["frozen_sources"]["wbm_initial_structures"]["expected_records"] == 256963
          print("SALEX_KAGGLE_FULL_RUN_AUTHORIZED")
          PY

      - name: Require Kaggle credentials
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${KAGGLE_API_TOKEN:-}" ] || { [ -n "${KAGGLE_USERNAME:-}" ] && [ -n "${KAGGLE_KEY:-}" ]; }; then
            echo "KAGGLE_REMOTE_DISPATCH=CONFIGURED"
          else
            echo "KAGGLE_REMOTE_DISPATCH=REMOTE_NOT_CONFIGURED"
            exit 1
          fi

      - name: Set up Python control plane
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # resolved v5
        with:
          python-version: "3.11"

      - name: Checkout trusted recovery and security code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          path: rhombus-security-tools
          persist-credentials: false

      - name: Install Kaggle and verification runtime
        run: |
          python -m pip install --require-hashes -r rhombus-security-tools/scripts/ci/kaggle-controller-requirements.txt
          python -m kaggle --version || true

      - name: Poll Kaggle terminal state
        if: inputs.operation != 'retrieve'
        id: poll
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KERNEL_REF: ${{ steps.identity.outputs.kernel_ref }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/phase3-salex-kaggle
          terminal=RUNNING
          for i in $(seq 1 300); do
            status="$(python -m kaggle kernels status "$KERNEL_REF" 2>&1 || true)"
            echo "KAGGLE_STATUS_CHECK_PERFORMED"
            printf '%s\n' "Provider status checked; raw provider output withheld" > artifacts/phase3-salex-kaggle/latest-status.txt
            if echo "$status" | grep -q 'KernelWorkerStatus.COMPLETE'; then
              terminal=COMPLETE
              break
            fi
            if echo "$status" | grep -q 'KernelWorkerStatus.ERROR'; then
              terminal=ERROR
              break
            fi
            sleep 60
          done
          echo "terminal=$terminal" >> "$GITHUB_OUTPUT"

      - name: Dispatch fresh retrieval controller
        if: inputs.operation != 'retrieve' && steps.poll.outputs.terminal == 'COMPLETE'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ steps.identity.outputs.commit }}
        run: |
          set -euo pipefail
          gh workflow run r2-phase3-salex-kaggle-full-run.yml --ref main -f operation=retrieve -f expected_commit="$EXPECTED_COMMIT"
          printf '%s\n' '{"controller_state":"RETRIEVAL_DISPATCHED"}' > artifacts/phase3-salex-kaggle/controller-state.json

      - name: Dispatch continuation controller
        if: inputs.operation != 'retrieve' && steps.poll.outputs.terminal == 'RUNNING'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ steps.identity.outputs.commit }}
        run: |
          set -euo pipefail
          gh workflow run r2-phase3-salex-kaggle-full-run.yml --ref main -f operation=resume -f expected_commit="$EXPECTED_COMMIT"
          printf '%s\n' '{"controller_state":"CONTINUATION_DISPATCHED"}' > artifacts/phase3-salex-kaggle/controller-state.json

      - name: Capture Kaggle error logs
        if: inputs.operation != 'retrieve' && steps.poll.outputs.terminal == 'ERROR'
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KERNEL_REF: ${{ steps.identity.outputs.kernel_ref }}
        run: |
          mkdir -p artifacts/phase3-salex-kaggle
          python scripts/security/redact_stream.py --output artifacts/phase3-salex-kaggle/kaggle-error.log -- python -m kaggle kernels logs "$KERNEL_REF"
          printf '%s\n' '{"controller_state":"KAGGLE_ERROR"}' > artifacts/phase3-salex-kaggle/controller-state.json

      - name: Observe Kaggle status before verified retrieval
        if: inputs.operation == 'retrieve'
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KERNEL_REF: ${{ steps.identity.outputs.kernel_ref }}
        run: |
          set -euo pipefail
          # A provider status listing can change format or be unavailable after
          # completion. Status observation is not the scientific evidence gate.
          # Never print the provider response (it may contain sensitive values).
          status="$(python -m kaggle kernels status "$KERNEL_REF" 2>&1 || true)"
          if echo "$status" | grep -q 'KernelWorkerStatus.COMPLETE'; then
            echo "KAGGLE_RETRIEVAL_PROVIDER_STATUS_COMPLETE"
          else
            echo "KAGGLE_RETRIEVAL_PROVIDER_STATUS_UNCONFIRMED"
          fi
          # The read-only output retrieval below may fail safely. Independent
          # receipt, immutable commit, source identity, full row counts and
          # multipart SHA256 validation remain REQUIRED for upload.
          
      - name: Retrieve original output or validated recovery dataset
        if: inputs.operation == 'retrieve'
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KERNEL_REF: ${{ steps.identity.outputs.kernel_ref }}
          RECOVERY_DATASET_REF: ${{ inputs.recovery_dataset_ref }}
        run: |
          set -euo pipefail
          python rhombus-security-tools/scripts/kaggle/retrieve_salex_outputs.py \
            --kernel "$KERNEL_REF" \
            --dataset "$RECOVERY_DATASET_REF" \
            --output artifacts/phase3-salex-kaggle \
            --attempts 3

      - name: Independently verify retrieved hashes and row counts
        if: inputs.operation == 'retrieve'
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ steps.identity.outputs.commit }}
          KERNEL_REF: ${{ steps.identity.outputs.kernel_ref }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          import io
          import json
          import os
          from pathlib import Path
          import zstandard as zstd

          root = Path("artifacts/phase3-salex-kaggle")
          receipt_path = root / "rhombus_phase3_salex_run_receipt.json"
          summary_path = root / "rhombus_phase3_salex_summary.json"
          assert receipt_path.is_file()
          assert summary_path.is_file()
          receipt = json.loads(receipt_path.read_text())
          summary = json.loads(summary_path.read_text())
          expected_commit = os.environ["EXPECTED_COMMIT"]
          assert receipt["source_commit"] == expected_commit
          assert receipt["status"] == "PRODUCTION_COMPLETE_SOURCE_STREAM_FINISHED"
          assert receipt["scientific_authorization"]["unseen_generalization_claim_authorized"] is False
          assert summary["salex_membership_row_count"] == 10447765
          assert summary["wbm_target_count"] == 256963
          assert summary["salex_source_sha256"] == "48eb3664d95331e7fd84bfe1f04f5e741600bffcfb1253334c82dae92cebf1ef"
          assert summary["wbm_source_sha256"] == "98d545172c1ea9060f03f40cace6f8173a4ac06f1ee875ccd963765211519b58"
          assert summary["unseen_generalization_claim_authorized"] is False

          def sha256_file(path: Path) -> str:
              h = hashlib.sha256()
              with path.open("rb") as f:
                  while chunk := f.read(8 * 1024 * 1024):
                      h.update(chunk)
              return h.hexdigest()

          assert sha256_file(summary_path) == receipt["summary"]["sha256"]

          class MultiPartReader(io.RawIOBase):
              def __init__(self, paths: list[Path]):
                  self.paths = paths
                  self.index = 0
                  self.handle = None
              def readable(self):
                  return True
              def read(self, size=-1):
                  if size == 0:
                      return b""
                  chunks = []
                  remaining = size
                  while self.index < len(self.paths) and (size < 0 or remaining > 0):
                      if self.handle is None:
                          self.handle = self.paths[self.index].open("rb")
                      chunk = self.handle.read(-1 if size < 0 else remaining)
                      if chunk:
                          chunks.append(chunk)
                          if size > 0:
                              remaining -= len(chunk)
                              if remaining == 0:
                                  break
                      else:
                          self.handle.close()
                          self.handle = None
                          self.index += 1
                  return b"".join(chunks)
              def close(self):
                  if self.handle is not None:
                      self.handle.close()
                  super().close()

          def verify_archive(spec, expected_raw):
              parts = spec["parts"]
              paths = []
              compressed = hashlib.sha256()
              for part in parts:
                  path = root / part["name"]
                  assert path.is_file(), path
                  assert path.stat().st_size == part["size_bytes"]
                  digest = sha256_file(path)
                  assert digest == part["sha256"]
                  paths.append(path)
                  with path.open("rb") as f:
                      while chunk := f.read(8 * 1024 * 1024):
                          compressed.update(chunk)
              assert compressed.hexdigest() == spec["compressed_sha256"]
              raw = hashlib.sha256()
              source = MultiPartReader(paths)
              with zstd.ZstdDecompressor().stream_reader(source) as reader:
                  while chunk := reader.read(8 * 1024 * 1024):
                      raw.update(chunk)
              assert raw.hexdigest() == expected_raw == spec["raw_sha256"]

          verify_archive(receipt["membership_archive"], summary["membership_index_sha256"])
          verify_archive(receipt["overlap_archive"], summary["overlap_jsonl_sha256"])

          evidence = {
              "schema_version": "rhombus-v2-salex-kaggle-retrieval-evidence-v1",
              "status": "RETRIEVED_AND_INDEPENDENTLY_VERIFIED",
              "source_commit": expected_commit,
              "kernel_ref": os.environ["KERNEL_REF"],
              "salex_membership_row_count": summary["salex_membership_row_count"],
              "wbm_target_count": summary["wbm_target_count"],
              "membership_raw_sha256": summary["membership_index_sha256"],
              "overlap_raw_sha256": summary["overlap_jsonl_sha256"],
              "full_training_lineage_resolved": False,
              "unseen_generalization_claim_authorized": False,
              "remaining_blocker": "MPTRJ_TRAINING_REPRESENTATION_UNATTESTED",
          }
          (root / "rhombus_phase3_salex_retrieval_evidence.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n"
          )
          print("SALEX_KAGGLE_RETRIEVAL_VERIFIED")
          PY

      # The job first checks out the original immutable science commit, which
      # predates the scanner. Checkout trusted dispatch SHA into a subdirectory
      # so scientific execution / retrieval remains exact-commit bound.
      - name: Check all outgoing artifacts for credentials
        if: inputs.operation == 'retrieve' && success()
        id: outgoing_scan
        run: python rhombus-security-tools/scripts/security/scan_outgoing_artifacts.py artifacts/phase3-salex-kaggle

      - name: Upload controller or verified production evidence
        if: steps.outgoing_scan.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # resolved v4
        with:
          name: r2-phase3-salex-kaggle-${{ steps.identity.outputs.short }}-${{ github.run_id }}
          path: artifacts/phase3-salex-kaggle/
          if-no-files-found: warn
          retention-days: 30

      - name: Fail closed on Kaggle execution error
        if: inputs.operation != 'retrieve' && steps.poll.outputs.terminal == 'ERROR'
        run: exit 1

