name: Phase 3 0167 Two Independent Original Paper Measurement Identifiability
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: two-papers-0167-${{ github.ref }}
  cancel-in-progress: true
jobs:
  true-original-paper-physical-science:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install pinned science test dependencies
        run: python -m pip install -c scripts/ci/constraints.txt pytest numpy pypdf==5.9.0
      - name: Test first-party source tables and physical falsification
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_phase3_original_sulfide_table_0166.py tests/test_phase3_kraft_original_table_s17_0166.py tests/test_phase3_primary_cross_source_identifiability_0167.py
      - name: Actually retrieve BOTH publicly archived original paper numeric tables
        run: |
          set -euo pipefail
          python scripts/science/original_cross_source_identifiability_0167.py --live-original --output-dir "$RUNNER_TEMP/real-0167"
      - name: Verify actual source chemical identifiability and incompatible physics
        run: |
          python - "$RUNNER_TEMP/real-0167" <<'PY'
          import json,sys,math
          from pathlib import Path
          folder=Path(sys.argv[1])
          assert sorted(v.name for v in folder.iterdir())==["two_primary_papers_observable_identity_0167.json"]
          a=json.loads((folder/"two_primary_papers_observable_identity_0167.json").read_text())
          assert a["published_primary_source_DOIs"]==["10.1039/c9ra00949c","10.1021/jacs.8b10282"]
          assert a["source2_stable_original_S17_table_numeric_sha256"]=="1eb7ad5527b18040239b341ba6171aad3453113c700c2edf4ca271a1eba84d7d"
          assert a["source1_one_nominal_chemistry_process_conditions"]==6
          assert a["source1_distinct_material_compositions"]==1
          assert a["source1_measurement_unit"]=="CONDUCTIVITY_S_PER_CM"
          assert math.isclose(a["source1_actual_original_same_formula_max_to_min_sigma_ratio"],1.94/.19,abs_tol=1e-8)
          assert math.isclose(a["source1_log10_S_per_cm_label_range"],math.log10(1.94/.19),abs_tol=1e-8)
          assert a["source1_STOICHIOMETRY_ONLY_or_any_single_constant_MIN_EMPIRICAL_log10_MAE"]>0.1
          assert a["source1_number_nonmonotonic_heat_steps"]==1
          assert a["source1_thermal_processing_condition_for_min_Ea_C"]==500
          assert a["source1_thermal_processing_condition_for_max_sigma_C"]==550
          assert a["source2_measurement_unit"]=="BULK_RESISTANCE_OHM_NOT_SIGMA"
          assert a["source2_published_original_bulk_R_number_of_numeric_values"]==120
          assert a["source2_unique_measured_temperatures"]==11
          assert a["sources_can_pool_into_single_conductivity_accuracy_target"] is False
          assert a["physical_specimens_jointly_qualified"]==0
          assert a["source_external_prospective_blind"] is False
          assert a["scientific_GO"] is False
          assert all(a[k]=="BLOCKED" for k in ("P0_01","P0_02","P0_03"))
          print("0167_REAL_BOTH_SOURCE_PAPERS_CONSTANT_CHEMISTRY_MAE_FLOOR_AND_SEPARATE_BULK_RESISTANCE_PASS")
          print(json.dumps({"min_MAE":a["source1_STOICHIOMETRY_ONLY_or_any_single_constant_MIN_EMPIRICAL_log10_MAE"],"max_min_ratio":a["source1_actual_original_same_formula_max_to_min_sigma_ratio"],"new_certified_specimens":0},sort_keys=True))
          PY
      - name: Retain scientific aggregate only, not original source papers
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase3-0167-actual-two-papers-stoichiometry-process-error
          path: ${{ runner.temp }}/real-0167/two_primary_papers_observable_identity_0167.json
          if-no-files-found: error
          retention-days: 30
