name: Phase 3 0192 SOLO Original ACS Six Hour Source
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: solo-0192-${{ github.ref }}
  cancel-in-progress: true
jobs:
  genuine-original-publisher-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      OPENBLAS_NUM_THREADS: "2"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OBELIX_COMMIT: "4eaac889809dd489e3bae468c45d5c0e02b9147a"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install frozen source-science CPU requirements
        run: |
          set -euo pipefail
          python -m pip install -c scripts/ci/constraints.txt pytest numpy scipy pyyaml pymatgen smact ase scikit-learn
          python - <<'PY'
          import sklearn
          assert sklearn.__version__=="1.9.1"
          PY
      - name: Validate hostile original author source, units and source-population contracts
        run: |
          python -m pytest -q tests/test_phase3_obelix_solo_oxide_new_source_0192.py tests/test_phase3_obelix_solo_oxide_process_transfer_0191.py
      - name: Fetch pinned publisher OBELiX original TRAIN data
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none --no-checkout https://github.com/NRC-Mila/OBELiX.git "$RUNNER_TEMP/OBELiX-0192"
          git -C "$RUNNER_TEMP/OBELiX-0192" checkout --quiet --detach "$OBELIX_COMMIT"
          test "$(git -C "$RUNNER_TEMP/OBELiX-0192" rev-parse HEAD)" = "$OBELIX_COMMIT"
      - name: Score new original 2022 6-hour O_ONLY source against frozen prior paper predictor
        run: |
          python -m scripts.science.obelix_solo_oxide_new_source_0192 --original-obelix-checkout "$RUNNER_TEMP/OBELiX-0192" --output-dir "$RUNNER_TEMP/0192-original"
      - name: Scientific gate rejects official TEST reading and unauthorized source transfer
        run: |
          python - "$RUNNER_TEMP/0192-original/0192_new_author_six_hour_source_heldout.json" <<'PY'
          import json,math,sys
          x=json.load(open(sys.argv[1],encoding="utf8"))
          assert x["source_train_DOI_groups"]==2 and x["source_heldout_DOI_groups"]==1
          assert x["strict_25C_heldout_DOI_groups"]==0
          assert x["room_temperature_external_DOI_groups"]==1
          assert x["source_meta"]["strict_numeric_25C_admitted"] is False
          assert x["author_conditions"]==10 and x["source_nominal_formulas"]==5
          assert x["original_training_TEST_121_unread"] is True
          assert x["source_meta"]["twelve_hour_powder_covered_conditions_quarantined"]==10
          assert len(x["models"])==3 and all(math.isfinite(z["heldout_MAE_log10_S_cm"]) for z in x["models"].values())
          assert x["higher_temperature_source_winner_pairs"]==5
          assert x["constant_time_pair_high_temp_oracle_heuristic_correct"]==5
          assert not x["scientific_GO"] and not x["production_enabled"]
          assert all(x[k]=="BLOCKED" for k in ("P0_01","P0_02","P0_03"))
          print("0192_REAL_AUTHOR_SOURCE_5_NOMINAL_FORMULA_NO_FALSE_GO_PASS")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: phase3-0192-original-six-hour-source
          path: ${{ runner.temp }}/0192-original/0192_new_author_six_hour_source_heldout.json
          if-no-files-found: error
          retention-days: 30
