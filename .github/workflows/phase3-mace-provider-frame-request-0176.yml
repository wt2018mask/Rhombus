name: Phase 3 0176 Actual Upstream MACE Selected-Frame Provenance Request
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: upstream-p0-source-request-0176-${{ github.ref }}
  cancel-in-progress: true
jobs:
  provider-outreach-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Verify external source-response anti-spoof scientific tests
        run: |
          set -euo pipefail
          python -m pip install -c scripts/ci/constraints.txt pytest
          python -m pytest -q tests/test_phase3_mace_provider_frame_request_0176.py
      - name: Read actual provider question and upstream immutable repo tree
        run: |
          set -euo pipefail
          python -m scripts.science.mace_provider_frame_request_0176 --live-upstream-source --output-dir "$RUNNER_TEMP/0176-provider-evidence"
      - name: Forbid promoting missing training manifest
        run: |
          python - "$RUNNER_TEMP/0176-provider-evidence/provider_selected_frames_request_0176.json" <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1],encoding="utf-8"))
          assert j["request_public_url"].endswith("6186104995")
          assert j["requested_selected_frame_IDs_training_revisions_and_labels"]
          assert j["original_git_tree_file_count"]>=1
          assert j["any_provider_response_is_NOT_automatic_training_certification"]
          assert not j["external_provider_training_manifest_delivered_and_audited"]
          assert not j["checkpoint_selected_MPtrj_and_sAlex_frames_authenticated"]
          assert not j["real_training_material_exposure_audit_authorized"]
          assert j["scientific_GO"] is False
          assert all(j[p]=="BLOCKED" for p in ("P0_01","P0_02","P0_03"))
          print("0176_EXTERNAL_PROVIDER_REQUEST_CONFIRMED_NO_FALSE_P0_PASS")
          PY
      - name: Retain non-sensitive public evidence receipt only
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase3-0176-real-external-selected-frames-request-only
          path: ${{ runner.temp }}/0176-provider-evidence/provider_selected_frames_request_0176.json
          if-no-files-found: error
          retention-days: 30
