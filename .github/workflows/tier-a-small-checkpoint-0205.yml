name: Tier A 0205 MACE Small Full Byte Hash (No Model Execution)
on:
  pull_request:
    paths:
      - ".github/workflows/tier-a-small-checkpoint-0205.yml"
      - "scripts/benchmark/audit_tier_a_small_checkpoint_0205.py"
      - "tests/test_tier_a_small_checkpoint_stream_0205.py"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tier-a-small-sha256-0205-${{ github.ref }}
  cancel-in-progress: true
jobs:
  hash-official-small-checkpoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Verify source-only negative tests
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_tier_a_small_checkpoint_stream_0205.py
      - name: Stream and hash official small model only
        run: |
          python -m scripts.benchmark.audit_tier_a_small_checkpoint_0205 \
            --real-full-byte-audit --output-dir "$RUNNER_TEMP/rhombus-0205-small"
      - name: Strictly reject scientific qualification
        run: |
          python - "$RUNNER_TEMP/rhombus-0205-small/small_model_checksum_0205.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1],encoding="utf-8"))
          r=x["full_byte_observation"]
          assert r["observed_SHA256"]=="2ddb079cee0e131eaaf6912ba581b394551ead283e95c99cfe78c605d10b5736"
          assert r["observed_byte_length"]==32581838 and r["hash_scope"]=="FULL_FILE"
          assert r["model_weights_retained"] is False
          assert x["publisher_signature_verified"] is False
          assert x["training_lineage_verified"] is False
          assert x["model_loaded"] is False and x["model_executed"] is False
          assert x["execution_authorized"] is False
          assert x["scientific_status"]=="SCIENTIFIC_NO_GO_ABSTAIN"
          assert x["benchmark_status"]=="BENCHMARK_NOT_FROZEN"
          print("SMALL_CHECKPOINT_BYTE_ONLY_NOT_SCIENCE_GO")
          PY
      - name: Keep checksum receipt only, not weights
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tier-a-small-full-byte-checksum-0205
          path: ${{ runner.temp }}/rhombus-0205-small/small_model_checksum_0205.json
          if-no-files-found: error
          retention-days: 30
