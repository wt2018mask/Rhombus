name: Phase 3 0180 Solo Real OBELiX Nested Group CV RF Shrinkage
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: solo-0180-nested-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  actual-obelix-original-nested-grouped-science:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OPENBLAS_NUM_THREADS: "2"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OBELIX_PINNED_COMMIT: "4eaac889809dd489e3bae468c45d5c0e02b9147a"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install pinned original OBELiX CPU dependencies
        run: |
          set -euo pipefail
          python -m pip install -c scripts/ci/constraints.txt pytest numpy scipy pyyaml pymatgen smact ase scikit-learn
          python - <<'PY'
          import sklearn
          assert sklearn.__version__=="1.9.1"
          PY
      - name: Falsify nested label exposure and benchmark source drift
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_phase3_obelix_solo_nested_shrinkage_0180.py tests/test_phase3_obelix_real_grouped_oof_0146.py
      - name: Checkout exact old original public OBELiX source with frozen TRAIN TEST
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none --no-checkout https://github.com/NRC-Mila/OBELiX.git "$RUNNER_TEMP/OBELiX-0180"
          git -C "$RUNNER_TEMP/OBELiX-0180" checkout --quiet --detach "$OBELIX_PINNED_COMMIT"
          test "$(git -C "$RUNNER_TEMP/OBELiX-0180" rev-parse HEAD)" = "$OBELIX_PINNED_COMMIT"
      - name: Compute real nested training-only RF mean shrinkage on original frozen 0146 group CV
        run: |
          set -euo pipefail
          python -m scripts.science.obelix_solo_nested_shrinkage_0180 --original-obelix-checkout "$RUNNER_TEMP/OBELiX-0180" --output-dir "$RUNNER_TEMP/solo-source-0180"
      - name: Validate actual finite scores and no TEST use or false experimental claims
        run: |
          python - "$RUNNER_TEMP/solo-source-0180/solo_nested_group_RF_0180.json" <<'PY'
          import json,math,sys
          r=json.load(open(sys.argv[1],encoding="utf-8"))
          assert r["source_commit"]=="4eaac889809dd489e3bae468c45d5c0e02b9147a"
          assert r["original_source_train_records"]==478
          assert r["original_official_TEST_reserved_unread"]==121
          assert r["original_official_TEST_used_for_selection_or_scoring"] is False
          assert r["original_censored_upper_bounds_excluded"]==29
          assert r["source_numeric_records_OOF"]==449
          assert r["source_DOI_formula_connected_groups"]==102
          assert r["inner_selected_without_outer_labels"]
          assert len(r["outer_folds"])==5
          assert sum(f["original_holdout_rows"] for f in r["outer_folds"])==449
          assert all(f["inner_group_identity_overlap"]==0 for f in r["outer_folds"])
          m=r["model_metrics"]
          assert m["train_fold_mean"]["log10_MAE"]==1.86702336
          assert m["original_RF_0147"]["log10_MAE"]==1.94487886
          assert math.isfinite(m["nested_shrunk_RF"]["log10_MAE"])
          assert len(r["paired_public_group_improvement"]["group_bootstrap_delta_95pct_interval"])==2
          assert r["independent_individual_physical_specimens_admitted"]==0
          assert r["scientific_external_GO"] is False
          assert all(r[k]=="BLOCKED" for k in ("historical_P0_01","historical_P0_02","historical_P0_03"))
          print("0180_SOLO_ACTUAL_NUMERIC_BENCHMARK_MEASURED_WITHOUT_FALSE_GO_PASS")
          PY
      - name: Save original source aggregate scores only, never data source rows
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase3-0180-original-TRAIN-solo-nested-grouped-benchmark
          path: ${{ runner.temp }}/solo-source-0180/solo_nested_group_RF_0180.json
          if-no-files-found: error
          retention-days: 30
