name: Phase 3 OBELiX Actual MACE CPU Pilot 0145

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actual-obelix-mace-0145-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pinned-source-actual-mace:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: ${{ github.workspace }}
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      OBELIX_PINNED_COMMIT: "4eaac889809dd489e3bae468c45d5c0e02b9147a"
    steps:
      - name: Check out exact Rhombus source HEAD
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pinned Python 3.11 scientific execution
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install fixed CPU torch, MACE and crystal science dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "torch==2.6.0" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check "mace-torch==0.3.16" "pytest==8.4.2" "pymatgen" "ase" "smact" "scipy" "pyyaml" "numpy"
          python - <<'PY'
          import torch, mace, pymatgen, ase
          print("0145_REAL_CPU_ENVIRONMENT", "torch", torch.__version__,
                "cuda_available", torch.cuda.is_available(),
                "mace_torch_0_3_16", True)
          assert not torch.cuda.is_available()
          PY

      - name: Adversarial tests for TRAIN embargo and actual CIF admissibility
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_phase3_obelix_mace_real_cpu_pilot.py

      - name: Check out precise upstream public OBELiX source commit
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none --no-checkout \
            https://github.com/NRC-Mila/OBELiX.git "$RUNNER_TEMP/OBELiX-0145"
          git -C "$RUNNER_TEMP/OBELiX-0145" checkout --quiet --detach "$OBELIX_PINNED_COMMIT"
          test "$(git -C "$RUNNER_TEMP/OBELiX-0145" rev-parse HEAD)" = "$OBELIX_PINNED_COMMIT"
          test -z "$(git -C "$RUNNER_TEMP/OBELiX-0145" status --porcelain --untracked-files=all)"
          echo "0145_REAL_ORIGINAL_OBELIX_COMMIT_VERIFIED"

      - name: Acquire original upstream MACE-MPA-0 medium binary (never upload)
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --retry 2 --retry-delay 2 --connect-timeout 20 \
            --max-time 240 --max-filesize 80000000 --max-redirs 4 \
            --proto '=https' --proto-redir '=https' \
            "https://github.com/ACEsuit/mace-foundations/releases/download/mace_mpa_0/mace-mpa-0-medium.model" \
            --output "$RUNNER_TEMP/0145-original-mpa0.model"
          python - "$RUNNER_TEMP/0145-original-mpa0.model" <<'PY'
          import sys
          from pathlib import Path
          from scripts.science.mpa0_release_binary_observation import observe_mpa0_official_release_file
          r = observe_mpa0_official_release_file(Path(sys.argv[1]))
          assert r["observed_full_file_byte_count"] == 79462305
          assert r["observed_full_file_sha256"] == "75428afe3a1d7d8062e19bcaabd5c433623cabf308242ec9fb493e38604fb638"
          print("0145_ORIGINAL_MPA0_WHOLE_BINARY_SHA256_PASS")
          PY

      - name: Execute real pinned MACE on original TRAIN crystal structures
        shell: bash
        run: |
          set -euo pipefail
          python scripts/science/obelix_mace_real_cpu_pilot.py \
            --obelix-checkout "$RUNNER_TEMP/OBELiX-0145" \
            --model-binary "$RUNNER_TEMP/0145-original-mpa0.model" \
            --max-selected 3 \
            --output-dir "$RUNNER_TEMP/obelix-0145-real-mace"

      - name: Verify actual source population, nonzero model execution and science NO-GO
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/obelix-0145-real-mace" <<'PY'
          import json
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          assert sorted(x.name for x in p.iterdir()) == ["real_mace_train_pilot.json"]
          r = json.loads((p/"real_mace_train_pilot.json").read_text())
          assert r["scope"] == "OFFICIAL_OBELIX_PUBLIC_TRAIN_DIAGNOSTIC"
          assert r["source"]["source_commit"] == "4eaac889809dd489e3bae468c45d5c0e02b9147a"
          assert r["source"]["all_source_records"] == 599
          assert r["source"]["official_train_records"] == 478
          assert r["source"]["official_test_reserved_without_geometry_inference"] == 121
          assert r["source"]["source_linked_cifs"] == 321
          assert r["selected_original_train_records"] > 0
          assert r["actual_successful_model_singlepoint_structures"] >= 1
          assert r["actual_successful_model_singlepoint_structures"] + r["actual_model_failure_count"] == r["selected_original_train_records"]
          assert len(r["records"]) == r["selected_original_train_records"]
          assert all(x["status"] != "REAL_MODEL_SINGLEPOINT_COMPLETED" or
                     x["energy_eV"] is not None for x in r["records"])
          assert r["model"]["publisher_binary_sha256"] == "75428afe3a1d7d8062e19bcaabd5c433623cabf308242ec9fb493e38604fb638"
          assert r["experimental_conductivity_prediction_count"] == 0
          assert r["experimentally_scored_materials"] == 0
          assert r["independent_physical_materials_authenticated"] is None
          assert r["previously_sealed_new_blind_materials"] == 0
          assert all(r[k] == "BLOCKED" for k in ("P0_01_status", "P0_02_status", "P0_03_status"))
          assert r["scientific_qualification_authorized"] is False
          print("0145_REAL_OBELIX_TRAIN_MACE_CPU_SINGLEPOINT_ENERGY_FORCES_PASS")
          print(json.dumps({
              "train_rows": r["source"]["official_train_records"],
              "eligible_geometry": r["source"]["eligible_distinct_train_source_records_NOT_independent_materials"],
              "actually_executed_mace": r["actual_successful_model_singlepoint_structures"],
              "actual_model_failures": r["actual_model_failure_count"],
              "experimental_transport_scored": 0, "science_go": False,
          }, sort_keys=True))
          PY

      - name: Upload only public TRAIN source-bound calculation results (no model or CIF bytes)
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase3-0145-original-obelix-train-real-mace-cpu-results
          path: ${{ runner.temp }}/obelix-0145-real-mace/real_mace_train_pilot.json
          if-no-files-found: error
          retention-days: 30
