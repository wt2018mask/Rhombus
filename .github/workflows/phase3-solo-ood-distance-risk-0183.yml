name: Phase 3 0183 SOLO Public Chemistry Shift OOD Distance Risk
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: solo-0183-family-diagnostic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-OBELIX-family-risk-distance:
    runs-on: ubuntu-24.04
    timeout-minutes: 27
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OPENBLAS_NUM_THREADS: "2"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OBELIX_PINNED_COMMIT: "4eaac889809dd489e3bae468c45d5c0e02b9147a"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install exact pinned CPU original source science libs
        run: |
          set -euo pipefail
          python -m pip install -c scripts/ci/constraints.txt pytest numpy scipy pyyaml pymatgen smact ase scikit-learn
          python - <<'PY'
          import sklearn
          assert sklearn.__version__=="1.9.1"
          PY
      - name: Train-only source proxy and science null hypothesis tests
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_phase3_obelix_solo_ood_distance_risk_0183.py tests/test_phase3_obelix_solo_family_out_risk_0182.py
      - name: Checkout unchanged OBELiX original published TRAIN source
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none --no-checkout https://github.com/NRC-Mila/OBELiX.git "$RUNNER_TEMP/OBELiX-0183"
          git -C "$RUNNER_TEMP/OBELiX-0183" checkout --quiet --detach "$OBELIX_PINNED_COMMIT"
          test "$(git -C "$RUNNER_TEMP/OBELiX-0183" rev-parse HEAD)" = "$OBELIX_PINNED_COMMIT"
      - name: Calculate actual leave-family-out TRAIN-only standardized OOD risk diagnostics
        run: |
          set -euo pipefail
          python -m scripts.science.obelix_solo_ood_distance_risk_0183 --original-obelix-checkout "$RUNNER_TEMP/OBELiX-0183" --output-dir "$RUNNER_TEMP/0183-ood-original"
      - name: Never promote public retrospective chemistry diagnostic to physical GO
        run: |
          python - "$RUNNER_TEMP/0183-ood-original/solo_public_family_distance_risk_0183.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          assert d["original_upstream_commit"]=="4eaac889809dd489e3bae468c45d5c0e02b9147a"
          assert d["original_public_TRAIN_count"]==478
          assert d["original_public_TEST_reserved_UNREAD"]==121
          assert d["original_TEST_features_or_labels_used_for_selection"] is False
          assert d["original_numeric_source_rows"]==449
          assert d["source_DOI_formula_connected_groups"]==102
          assert sum(v["heldout_source_rows"] for v in d["chemical_families"].values())==449
          assert all(v["source_score"] is None or
              set(v["source_score"]["methods"])==set(d["predeclared_risk_methods"])
              for v in d["chemical_families"].values())
          assert d["post_0182_failure_followup_exploratory_NOT_unseen_confirmatory"]
          assert d["adopt_any_new_risk_policy_as_validated"] is False
          assert d["scientific_external_GO"] is False
          assert all(d[k]=="BLOCKED" for k in ("P0_01","P0_02","P0_03"))
          print("0183_ORIGINAL_TRAIN_ONLY_OOD_RISK_NO_TEST_LEAKAGE_NO_FALSE_GO_PASS")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: phase3-0183-public-original-family-distance-risk
          path: ${{ runner.temp }}/0183-ood-original/solo_public_family_distance_risk_0183.json
          if-no-files-found: error
          retention-days: 30
