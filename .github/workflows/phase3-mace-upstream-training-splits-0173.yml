name: Phase 3 0173 Actual Upstream MACE MPA Training Source Disclosure
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: upstream-mace-source-0173-${{ github.ref }}
  cancel-in-progress: true
jobs:
  official-author-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Negative MACE training selection/source authenticity tests
        run: |
          set -euo pipefail
          python -m pip install -c scripts/ci/constraints.txt pytest
          python -m pytest -q tests/test_phase3_mace_author_training_splits_0173.py
      - name: Read actual GitHub issue author source and training/validation split URLs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m scripts.science.mace_author_training_splits_0173 --live-author-source --output-dir "$RUNNER_TEMP/upstream-mace-0173"
      - name: Require strictly truthful P0-02 partial evidentiary outcome
        run: |
          python - "$RUNNER_TEMP/upstream-mace-0173/upstream_mace_training_splits_0173.json" <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1],encoding="utf-8"))
          assert j["original_comment_author"]=="ilyes319"
          assert j["independent_author_comments_verified"]==2
          assert {v["source_issue_number"] for v in j["author_comment_receipts"]}=={29,42}
          u=j["MACE_MPA0_author_stated_source_training_validation_URLs"]
          assert set(u)=={"sAlex_training","sAlex_validation","MPTrj_training","MPTrj_validation"}
          assert not j["source_hosted_archive_full_bytes_downloaded"]
          assert not j["MPTrj_and_sAlex_exact_selected_frame_ids_attested"]
          assert not j["original_archive_SHA256_and_sizes_rehashed"]
          assert not j["checkpoint_to_preprocess_and_energy_labels_audited"]
          assert not j["full_exact_model_training_lineage_independent_ACCEPTED"]
          assert j["scientific_GO"] is False
          assert all(j[k]=="BLOCKED" for k in ("P0_01","P0_02","P0_03"))
          print("0173_REAL_UPSTREAM_AUTHOR_SOURCE_PARTIAL_NOT_P0_02_PASS")
          PY
      - name: Archive minimal author provenance leads without rehosting original data
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase3-0173-original-upstream-author-split-provenance
          path: ${{ runner.temp }}/upstream-mace-0173/upstream_mace_training_splits_0173.json
          if-no-files-found: error
          retention-days: 30
