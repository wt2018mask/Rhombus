name: Phase 3 0190 SOLO Original Sn Garnet O_ONLY Synthesis Choice
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: solo-0190-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-author-synthesis-choice:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: "2"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OBELIX_COMMIT: "4eaac889809dd489e3bae468c45d5c0e02b9147a"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install frozen original CPU scientific dependencies
        run: |
          set -euo pipefail
          python -m pip install -c scripts/ci/constraints.txt pytest numpy scipy pyyaml pymatgen smact ase scikit-learn
          python - <<'PY'
          import sklearn
          assert sklearn.__version__=="1.9.1"
          PY
      - name: Validate adversarial original 25 C TOTAL source and population
        run: |
          python -m pytest -q tests/test_phase3_obelix_solo_oxide_original_manufacturing_0190.py tests/test_phase3_obelix_solo_oxide_five_doi_0188.py
      - name: Download immutable public original OBELiX TRAIN source
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none --no-checkout https://github.com/NRC-Mila/OBELiX.git "$RUNNER_TEMP/OBELiX-0190"
          git -C "$RUNNER_TEMP/OBELiX-0190" checkout --quiet --detach "$OBELIX_COMMIT"
          test "$(git -C "$RUNNER_TEMP/OBELiX-0190" rev-parse HEAD)" = "$OBELIX_COMMIT"
      - name: Execute first-party 2025 DOI eight-condition real-source model comparison
        run: |
          python -m scripts.science.obelix_solo_oxide_original_manufacturing_0190 --original-obelix-checkout "$RUNNER_TEMP/OBELiX-0190" --output-dir "$RUNNER_TEMP/0190-real"
      - name: Ensure original author result does not authorize scientific production
        run: |
          python - "$RUNNER_TEMP/0190-real/0190_original_manufacturing_choice.json" <<'PY'
          import json,sys,math
          d=json.load(open(sys.argv[1],encoding="utf8"))
          assert d["source_DOI_count"]==1 and d["actual_author_conditions"]==8
          assert d["distinct_nominal_formulas"]==4 and d["official_TEST_reserved_unread"]==121
          assert not d["official_TEST_fields_parsed"]
          assert not d["process_aware_model_trained"] and not d["scientific_GO"]
          assert not d["prospective_blind"] and not d["O_ONLY_production_enabled"]
          assert len(d["route_optimal_authored_labels_visible"])==4
          for model in d["scoreable_model_comparison"].values():
              assert math.isfinite(model["MAE_log10_S_cm"])
              assert model["four_same_composition_route_choice_ties"]==4
          assert all(d[g]=="BLOCKED" for g in ("P0_01","P0_02","P0_03"))
          print("0190_AUTHOR_CONDUCTIVITY_AND_CHOICE_LIMITS_CONFIRMED_NO_GO")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: phase3-0190-author-source-synthesis-choice
          path: ${{ runner.temp }}/0190-real/0190_original_manufacturing_choice.json
          if-no-files-found: error
          retention-days: 30
