name: Phase 3 sAlex Kaggle Launch

on:
  pull_request:
    paths:
      - "data/development/phase3_salex_kaggle_launch_v1.json"
      - ".github/workflows/r2-phase3-salex-kaggle-launch.yml"
      - "tests/test_phase3_salex_kaggle_automation.py"

permissions:
  contents: read

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # resolved v5
        with:
          python-version: "3.11"
      - name: Validate launch contract
        run: |
          python -m pip install -c scripts/ci/constraints.txt pytest pyyaml
          python -m pytest -q tests/test_phase3_salex_kaggle_automation.py
