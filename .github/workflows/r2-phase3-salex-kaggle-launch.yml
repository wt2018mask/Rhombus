name: Phase 3 sAlex Kaggle Launch

on:
  pull_request:
    paths:
      - "data/development/phase3_salex_kaggle_launch_v1.json"
      - ".github/workflows/r2-phase3-salex-kaggle-launch.yml"
      - "tests/test_phase3_salex_kaggle_automation.py"
  push:
    branches:
      - main
    paths:
      - "data/development/phase3_salex_kaggle_launch_v1.json"

permissions:
  contents: read

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate launch contract
        run: |
          python -m pip install -q pytest
          python -m pytest -q tests/test_phase3_salex_kaggle_automation.py

  launch:
    if: github.event_name == 'push' && vars.KAGGLE_PRODUCTION_ENABLED == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact merge commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify one-shot launch authorization
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          import json
          from pathlib import Path
          row = json.loads(
              Path("data/development/phase3_salex_kaggle_launch_v1.json").read_text()
          )
          assert row["armed"] is True
          assert row["launch_once"] is True
          assert row["target_operation"] == "submit"
          assert row["authorization"]["dispatch_kaggle_full_run_controller"] is True
          assert row["authorization"]["unseen_generalization_claim"] is False
          print("SALEX_KAGGLE_MERGE_LAUNCH_AUTHORIZED")
          PY

      - name: Dispatch exact-commit Kaggle controller
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run r2-phase3-salex-kaggle-full-run.yml \
            --ref main \
            -f operation=submit \
            -f expected_commit="$GITHUB_SHA"
          mkdir -p artifacts/phase3-salex-kaggle-launch
          cat > artifacts/phase3-salex-kaggle-launch/launch-receipt.json <<JSON
          {
            "status": "CONTROLLER_DISPATCH_REQUESTED",
            "source_commit": "$GITHUB_SHA",
            "target_workflow": "r2-phase3-salex-kaggle-full-run.yml",
            "operation": "submit"
          }
          JSON

      - name: Upload launch receipt
        uses: actions/upload-artifact@v4
        with:
          name: r2-phase3-salex-kaggle-launch-${{ github.sha }}
          path: artifacts/phase3-salex-kaggle-launch/
          retention-days: 30

