name: Phase 3 0172 Independent-Lab Original JATS Specimen Identity Gate
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: original-hcmut-0172-${{ github.ref }}
  cancel-in-progress: true
jobs:
  actual-independent-lab-paper:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Adversarial original-study specimen-source tests
        run: |
          set -euo pipefail
          python -m pip install -c scripts/ci/constraints.txt pytest
          python -m pytest -q tests/test_phase3_independent_lab_specimen_0172.py
      - name: Fetch real original deposited JATS and bound experimental content
        run: |
          set -euo pipefail
          python -m scripts.science.independent_lab_specimen_0172 --live-original --output-dir "$RUNNER_TEMP/independent-original-0172"
      - name: Require confirmed failure to certify individual pellet from batch labels
        run: |
          python - "$RUNNER_TEMP/independent-original-0172" <<'PY'
          import json,sys
          from pathlib import Path
          directory=Path(sys.argv[1])
          assert sorted(f.name for f in directory.iterdir())==["independent_lab_0172.json"]
          a=json.loads((directory/"independent_lab_0172.json").read_text())
          assert a["DOI"]=="10.1039/d5ra05281e"
          assert a["PMCID"]=="PMC12435569"
          assert a["original_25C_sigma_Scm_series_ratio"]==2.083333333
          assert a["source_batch_labels_count"]==2
          assert a["physically_authenticated_individual_pellets"]==0
          assert a["independent_new_SEALED_materials_enrolled"]==0
          assert a["same_individual_pellet_used_for_EIS_and_diffraction_proven"] is False
          assert a["supplement_file_contents_reviewed"] is False
          assert a["scientific_GO"] is False
          assert all(a[k]=="BLOCKED" for k in ("P0_01","P0_02","P0_03"))
          print("0172_REAL_ORIGINAL_SCIENTIFIC_SAMPLE_IDENTITY_NO_GO_PASS")
          PY
      - name: Store derived aggregate original receipt only
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase3-0172-independent-lab-aggregate-original-jats
          path: ${{ runner.temp }}/independent-original-0172/independent_lab_0172.json
          if-no-files-found: error
          retention-days: 30
