name: Phase 3 0166 Original Published Open Experimental Conductivity Table
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phase3-published-primary-table-0166-${{ github.ref }}
  cancel-in-progress: true
jobs:
  actual-publisher-original-numeric-table:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact Rhombus PR HEAD
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Falsify source DOI, units, censored tokens, number-of-pellets inflation
        run: python -m pytest -q tests/test_phase3_original_sulfide_table_0166.py
      - name: Download ACTUAL publisher-deposited open-access JATS and extract six measurement conditions
        run: |
          set -euo pipefail
          python scripts/science/original_sulfide_measurement_table_0166.py --live-original --output-dir "$RUNNER_TEMP/0166-original-table"
      - name: Verify six actual original primary table processing conditions not specimen truth
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/0166-original-table" <<'PY'
          import json,math,sys
          from pathlib import Path
          r=Path(sys.argv[1])
          assert sorted(p.name for p in r.iterdir())==["original_public_sulfide_condition_table_0166.json"]
          x=json.loads((r/"original_public_sulfide_condition_table_0166.json").read_text())
          assert x["source_DOI"]=="10.1039/c9ra00949c"
          assert x["source_PMCID"]=="PMC9064144"
          assert x["actual_quantitative_table_condition_rows"]==6
          assert x["conductivity_temperature_C"]==25
          assert x["heat_treatment_temperature_IS_NOT_measurement_temperature"] is True
          p=x["six_original_public_process_condition_points"]
          assert [v["heat_treatment_C_not_measurement_temperature"] for v in p]==[150,200,300,400,500,550]
          assert [v["source_ionic_conductivity_mS_per_cm"] for v in p]==[.19,.20,.53,1.49,1.23,1.94]
          assert [v["normalized_ionic_conductivity_S_per_cm"] for v in p]==[.00019,.00020,.00053,.00149,.00123,.00194]
          assert [v["source_activation_energy_kJ_per_mol"] for v in p]==[42.3,40.3,38.3,31.2,27.7,34.9]
          assert all(v["green_compact_pressing_MPa"]==720 and v["original_measurement_temperature_C"]==25 for v in p)
          assert all(v["individual_sample_identifier_verified"] is False for v in p)
          assert all(v["admitted_as_material_level_transport_truth"] is False for v in p)
          assert x["actual_independent_qualified_materials"]==0
          assert x["original_specific_pellet_CIF_physical_join_verified"]==0
          assert x["public_source_NOT_external_sealed_blind"] is True
          assert x["new_physical_MLIP_MD_executed"] is False
          assert x["scientific_GO"] is False
          assert all(x[k]=="BLOCKED" for k in ("P0_01","P0_02","P0_03"))
          print("0166_ACTUAL_PUBLISHER_DEPOSITED_EXPERIMENTAL_TABLE_SIX_CONDITIONS_PASS")
          print(json.dumps({"DOI":x["source_DOI"],"condition_rows":6,"independent_materials":0,"GO":False},sort_keys=True))
          PY
      - name: Retain bounded numeric source evidence, no redistributed paper article
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase3-0166-original-open-sulfide-six-processing-conditions
          path: ${{ runner.temp }}/0166-original-table/original_public_sulfide_condition_table_0166.json
          if-no-files-found: error
          retention-days: 30
