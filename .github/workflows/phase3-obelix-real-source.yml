name: Phase 3 OBELiX Pinned Real-Source 0130

on:
  pull_request:
    paths:
      - ".github/workflows/phase3-obelix-real-source.yml"
      - "scripts/science/obelix_real_source_pipeline.py"
      - "scripts/science/obelix_adjudication_queue.py"
      - "rhombus/qualification/obelix_benchmark_intake.py"
      - "rhombus/qualification/measurement_identity.py"
      - "rhombus/qualification/transport_scoreability.py"
      - "tests/test_phase3_obelix_real_source_pipeline.py"
      - "tests/test_phase3_obelix_adjudication_queue.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: obelix-real-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pinned-public-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OBELIX_PINNED_COMMIT: "4eaac889809dd489e3bae468c45d5c0e02b9147a"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out exact Rhombus commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # resolved v5
        with:
          python-version: "3.11"

      - name: Install frozen baseline scientific import dependencies
        run: |
          set -euo pipefail
          python -m pip install -c scripts/ci/constraints.txt \
            numpy scipy pymatgen smact ase pyyaml

      - name: Compile source pipeline and directly required modules
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/science/obelix_real_source_pipeline.py \
            scripts/science/obelix_adjudication_queue.py \
            rhombus/qualification/obelix_benchmark_intake.py \
            rhombus/qualification/measurement_identity.py \
            rhombus/qualification/transport_scoreability.py

      - name: Acquire exact public OBELiX upstream commit
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$RUNNER_TEMP/OBELiX-0130"
          git clone --quiet --filter=blob:none --no-checkout \
            https://github.com/NRC-Mila/OBELiX.git "$SOURCE"
          git -C "$SOURCE" checkout --quiet --detach "$OBELIX_PINNED_COMMIT"
          test "$(git -C "$SOURCE" rev-parse HEAD)" = "$OBELIX_PINNED_COMMIT"
          test -z "$(git -C "$SOURCE" status --porcelain --untracked-files=all)"
          printf 'OBELIX_SOURCE_COMMIT_VERIFIED %s\n' "$OBELIX_PINNED_COMMIT"

      - name: Run official public source through 0127-0129
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE"
          python scripts/science/obelix_real_source_pipeline.py \
            --obelix-checkout "$RUNNER_TEMP/OBELiX-0130" \
            --output-dir "$RUNNER_TEMP/obelix-0130-evidence"

      - name: Verify source totals, science gate and all output hashes
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/obelix-0130-evidence" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys
          root = Path(sys.argv[1])
          m = json.loads((root / "manifest.json").read_text())
          assert m["upstream_source_commit"] == "4eaac889809dd489e3bae468c45d5c0e02b9147a"
          assert m["scope"] == "OFFICIAL_PUBLIC_DIAGNOSTIC"
          assert (m["source_records"], m["official_train"], m["official_test"],
                  m["linked_cif_files"]) == (599, 478, 121, 321)
          assert m["independent_material_count"] is None
          assert m["qualified_experimental_transport_count"] is None
          assert m["new_externally_blinded_count"] == 0
          assert m["scientific_verdict"] == "INDETERMINATE"
          assert m["scientific_qualification_authorized"] is False
          assert m["model_training_membership_independently_verified"] is False
          assert m["kaggle_gpu_submitted"] is False
          for name, entry in m["files"].items():
              data = (root / name).read_bytes()
              assert hashlib.sha256(data).hexdigest() == entry["sha256"]
              assert len(data) == entry["size_bytes"]
          print("OBELIX_0130_PINNED_FULL_REAL_SOURCE_DIAGNOSTIC_PASS")
          print(json.dumps({
              "source_records": m["source_records"],
              "candidate_overlap_pairs": m["possible_overlap_pairs"],
              "records_with_possible_collision": m["records_with_possible_collision"],
              "scoreability_preflight_status_counts": m["scoreability_preflight_status_counts"],
              "science_go": False,
          }, sort_keys=True))
          PY

      - name: Build source-paper adjudication queues from exact evidence
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE"
          python scripts/science/obelix_adjudication_queue.py \
            --evidence-dir "$RUNNER_TEMP/obelix-0130-evidence" \
            --output-dir "$RUNNER_TEMP/obelix-0131-queue"

      - name: Verify 0131 worklist scope, source hashes and no science GO
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/obelix-0131-queue" "$RUNNER_TEMP/obelix-0130-evidence" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys
          out, original = map(Path, sys.argv[1:])
          report = json.loads((out / "summary.json").read_text())
          upstream = json.loads((original / "manifest.json").read_text())
          assert report["record_count"] == 599
          assert report["official_train_records_in_review"] == 478
          assert report["official_test_records_reserved"] == 121
          assert report["new_independently_adjudicated_materials"] == 0
          assert report["independent_material_count"] is None
          assert report["qualified_experimental_conductivity_count"] is None
          assert report["new_external_blinded_materials"] == 0
          assert report["scientific_qualification_authorized"] is False
          assert (report["upstream_records_jsonl_sha256"]
                  == upstream["files"]["0127/records.jsonl"]["sha256"])
          assert (report["upstream_overlap_jsonl_sha256"]
                  == upstream["files"]["0128/review_pairs.jsonl"]["sha256"])
          assert (report["upstream_scoreability_jsonl_sha256"]
                  == upstream["files"]["0129/scoreability_records.jsonl"]["sha256"])
          for name, key in [
              ("record_review_queue.jsonl", "record_worklist_sha256"),
              ("paper_review_queue.jsonl", "study_worklist_sha256"),
          ]:
              assert hashlib.sha256((out / name).read_bytes()).hexdigest() == report[key]
          records = [json.loads(line) for line in
                     (out / "record_review_queue.jsonl").read_text().splitlines()]
          assert len(records) == 599
          assert sum(x["curation_lane"] == "TEST_RESERVED_AUDIT_ONLY"
                     for x in records) == 121
          assert all(x["curation_lane"] == "TEST_RESERVED_AUDIT_ONLY"
                     for x in records if x["official_original_split"] == "TEST")
          print("OBELIX_0131_REAL_SOURCE_ADJUDICATION_QUEUE_PASS")
          print(json.dumps({
              "records": report["record_count"],
              "train": report["official_train_records_in_review"],
              "test_reserved": report["official_test_records_reserved"],
              "paper_review_groups": report["source_paper_review_groups"],
              "lane_counts": report["all_lanes"],
              "scientific_go": False,
          }, sort_keys=True))
          PY

      - name: Upload 0131 public diagnostic worklists
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # resolved v4
        with:
          name: obelix-0131-public-source-adjudication
          path: ${{ runner.temp }}/obelix-0131-queue/
          if-no-files-found: error
          retention-days: 14

      - name: Upload public source-bound diagnostic evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # resolved v4
        with:
          name: obelix-0130-pinned-public-diagnostic
          path: ${{ runner.temp }}/obelix-0130-evidence/
          if-no-files-found: error
          retention-days: 14
