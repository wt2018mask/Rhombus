name: Phase 3 OBELiX Pinned Real-Source 0130

on:
  pull_request:
    paths:
      - ".github/workflows/phase3-obelix-real-source.yml"
      - "scripts/science/obelix_real_source_pipeline.py"
      - "scripts/science/obelix_adjudication_queue.py"
      - "rhombus/qualification/obelix_benchmark_intake.py"
      - "rhombus/qualification/measurement_identity.py"
      - "rhombus/qualification/transport_scoreability.py"
      - "tests/test_phase3_obelix_real_source_pipeline.py"
      - "tests/test_phase3_obelix_adjudication_queue.py"
      - "docs/PHASE3_OBELIX_ADJUDICATION_0131.md"
      - "data/development/phase3_obelix_adjudication_0131_evidence_v1.json"
      - "scripts/science/obelix_publisher_observation_triage.py"
      - "tests/test_phase3_obelix_publisher_observation_triage.py"
      - "data/benchmarks/known_material/obelix_publisher_observations_0132_v1.json"
      - "docs/PHASE3_OBELIX_PUBLISHER_OBSERVATIONS_0132.md"
      - "data/development/phase3_publisher_observations_0132_evidence_v1.json"
      - "scripts/science/obelix_raw_censor_lineage.py"
      - "tests/test_phase3_obelix_raw_censor_lineage.py"
      - "docs/PHASE3_OBELIX_RAW_CENSOR_0133.md"
      - "data/development/phase3_obelix_raw_censor_0133_evidence_v1.json"
      - "scripts/science/obelix_censor_aware_policy.py"
      - "tests/test_phase3_obelix_censor_aware_policy.py"
      - "docs/PHASE3_CENSOR_AWARE_POLICY_0134.md"
      - "data/development/phase3_censor_aware_policy_0134_evidence_v1.json"
      - "scripts/science/public_transport_benchmark.py"
      - "scripts/science/public_transport_overlap.py"
      - "tests/test_phase3_public_transport_overlap.py"
      - "scripts/science/public_transport_quality_funnel.py"
      - "tests/test_phase3_public_transport_quality_funnel.py"
      - "docs/PHASE3_PUBLIC_BENCHMARK_QUALITY_0136.md"
      - "data/development/phase3_public_benchmark_0136_evidence_v1.json"
      - "scripts/science/public_transport_shon_original_audit.py"
      - "tests/test_phase3_public_transport_shon_original_audit.py"
      - "docs/PHASE3_PUBLIC_SOURCE_ACQUISITION_0137.md"
      - "data/development/phase3_public_acquisition_0137_evidence_v1.json"
      - "data/benchmarks/public_transport/source_registry_0135.json"
      - "README.md"
      - "tests/test_phase3_public_transport_benchmark.py"
      - "data/benchmarks/public_transport/source_registry_0135.json"
      - "docs/PHASE3_PUBLIC_TRANSPORT_BENCHMARK_0135.md"
      - "data/development/phase3_public_benchmark_0135_evidence_v1.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: obelix-real-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pinned-public-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OBELIX_PINNED_COMMIT: "4eaac889809dd489e3bae468c45d5c0e02b9147a"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out exact Rhombus commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # resolved v5
        with:
          python-version: "3.11"

      - name: Install frozen baseline scientific import dependencies
        run: |
          set -euo pipefail
          python -m pip install -c scripts/ci/constraints.txt \
            numpy scipy pymatgen smact ase pyyaml

      - name: Compile source pipeline and directly required modules
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/science/obelix_real_source_pipeline.py \
            scripts/science/obelix_adjudication_queue.py \
            scripts/science/obelix_publisher_observation_triage.py \
            scripts/science/obelix_raw_censor_lineage.py \
            scripts/science/obelix_censor_aware_policy.py \
            scripts/science/public_transport_benchmark.py \
            scripts/science/public_transport_overlap.py \
            scripts/science/public_transport_quality_funnel.py \
            scripts/science/public_transport_shon_original_audit.py \
            rhombus/qualification/obelix_benchmark_intake.py \
            rhombus/qualification/measurement_identity.py \
            rhombus/qualification/transport_scoreability.py

      - name: Acquire exact public OBELiX upstream commit
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$RUNNER_TEMP/OBELiX-0130"
          git clone --quiet --filter=blob:none --no-checkout \
            https://github.com/NRC-Mila/OBELiX.git "$SOURCE"
          git -C "$SOURCE" checkout --quiet --detach "$OBELIX_PINNED_COMMIT"
          test "$(git -C "$SOURCE" rev-parse HEAD)" = "$OBELIX_PINNED_COMMIT"
          test -z "$(git -C "$SOURCE" status --porcelain --untracked-files=all)"
          printf 'OBELIX_SOURCE_COMMIT_VERIFIED %s\n' "$OBELIX_PINNED_COMMIT"

      - name: Run official public source through 0127-0129
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE"
          python scripts/science/obelix_real_source_pipeline.py \
            --obelix-checkout "$RUNNER_TEMP/OBELiX-0130" \
            --output-dir "$RUNNER_TEMP/obelix-0130-evidence"

      - name: Verify source totals, science gate and all output hashes
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/obelix-0130-evidence" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys
          root = Path(sys.argv[1])
          m = json.loads((root / "manifest.json").read_text())
          assert m["upstream_source_commit"] == "4eaac889809dd489e3bae468c45d5c0e02b9147a"
          assert m["scope"] == "OFFICIAL_PUBLIC_DIAGNOSTIC"
          assert (m["source_records"], m["official_train"], m["official_test"],
                  m["linked_cif_files"]) == (599, 478, 121, 321)
          assert m["independent_material_count"] is None
          assert m["qualified_experimental_transport_count"] is None
          assert m["new_externally_blinded_count"] == 0
          assert m["scientific_verdict"] == "INDETERMINATE"
          assert m["scientific_qualification_authorized"] is False
          assert m["model_training_membership_independently_verified"] is False
          assert m["kaggle_gpu_submitted"] is False
          for name, entry in m["files"].items():
              data = (root / name).read_bytes()
              assert hashlib.sha256(data).hexdigest() == entry["sha256"]
              assert len(data) == entry["size_bytes"]
          print("OBELIX_0130_PINNED_FULL_REAL_SOURCE_DIAGNOSTIC_PASS")
          print(json.dumps({
              "source_records": m["source_records"],
              "candidate_overlap_pairs": m["possible_overlap_pairs"],
              "records_with_possible_collision": m["records_with_possible_collision"],
              "scoreability_preflight_status_counts": m["scoreability_preflight_status_counts"],
              "science_go": False,
          }, sort_keys=True))
          PY

      - name: Build source-paper adjudication queues from exact evidence
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE"
          python scripts/science/obelix_adjudication_queue.py \
            --evidence-dir "$RUNNER_TEMP/obelix-0130-evidence" \
            --output-dir "$RUNNER_TEMP/obelix-0131-queue"

      - name: Verify 0131 worklist scope, source hashes and no science GO
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/obelix-0131-queue" "$RUNNER_TEMP/obelix-0130-evidence" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys
          out, original = map(Path, sys.argv[1:])
          report = json.loads((out / "summary.json").read_text())
          upstream = json.loads((original / "manifest.json").read_text())
          assert report["record_count"] == 599
          assert report["official_train_records_in_review"] == 478
          assert report["official_test_records_reserved"] == 121
          assert report["new_independently_adjudicated_materials"] == 0
          assert report["independent_material_count"] is None
          assert report["qualified_experimental_conductivity_count"] is None
          assert report["new_external_blinded_materials"] == 0
          assert report["scientific_qualification_authorized"] is False
          assert (report["upstream_records_jsonl_sha256"]
                  == upstream["files"]["0127/records.jsonl"]["sha256"])
          assert (report["upstream_overlap_jsonl_sha256"]
                  == upstream["files"]["0128/review_pairs.jsonl"]["sha256"])
          assert (report["upstream_scoreability_jsonl_sha256"]
                  == upstream["files"]["0129/scoreability_records.jsonl"]["sha256"])
          for name, key in [
              ("record_review_queue.jsonl", "record_worklist_sha256"),
              ("paper_review_queue.jsonl", "study_worklist_sha256"),
          ]:
              assert hashlib.sha256((out / name).read_bytes()).hexdigest() == report[key]
          records = [json.loads(line) for line in
                     (out / "record_review_queue.jsonl").read_text().splitlines()]
          assert len(records) == 599
          assert sum(x["curation_lane"] == "TEST_RESERVED_AUDIT_ONLY"
                     for x in records) == 121
          assert all(x["curation_lane"] == "TEST_RESERVED_AUDIT_ONLY"
                     for x in records if x["official_original_split"] == "TEST")
          print("OBELIX_0131_REAL_SOURCE_ADJUDICATION_QUEUE_PASS")
          print(json.dumps({
              "records": report["record_count"],
              "train": report["official_train_records_in_review"],
              "test_reserved": report["official_test_records_reserved"],
              "paper_review_groups": report["source_paper_review_groups"],
              "lane_counts": report["all_lanes"],
              "scientific_go": False,
          }, sort_keys=True))
          PY

      - name: Bind first four publisher-page scientific triage observations to real TRAIN records
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE"
          python scripts/science/obelix_publisher_observation_triage.py \
            --evidence-dir "$RUNNER_TEMP/obelix-0130-evidence" \
            --observations-json data/benchmarks/known_material/obelix_publisher_observations_0132_v1.json \
            --output-dir "$RUNNER_TEMP/obelix-0132-publisher"

      - name: Verify original-source publisher DOI bindings and science nonclaims
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/obelix-0132-publisher" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys
          root = Path(sys.argv[1])
          summary = json.loads((root / "summary.json").read_text())
          rows_blob = (root / "publisher_observation_review.jsonl").read_bytes()
          rows = [json.loads(line) for line in rows_blob.splitlines()]
          assert summary["publisher_page_observations"] == 4
          assert summary["official_train_record_count"] == 478
          assert summary["official_test_record_count_reserved"] == 121
          assert summary["observation_scope_counts"]["EXPLICIT_300_C_EXCERPT"] == 2
          assert summary["independently_verified_original_paper_tables"] == 0
          assert summary["verified_independent_material_count"] is None
          assert summary["scientifically_qualified_transport_count"] is None
          assert summary["scientific_qualification_authorized"] is False
          assert hashlib.sha256(rows_blob).hexdigest() == summary["review_rows_jsonl_sha256"]
          assert {x["source_entry_id"] for x in rows} == {"dc8", "472", "0o6", "an2"}
          assert all(x["original_official_split"] == "TRAIN" for x in rows)
          assert all(x["scientific_qualification_authorized"] is False for x in rows)
          print("OBELIX_0132_REAL_PUBLISHER_OBSERVATION_TRIAGE_PASS")
          print(json.dumps({
              "publisher_records": len(rows),
              "high_temperature_excerpts": 2,
              "original_tables_verified": 0,
              "newly_qualified_materials": 0,
              "science_go": False,
          }, sort_keys=True))
          PY

      - name: Upload 0132 public publisher-page diagnostic triage evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # resolved v4
        with:
          name: obelix-0132-public-publisher-page-triage
          path: ${{ runner.temp }}/obelix-0132-publisher/
          if-no-files-found: error
          retention-days: 14

      - name: Restore source Excel upper-bound censoring lost in processed numeric labels
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE"
          python scripts/science/obelix_raw_censor_lineage.py \
            --obelix-checkout "$RUNNER_TEMP/OBELiX-0130" \
            --evidence-dir "$RUNNER_TEMP/obelix-0130-evidence" \
            --output-dir "$RUNNER_TEMP/obelix-0133-raw-censor"

      - name: Verify 37 original limits and prevent public TEST label exposure
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/obelix-0133-raw-censor" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys
          root = Path(sys.argv[1])
          report = json.loads((root / "summary.json").read_text())
          blob = (root / "train_raw_measurement_lineage.jsonl").read_bytes()
          rows = [json.loads(line) for line in blob.splitlines()]
          assert report["processed_source_record_count"] == 599
          assert report["original_train_records"] == 478
          assert report["original_test_records_reserved"] == 121
          assert report["raw_upper_bound_count"] == 37
          assert report["processed_numeric_floor_1e_minus_15_count"] == 37
          assert report["raw_train_censored_records"] + report["raw_test_censored_records_reserved"] == 37
          assert len(rows) == 478
          assert all(r["official_original_split"] == "TRAIN" for r in rows)
          assert all(not r["raw_censor_upper_bound_is_a_point_value"] for r in rows)
          assert all(not r["source_independent_truth_qualified"] for r in rows)
          assert report["scientific_qualification_authorized"] is False
          assert hashlib.sha256(blob).hexdigest() == report["train_record_evidence_sha256"]
          print("OBELIX_0133_ORIGINAL_RAW_CENSOR_LINEAGE_PASS")
          print(json.dumps({
              "raw_censored_upper_bounds": report["raw_upper_bound_count"],
              "processed_surrogate_values": report["processed_numeric_floor_1e_minus_15_count"],
              "train_censored": report["raw_train_censored_records"],
              "test_censored_aggregate_only": report["raw_test_censored_records_reserved"],
              "science_GO": False,
          }, sort_keys=True))
          PY

      - name: Compile TRAIN-only censor-aware label policy from exact original evidence
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE"
          python scripts/science/obelix_censor_aware_policy.py \
            --obelix-checkout "$RUNNER_TEMP/OBELiX-0130" \
            --evidence-dir "$RUNNER_TEMP/obelix-0130-evidence" \
            --raw-lineage-dir "$RUNNER_TEMP/obelix-0133-raw-censor" \
            --output-dir "$RUNNER_TEMP/obelix-0134-censor-policy"

      - name: Verify all 478 original TRAIN labels and prohibit false scoring
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/obelix-0134-censor-policy" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys
          root = Path(sys.argv[1])
          summary = json.loads((root / "summary.json").read_text())
          blob = (root / "train_label_policy.jsonl").read_bytes()
          rows = [json.loads(line) for line in blob.splitlines()]
          assert summary["source_train_records"] == 478
          assert summary["original_censored_train_records"] == 29
          assert summary["original_numeric_unverified_train_records"] == 449
          assert summary["original_other_unresolved_train_records"] == 0
          assert summary["original_test_reserved_aggregate"] == 121
          assert summary["original_test_censored_aggregate"] == 8
          assert summary["point_targets_scientifically_qualified"] == 0
          assert summary["scientific_qualification_authorized"] is False
          assert len(rows) == 478
          assert all(x["official_original_split"] == "TRAIN" for x in rows)
          assert all(x["point_estimate_benchmark_scoring_permitted"] is False for x in rows)
          assert all(x["scientific_material_qualified"] is False for x in rows)
          assert sum(x["raw_measurement_policy_kind"] == "UPPER_BOUND_EXCLUSIVE" for x in rows) == 29
          assert all(x["source_numeric_metadata_s_per_cm"] is None for x in rows
                     if x["raw_measurement_policy_kind"] == "UPPER_BOUND_EXCLUSIVE")
          assert hashlib.sha256(blob).hexdigest() == summary["train_label_policy_jsonl_sha256"]
          print("OBELIX_0134_CENSOR_AWARE_TRAIN_LABEL_POLICY_PASS")
          print(json.dumps({
              "train_metadata": len(rows),
              "censored_inequalities": 29,
              "unqualified_numeric": 449,
              "test_reserved": 121,
              "science_go": False
          }, sort_keys=True))
          PY

      - name: Build permanent-source-reproducible PUBLIC TRAIN benchmark
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE"
          python scripts/science/public_transport_benchmark.py build-obelix-public-train \
            --obelix-checkout "$RUNNER_TEMP/OBELiX-0130" \
            --evidence-dir "$RUNNER_TEMP/obelix-0130-evidence" \
            --raw-lineage-dir "$RUNNER_TEMP/obelix-0133-raw-censor" \
            --registry-json data/benchmarks/public_transport/source_registry_0135.json \
            --output-dir "$RUNNER_TEMP/obelix-0135-public-benchmark"

      - name: Verify public diagnostic corpus count, stable hash, no truth promotion
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/obelix-0135-public-benchmark" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path
          root = Path(sys.argv[1])
          summary = json.loads((root / "summary.json").read_text())
          blob = (root / "public_train_diagnostic.jsonl").read_bytes()
          rows = [json.loads(line) for line in blob.splitlines()]
          assert summary["development_public_train_records"] == 478
          assert summary["development_original_upper_bound_records"] == 29
          assert summary["development_unverified_numeric_records"] == 449
          assert summary["public_original_test_records_reserved_aggregate"] == 121
          assert summary["real_integrated_source_dataset_count"] == 1
          assert summary["registered_candidate_sources"] == 7
          assert summary["scientifically_qualified_transport_records"] == 0
          assert summary["independent_material_count"] is None
          assert summary["scientific_score_authorized"] is False
          assert len(rows) == 478
          assert all(x["partition"] == "DEVELOPMENT_TRAIN_ONLY_PUBLIC" for x in rows)
          assert all(x["eligible_for_scientific_scoring"] is False for x in rows)
          assert hashlib.sha256(blob).hexdigest() == summary["public_train_records_sha256"]
          print("PUBLIC_TRANSPORT_0135_PINNED_OBELIX_TRAIN_BENCHMARK_PASS")
          print(json.dumps({
              "train_source_records": len(rows),
              "uncensored_unqualified": summary["development_unverified_numeric_records"],
              "censored": summary["development_original_upper_bound_records"],
              "test_reserved": 121, "science_go": False,
          }, sort_keys=True))
          PY

      - name: Acquire pinned CaltechDATA published experimental 571-row CSV
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --retry 2 --retry-delay 2 --connect-timeout 20 \
            --max-time 120 --max-filesize 350000 --max-redirs 4 \
            --proto '=https' --proto-redir '=https' \
            "https://data.caltech.edu/records/23mvv-6gk43/files/ionic_conductivity_database.csv?download=1" \
            --output "$RUNNER_TEMP/caltech-original-571.csv"
          test -s "$RUNNER_TEMP/caltech-original-571.csv"

      - name: Verify Caltech original MD5, column schema, and published count
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE"
          python scripts/science/public_transport_benchmark.py audit-caltech-file \
            --input-csv "$RUNNER_TEMP/caltech-original-571.csv" \
            --output-dir "$RUNNER_TEMP/caltech-0135-source-schema"
          python - "$RUNNER_TEMP/caltech-0135-source-schema" <<'PY'
          import json
          import sys
          from pathlib import Path
          root = Path(sys.argv[1])
          audit = json.loads((root / "source_schema_audit.json").read_text())
          assert audit["source_csv_row_count"] == 571
          assert audit["official_file_md5"] == "d1fcf7c9a7694c8f466932721b76b168"
          assert audit["raw_source_republished"] is False
          assert audit["source_licensing_unresolved"] is True
          assert audit["source_scientific_qualified_material_count"] == 0
          print("PUBLIC_TRANSPORT_0135_CALTECH_ORIGINAL_571_CHECKSUM_PASS")
          print(json.dumps({
              "rows": 571, "source_sha256": audit["official_file_sha256"],
              "headers": audit["source_csv_header_columns"],
              "rights": "NOT_CLEARED_FOR_REPUBLICATION",
          }, sort_keys=True))
          PY

      - name: Compare Caltech original DOI overlaps against OBELiX TRAIN only
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE"
          python scripts/science/public_transport_overlap.py \
            --caltech-csv "$RUNNER_TEMP/caltech-original-571.csv" \
            --obelix-benchmark-dir "$RUNNER_TEMP/obelix-0135-public-benchmark" \
            --output-dir "$RUNNER_TEMP/caltech-0135-overlap-aggregate"
          python - "$RUNNER_TEMP/caltech-0135-overlap-aggregate" <<'PY'
          import json
          from pathlib import Path
          import sys
          summary = json.loads(
              (Path(sys.argv[1]) / "cross_source_doi_signal_summary.json").read_text()
          )
          assert summary["source_caltech_original_rows"] == 571
          assert summary["source_obelix_original_train_records"] == 478
          assert summary["caltech_rows_with_exact_obelix_train_DOI_signal"] + (
              summary["caltech_rows_without_exact_obelix_train_DOI_signal"]) == 571
          assert summary["inferred_independent_new_materials"] is None
          assert summary["source_raw_records_redistributed"] is False
          assert summary["source_DOI_tokens_disclosed"] is False
          assert summary["scientific_score_authorized"] is False
          print("PUBLIC_TRANSPORT_0135_CROSS_SOURCE_DOI_AGGREGATE_PASS")
          print(json.dumps({
              "source_rows": 571,
              "candidate_DOI_matched_rows": summary[
                  "caltech_rows_with_exact_obelix_train_DOI_signal"],
              "source_rows_without_train_DOI_match": summary[
                  "caltech_rows_without_exact_obelix_train_DOI_signal"],
              "independent_material_count": None,
          }, sort_keys=True))
          PY

      - name: Audit exact original Caltech 571-row scientific source eligibility funnel
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE"
          python scripts/science/public_transport_quality_funnel.py \
            --caltech-csv "$RUNNER_TEMP/caltech-original-571.csv" \
            --obelix-benchmark-dir "$RUNNER_TEMP/obelix-0135-public-benchmark" \
            --output-dir "$RUNNER_TEMP/caltech-0136-quality-aggregate"
          python - "$RUNNER_TEMP/caltech-0136-quality-aggregate" <<'PY'
          import json
          from pathlib import Path
          import sys
          report = json.loads(
              (Path(sys.argv[1]) / "caltech_source_quality_aggregate.json").read_text()
          )
          assert report["source_original_records"] == 571
          assert report["source_original_file_sha256"] == "868c4bd793d7c31b929787dc69478691b27ced0440d19269075143c98ecd1545"
