name: Owner thermal notebook offline handoff
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "rhombus/atomistics/**"
      - "scripts/kaggle/*thermal*"
      - "scripts/science/thermal_study_0201.py"
      - "scripts/tools/import_manual_thermal.py"
      - "scripts/tools/import_manual_thermal_v2.py"
      - "tests/test_owner_thermal_notebook.py"
      - "tests/test_manual_import_v2.py"
      - "notebooks/Rhombus_0201_Kaggle_CPU.ipynb"
      - "data/development/manual0202/**"
      - ".github/workflows/owner-thermal-notebook.yml"
permissions:
  contents: read
jobs:
  owner-notebook-import-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install offline dependencies only (no model, torch or Kaggle)
        run: python -m pip install -c scripts/ci/constraints.txt pytest numpy scipy pymatgen ase smact pyyaml "mcp==2.3.0" "nbformat==5.10.4"
      - name: Validate ready-to-import Notebook format without executing its cells
        run: python -c 'import nbformat; nbformat.validate(nbformat.read("notebooks/Rhombus_0201_Kaggle_CPU.ipynb", as_version=4))'
      - name: Verify notebook generation, synthetic download/import, MCP and adversarial controls
        run: python -m pytest -q tests/test_owner_thermal_notebook.py tests/test_manual_import_v2.py tests/test_kaggle_thermal_0201.py tests/test_thermal_trace_0201.py tests/test_digital_pilot_0200.py
