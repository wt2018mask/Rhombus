name: Phase 3 0177 Actual Independent Lab Experimental XRD EIS Original Data
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: physical-original-workbooks-0177-${{ github.ref }}
  cancel-in-progress: true
jobs:
  actual-published-experimental-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Fail-closed real workbook scientific identity and safety tests
        run: |
          set -euo pipefail
          python -m pip install -c scripts/ci/constraints.txt pytest
          python -m pytest -q tests/test_phase3_independent_lab_original_workbooks_0177.py
      - name: Read ACTUAL Zenodo first-party experimental spreadsheet bytes (76MB)
        run: |
          set -euo pipefail
          python -m scripts.science.independent_lab_original_workbooks_0177 --real-deposited-workbooks --output-dir "$RUNNER_TEMP/physical-0177"
      - name: Prevent batch sheet names from certifying exact individual specimen
        run: |
          python - "$RUNNER_TEMP/physical-0177/actual_experiment_XRD_EIS_workbook_0177.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          assert d["original_dataset_doi"]=="10.5281/zenodo.17816356"
          assert d["two_full_publisher_spreadsheet_sources_rehashed"]==2
          assert len(d["source_workbook_metadata"])==2
          assert all(f["full_source_archive_byte_observation"] for f in d["source_workbook_metadata"])
          assert all(f["sheet_count"]>=1 for f in d["source_workbook_metadata"])
          assert not d["matched_same_physical_pellet_EIS_XRD_identity_independently_attested"]
          assert d["unique_independent_experimental_materials_certified"]==0
          assert d["public_data_not_prospective_sealed_cohort"]
          assert d["scientific_GO"] is False
          assert all(d[k]=="BLOCKED" for k in ("P0_01","P0_02","P0_03"))
          print("0177_ACTUAL_PRIMARY_EXPERIMENT_DATA_NOT_PELLET_AUTHENTICATION_PASS")
          PY
      - name: Archive provenance and sheet inventory ONLY; no original sheets
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase3-0177-independent-lab-two-original-public-data-digests
          path: ${{ runner.temp }}/physical-0177/actual_experiment_XRD_EIS_workbook_0177.json
          if-no-files-found: error
          retention-days: 30
