name: Thermal trace 0201 offline verification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "rhombus/atomistics/**"
      - "rudeus/mlip/p2.py"
      - "scripts/science/thermal_study_0201.py"
      - "tests/test_thermal_trace_0201.py"
      - "tests/test_kaggle_thermal_0201.py"
      - "data/development/digital0201/**"
      - ".github/workflows/thermal-study-0201.yml"
permissions:
  contents: read
jobs:
  offline-thermal-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install lightweight offline dependencies (no torch, MACE or Kaggle)
        run: python -m pip install -c scripts/ci/constraints.txt pytest numpy scipy pymatgen ase smact pyyaml "mcp==2.3.0"
      - name: Test raw measurements, integrity, ancestry and closed dispatch
        run: python -m pytest -q tests/test_thermal_trace_0201.py tests/test_kaggle_thermal_0201.py tests/test_digital_pilot_0200.py
      - name: Check existing six-tool MCP compatibility on real 0200 evidence
        run: python -m scripts.tools.verify_digital_pilot --output "${{ runner.temp }}/thermal-0201-mcp-compatibility.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: thermal-0201-existing-evidence-mcp-compatibility
          path: ${{ runner.temp }}/thermal-0201-mcp-compatibility.json
          if-no-files-found: error
