name: Phase 3 Actual OBELiX TRAIN Grouped Conductivity OOF 0146

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: obelix-real-oof-0146-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-original-predictive-evaluation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OBELIX_PINNED_COMMIT: 4eaac889809dd489e3bae468c45d5c0e02b9147a
      PYTHONDONTWRITEBYTECODE: "1"
      OPENBLAS_NUM_THREADS: "2"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - name: Checkout exact Rhombus HEAD
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # pinned v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install bounded original source and numerical calculation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -c scripts/ci/constraints.txt \
            pytest numpy scipy pyyaml pymatgen smact ase

      - name: Synthetic red-team leakage, censor and true OOF numerical tests
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_phase3_obelix_real_grouped_oof_0146.py

      - name: Fetch exact original upstream experimental source
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none --no-checkout \
            https://github.com/NRC-Mila/OBELiX.git "$RUNNER_TEMP/OBELiX-0146"
          git -C "$RUNNER_TEMP/OBELiX-0146" checkout --quiet --detach "$OBELIX_PINNED_COMMIT"
          test "$(git -C "$RUNNER_TEMP/OBELiX-0146" rev-parse HEAD)" = "$OBELIX_PINNED_COMMIT"
          test -z "$(git -C "$RUNNER_TEMP/OBELiX-0146" status --porcelain --untracked-files=all)"
          echo "0146_PINNED_ORIGINAL_OBELIX_PUBLIC_SOURCE_VERIFIED"

      - name: Generate genuine 5-fold leakage-aware out-of-fold conductivity predictions
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE"
          python scripts/science/obelix_real_grouped_oof_0146.py \
            --original-obelix-checkout "$RUNNER_TEMP/OBELiX-0146" \
            --output-dir "$RUNNER_TEMP/obelix-original-0146-scored"

      - name: Reject invented sample sizes, censored regression labels and scientific GO
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/obelix-original-0146-scored" <<'PY'
          import json, math, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          assert sorted(p.name for p in root.iterdir()) == ["original_train_grouped_oof.json"]
          r = json.loads((root/"original_train_grouped_oof.json").read_text())
          assert r["original_upstream_commit"] == "4eaac889809dd489e3bae468c45d5c0e02b9147a"
          assert r["original_source_records"] == 599
          assert r["original_source_train_count"] == 478
          assert r["original_official_test_reserved_unread"] == 121
          assert r["original_raw_point_source_records"] == 449
          assert r["original_raw_censored_upper_bounds_excluded"] == 29
          assert r["original_raw_unresolved_excluded"] == 0
          assert 100 <= r["out_of_fold_numeric_source_records_scored"] <= 449
          assert r["out_of_fold_numeric_source_records_scored"] == (
              r["original_raw_point_source_records"]
              - r["original_numeric_but_formula_unparseable"]
              - r["original_numeric_but_invalid_excluded"]
          )
          assert len(r["grouped_folds"]) == 5
          assert sum(f["heldout_record_count"] for f in r["grouped_folds"]) == r["out_of_fold_numeric_source_records_scored"]
          assert sum(f["heldout_connected_identity_groups"] for f in r["grouped_folds"]) == r["shared_doi_formula_connected_components_scored"]
          assert all(f["group_leakage_count"] == 0 for f in r["grouped_folds"])
          assert r["all_folds_have_zero_group_identity_leakage"] is True
          for model in ("trained_ridge_oof_metrics", "training_fold_mean_oof_metrics"):
              assert math.isfinite(r[model]["log10_MAE"])
              assert math.isfinite(r[model]["log10_RMSE"])
              assert r[model]["log10_MAE"] >= 0
          assert r["official_public_TEST_predictions"] == 0
          assert r["model_is_MACE_transport_prediction"] is False
          assert r["independent_physical_material_count_verified"] is None
          assert r["scientific_qualification_authorized"] is False
          assert all(r[k] == "BLOCKED" for k in ("P0_01_status","P0_02_status","P0_03_status"))
          assert not any("private" in k.lower() or "signature" in k.lower() for k in r)
          print("0146_ACTUAL_478_TRAIN_ORIGINAL_RAW_5FOLD_SOURCE_GROUPED_OOF_PASS")
          print(json.dumps({
              "source_train": r["original_source_train_count"],
              "raw_original_numeric": r["original_raw_point_source_records"],
              "censored_removed": r["original_raw_censored_upper_bounds_excluded"],
              "genuine_out_of_fold_predictions": r["out_of_fold_numeric_source_records_scored"],
              "source_connected_groups": r["shared_doi_formula_connected_components_scored"],
              "ridge_mae_log10": r["trained_ridge_oof_metrics"]["log10_MAE"],
              "baseline_mae_log10": r["training_fold_mean_oof_metrics"]["log10_MAE"],
              "scientific_go": False,
          },sort_keys=True))
          PY

      - name: Upload aggregate-only public diagnostic (no original source rows)
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase3-0146-real-obelix-train-grouped-oof-aggregate
          path: ${{ runner.temp }}/obelix-original-0146-scored/original_train_grouped_oof.json
          if-no-files-found: error
          retention-days: 30
