name: Phase 3 Real First-party LAGP Supplementary PDF CIF Probe 0154
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phase3-0154-original-supplementary-${{ github.ref }}
  cancel-in-progress: true
jobs:
  actual-publisher-supplementary-access:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install bounded source review dependencies
        run: python -m pip install 'pytest==8.3.5' 'pypdf==5.9.0'
      - name: Run source intake adversarial tests
        run: python -m pytest -q tests/test_phase3_supplementary_source_0154.py
      - name: Try real publisher DOI supplementary file routes, keep failed access honest
        run: python scripts/science/obelix_supplementary_source_0154.py --live-original --output-dir "$RUNNER_TEMP/0154-original-supplementary-audit"
      - name: Verify exact source Figshare resource DOI and bounded public file metadata
        run: python -m pytest -q tests/test_phase3_figshare_source_0154.py
      - name: Search original ACS Figshare publication resource DOI
        run: python scripts/science/obelix_figshare_source_0154.py --live-original --output-dir "$RUNNER_TEMP/0154-figshare-source-audit"
      - name: Publish bounded aggregate access result only
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase3-0154-acs-original-supplementary-access-audit
          path: |
            ${{ runner.temp }}/0154-original-supplementary-audit/actual_supplementary_access_audit.json
            ${{ runner.temp }}/0154-figshare-source-audit/original_figshare_supplementary_exact_resource_doi.json
          if-no-files-found: error
          retention-days: 30
