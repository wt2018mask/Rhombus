name: Phase 3 0160 Real Connected-Group-Capped Equal-Budget Source Screening
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phase3-0160-original-train-family-ood-${{ github.ref }}
  cancel-in-progress: true
jobs:
  actual-chemistry-source-transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OPENBLAS_NUM_THREADS: "2"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OBELIX_PINNED_COMMIT: "4eaac889809dd489e3bae468c45d5c0e02b9147a"
    steps:
      - name: Checkout exact triggering HEAD without persisted credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up scientific Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned original source and sklearn packages
        run: |
          set -euo pipefail
          python -m pip install -c scripts/ci/constraints.txt \
            pytest numpy scipy pyyaml pymatgen smact ase scikit-learn
          python - <<'PY'
          import sklearn
          assert sklearn.__version__=="1.9.1"
          print("0160_ORIGINAL_SOURCE_PINNED_SCIKIT_LEARN")
          PY
      - name: Falsify family leakage, trial settings, reserved TEST and scientific claims
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_phase3_obelix_group_budget_0160.py
      - name: Checkout exact upstream OBELiX original source
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none --no-checkout \
            https://github.com/NRC-Mila/OBELiX.git "$RUNNER_TEMP/OBELiX-0160"
          git -C "$RUNNER_TEMP/OBELiX-0160" checkout --quiet --detach "$OBELIX_PINNED_COMMIT"
          test "$(git -C "$RUNNER_TEMP/OBELiX-0160" rev-parse HEAD)" = "$OBELIX_PINNED_COMMIT"
          test -z "$(git -C "$RUNNER_TEMP/OBELiX-0160" status --porcelain --untracked-files=all)"
      - name: Actually refit original and weighted RF on outside chemical family training only
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE" python scripts/science/obelix_group_budget_0160.py \
            --original-obelix-checkout "$RUNNER_TEMP/OBELiX-0160" \
            --output-dir "$RUNNER_TEMP/0160-actual-family-OOD-source"
      - name: Validate fixed connected group budget, baseline and no unverified science
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/0160-actual-family-OOD-source" <<'PY'
          import json, math, sys
          from pathlib import Path
          root=Path(sys.argv[1])
          assert [p.name for p in root.iterdir()]==["original_group_capped_screening_0160.json"]
          j=json.loads((root/"original_group_capped_screening_0160.json").read_text())
          assert j["original_source_commit"]=="4eaac889809dd489e3bae468c45d5c0e02b9147a"
          assert j["official_TRAIN_total"]==478
          assert j["official_TEST_reserved_unread"]==121
          assert j["official_TEST_scored_or_trained"] is False
          assert j["eligible_numeric_public_TRAIN"]==449
          assert j["connected_train_identity_groups"]==102
          assert j["fixed_review_group_budgets_percent"]==[10,20]
          assert j["whole_chemistry_family_embargo_reused"] is True
          assert j["group_aggregation_not_an_independent_material_sample"] is True
          assert sum(x["source_rows_heldout"] for x in j["family_source_group_screening"].values())==449
          assert sum(x["group_selection"]=="ACTUAL" for x in j["family_source_group_screening"].values())==4
          for f,record in j["family_source_group_screening"].items():
            if record["group_selection"]!="ACTUAL":
              continue
            g=record["group_capped"]
            assert g["connected_identity_group_count"]<=record["source_rows_heldout"]
            assert g["median_group_numeric_source_label_not_independent_specimen"] is True
            assert set(g["group_budget_selection"])=={"10pct","20pct"}
            for budget,frame in g["group_budget_selection"].items():
              K=frame["review_budget_group_units"]
              N=frame["group_pool_units"]
              assert math.isclose(frame["analytical_uniform_group_draw_expected_oracle_hits"],round(K*K/N,8),abs_tol=1e-8)
              assert frame["original_RF"]["selected_connected_group_units"]==K
              assert frame["balanced_RF_0157"]["selected_connected_group_units"]==K
              assert 0 <= frame["balanced_RF_0157"]["source_group_median_label_oracle_top_hits"] <= K
          assert j["scientific_GO"] is False
          assert j["physical_materials_newly_qualified"]==0
          assert all(j[k]=="BLOCKED" for k in ("P0_01","P0_02","P0_03"))
          print("0160_REAL_ORIGINAL_GROUP_BUDGET_SCREENING_NOT_ROW_DUPLICATION_PASS")
          print(json.dumps({k:{
            "rows":v["source_rows_heldout"],
            "groups":v.get("group_capped",{}).get("connected_identity_group_count"),
            "group_budget":v.get("group_capped",{}).get("group_budget_selection"),
            "original_0159_row_hits":v.get("original_0159_row_budget_comparator")}
            for k,v in j["family_source_group_screening"].items()},sort_keys=True))
          PY
      - name: Save only source aggregate family errors and no source rows
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase3-0160-real-source-group-capped-budget-screening
          path: ${{ runner.temp }}/0160-actual-family-OOD-source/original_group_capped_screening_0160.json
          if-no-files-found: error
          retention-days: 30
