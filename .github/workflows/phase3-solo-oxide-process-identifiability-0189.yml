name: Phase 3 0189 Original O_ONLY Process Identifiability
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: solo-0189-identifiability-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-oxide-process-bound:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OPENBLAS_NUM_THREADS: "2"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OBELIX_PIN: "4eaac889809dd489e3bae468c45d5c0e02b9147a"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Original-source frozen CPU dependencies
        run: |
          set -euo pipefail
          python -m pip install -c scripts/ci/constraints.txt pytest numpy scipy pyyaml pymatgen smact ase scikit-learn
          python - <<'PY'
          import sklearn
          assert sklearn.__version__=="1.9.1"
          PY
      - name: Process identifiability mathematical / source-negative tests
        run: |
          python -m pytest -q tests/test_phase3_obelix_solo_oxide_process_identifiability_0189.py tests/test_phase3_obelix_solo_oxide_five_doi_0188.py
      - name: Exact original OBELiX TRAIN checkout
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none --no-checkout https://github.com/NRC-Mila/OBELiX.git "$RUNNER_TEMP/OBELiX-0189"
          git -C "$RUNNER_TEMP/OBELiX-0189" checkout --quiet --detach "$OBELIX_PIN"
          test "$(git -C "$RUNNER_TEMP/OBELiX-0189" rev-parse HEAD)" = "$OBELIX_PIN"
      - name: Re-read five genuine original author DOI sources and calculate exact oracle floor
        run: |
          set -euo pipefail
          python -m scripts.science.obelix_solo_oxide_process_identifiability_0189 --original-obelix-checkout "$RUNNER_TEMP/OBELiX-0189" --output-dir "$RUNNER_TEMP/0189-original"
      - name: Check explicit negative science claims and no official TEST
        run: |
          python - "$RUNNER_TEMP/0189-original/0189_original_oxide_process_identifiability.json" <<'PY'
          import json,sys,math
          d=json.load(open(sys.argv[1]))
          a=d["composition_only_oracle"]
          assert len(d["primary_source_DOIs"])==5 and a["source_reference_conditions"]==22
          assert a["original_DOI_groups"]==5
          assert a["nominal_formulas_with_nonidentical_target_values"]>=2
          assert a["observation_rows_in_variable_nominal_groups"]>=14
          assert 0<a["row_MAE_best_truth_selected_composition_constant_lower_bound_log10"]<a["frozen_O_ONLY_RF_row_MAE_log10"]
          assert 0<a["equal_DOI_macro_MAE_best_truth_selected_composition_constant_lower_bound_log10"]<a["frozen_O_ONLY_RF_equal_DOI_macro_MAE_log10"]
          assert a["oracle_uses_all_external_truth_NO_valid_out_of_sample_prediction"]
          assert d["new_independent_DOI_added"]==0
          assert d["original_publisher_TEST_reserved_UNREAD"]==121 and not d["original_publisher_TEST_fields_ever_parsed"]
          assert d["frozen_models_retrained_only_on_original_OBELIX_TRAIN"]
          assert not d["physical_scientific_GO"] and not d["production_O_ONLY_model_enabled"]
          assert all(d[k]=="BLOCKED" for k in ("original_SOURCE_P0_01","original_SOURCE_P0_02","original_SOURCE_P0_03"))
          print("0189_NO_PROCESS_MODEL_AND_NO_FALSE_EXTERNAL_SOURCE_GO_PASS")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: phase3-0189-five-original-doi-manufacturing-identifiability
          path: ${{ runner.temp }}/0189-original/0189_original_oxide_process_identifiability.json
          if-no-files-found: error
          retention-days: 30
