name: Trusted Kaggle thermal controller
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [preflight, reconcile]
        default: preflight
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: read
concurrency:
  group: trusted-kaggle-thermal-controller
  cancel-in-progress: false
jobs:
  control:
    if: >-
      github.repository == 'wt2018mask/Rhombus' &&
      github.ref == 'refs/heads/main' &&
      (vars.RHOMBUS_AUTOMATION_ENABLED == 'true' ||
       (github.event_name == 'workflow_dispatch' && inputs.operation == 'preflight'))
    environment: kaggle-production
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install reviewed provider client
        run: python -m pip install kaggle==2.2.5 kagglesdk==0.1.38
      - name: Authenticate and reconcile at most one provider observation
        env:
          GH_TOKEN: ${{ github.token }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME || secrets.KAGGLE_USERNAME }}
          RHOMBUS_POLICY_SHA256: ${{ vars.RHOMBUS_POLICY_SHA256 }}
          OPERATION: ${{ inputs.operation || 'reconcile' }}
          KAGGLE_CONFIG_DIR: ${{ runner.temp }}/kaggle-config
        run: python -m rhombus.automation.cli "$OPERATION" --output "$RUNNER_TEMP/thermal-output"
      - name: Select retained output for independent verification
        id: output
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/thermal-output/retrieval.json"; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        if: steps.output.outputs.ready == 'true'
        with:
          ref: 474df8faa7484b87f19e5679336192939598e1f7
          path: frozen-science
          persist-credentials: false
      - name: Install offline numerical verifier only
        if: steps.output.outputs.ready == 'true'
        run: python -m pip install -c frozen-science/scripts/ci/constraints.txt numpy scipy ase pymatgen smact pyyaml
      - name: Verify without provider or GitHub secrets
        if: steps.output.outputs.ready == 'true'
        run: python -m rhombus.automation.cli verify --output "$RUNNER_TEMP/thermal-output" --science-root frozen-science
      - name: Archive raw evidence, verify readback, publish evidence registry
        if: steps.output.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RHOMBUS_POLICY_SHA256: ${{ vars.RHOMBUS_POLICY_SHA256 }}
        run: python -m rhombus.automation.cli publish --output "$RUNNER_TEMP/thermal-output"
