name: Phase 3 Real OBELiX Source Group Failure Audit 0148

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase3-original-science-a-0148-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-train-real-model-failure-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OPENBLAS_NUM_THREADS: "2"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OBELIX_PINNED_COMMIT: "4eaac889809dd489e3bae468c45d5c0e02b9147a"
    steps:
      - name: Checkout exact Rhombus HEAD
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # pinned v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Configure Python 3.11 scientific environment
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pinned v5
        with:
          python-version: "3.11"

      - name: Install immutable source / numerical / sklearn dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -c scripts/ci/constraints.txt \
            pytest numpy scipy pyyaml pymatgen smact ase scikit-learn
          python - <<'PY'
          import sklearn
          assert sklearn.__version__ == "1.9.1"
          PY

      - name: Run all frozen group baseline and 0148 adversarial science tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_phase3_obelix_real_grouped_oof_0146.py \
            tests/test_phase3_rf_mlp_frozen_group_oof_0147.py \
            tests/test_phase3_obelix_group_failure_audit_0148.py

      - name: Retrieve exact original publisher-controlled OBELiX source
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none --no-checkout \
            https://github.com/NRC-Mila/OBELiX.git "$RUNNER_TEMP/OBELiX-0148"
          git -C "$RUNNER_TEMP/OBELiX-0148" checkout --quiet --detach "$OBELIX_PINNED_COMMIT"
          test "$(git -C "$RUNNER_TEMP/OBELiX-0148" rev-parse HEAD)" = "$OBELIX_PINNED_COMMIT"
          test -z "$(git -C "$RUNNER_TEMP/OBELiX-0148" status --porcelain --untracked-files=all)"
          echo "0148_EXACT_PUBLISHER_SOURCE_COMMIT_AND_READONLY_CONTRACT_PASS"

      - name: Execute real fixed-fold RF MLP ridge mean failure and chemistry audit
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE"
          python scripts/science/obelix_group_failure_audit_0148.py \
            --original-obelix-checkout "$RUNNER_TEMP/OBELiX-0148" \
            --output-dir "$RUNNER_TEMP/0148-real-group-failure-audit"

      - name: Assert original coverage, exact score preservation and public science NO-GO
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/0148-real-group-failure-audit" <<'PY'
          from pathlib import Path
          import json, math, sys
          root=Path(sys.argv[1])
          assert sorted(x.name for x in root.iterdir()) == ["real_source_failure_aggregate.json"]
          r=json.loads((root/"real_source_failure_aggregate.json").read_text())
          assert r["underlying_original_source"] == "4eaac889809dd489e3bae468c45d5c0e02b9147a"
          assert r["original_official_train_count"] == 478
          assert r["official_public_TEST_reserved_unread"] == 121
          assert r["official_public_TEST_predictions"] == 0
          assert r["original_censored_upper_bound_source_records_excluded"] == 29
          assert r["original_public_TRAIN_numeric_source_rows_predicted_per_model"] == 449
          assert r["original_identity_connected_groups"] == 102
          assert r["fixed_0146_folds_and_original_0147_models_unchanged"] is True
          assert sum(f["source_records"] for f in r["per_fold_error_and_raw_label_spread"]) == 449
          assert sum(x["source_record_count"] for x in r["predeclared_anion_element_presence_proxy_bins"].values()) == 449
          assert r["model_global_log10_MAE"] == {
              "training_fold_mean_0146": 1.86702336,
              "random_forest": 1.94487886,
              "mlp": 2.26334295,
              "ridge_0146": 2.29511512
          }
          g=r["source_group_size_concentration"]
          assert g["connected_DOI_formula_groups"] == 102
          assert g["largest_connected_group_source_row_count"] >= 1
          assert g["top_5_groups_source_rows"] >= g["largest_connected_group_source_row_count"]
          assert 1 <= g["source_row_group_size_kish_effective_count"] <= 102
          assert g["independent_material_count_authenticated"] is None
          assert r["author_protocol_difference"]["exact_publisher_paper_protocol_reproduced"] is False
          assert len(r["author_protocol_difference"]["author_source_code_verified_readonly"]) == 3
          assert r["new_models_trained_or_hyperparameters_selected_after_seeing_results"] is False
          assert r["actual_independent_physical_specimen_count"] is None
          assert r["scientific_claim_GO"] is False
          assert all(r[key] == "BLOCKED" for key in ("P0_01_status","P0_02_status","P0_03_status"))
          print("0148_ACTUAL_ORIGINAL_SOURCE_GROUP_FAILURE_DIAGNOSTICS_449_102_PASS")
          print(json.dumps({
              "rows":449,
              "connected_groups":102,
              "largest_group":g["largest_connected_group_source_row_count"],
              "top_5_fraction":g["top_5_groups_fraction_of_scored_source_records"],
              "effective_groups_heuristic":g["source_row_group_size_kish_effective_count"],
              "model_minus_mean_macro":{k:v["equal_connected_group_macro_model_minus_mean_log10_MAE"]
                  for k,v in r["paired_model_minus_mean_group_error_diagnostics"].items()},
              "anion_proxy":{k:{"rows":v["source_record_count"],"groups":v["connected_group_count"],
                  "rf_minus_mean":v.get("rf_minus_mean_log10_MAE")}
                  for k,v in r["predeclared_anion_element_presence_proxy_bins"].items()},
              "science_go":False
          },sort_keys=True))
          PY

      - name: Publish only aggregate source group failure diagnostics, never row-level truths
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # pinned v4
        with:
          name: phase3-0148-original-train-chemistry-source-group-failure-audit
          path: ${{ runner.temp }}/0148-real-group-failure-audit/real_source_failure_aggregate.json
          if-no-files-found: error
          retention-days: 30
