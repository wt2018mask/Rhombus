name: Phase 3 Real Original OBELiX TRAIN CIF Occupancy Audit 0151

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: original-0151-train-cif-occupancy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-original-cif-occupancy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      ORIGINAL_OBELIX_COMMIT: "4eaac889809dd489e3bae468c45d5c0e02b9147a"
    steps:
      - name: Check out exact triggering Rhombus HEAD
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Configure Python 3.11 science environment
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install pinned scientific CIF parser dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -c scripts/ci/constraints.txt \
            pytest numpy scipy pyyaml pymatgen smact ase scikit-learn

      - name: Fail closed on source TEST, occupancy edits and counterfeit evidence
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_phase3_obelix_benchmark_intake.py \
            tests/test_phase3_obelix_mace_real_cpu_pilot.py \
            tests/test_phase3_obelix_original_cif_occupancy_0151.py

      - name: Acquire original source and check immutable public Git SHA
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none --no-checkout \
            https://github.com/NRC-Mila/OBELiX.git "$RUNNER_TEMP/OBELiX-0151"
          git -C "$RUNNER_TEMP/OBELiX-0151" checkout --quiet --detach "$ORIGINAL_OBELIX_COMMIT"
          test "$(git -C "$RUNNER_TEMP/OBELiX-0151" rev-parse HEAD)" = "$ORIGINAL_OBELIX_COMMIT"
          test -z "$(git -C "$RUNNER_TEMP/OBELiX-0151" status --porcelain --untracked-files=all)"
          echo "0151_FIRST_PARTY_ORIGINAL_OBELIX_PIN_PASS"

      - name: Parse and audit every original public TRAIN matched CIF
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE"
          python scripts/science/obelix_original_cif_occupancy_0151.py \
            --original-obelix-checkout "$RUNNER_TEMP/OBELiX-0151" \
            --output-dir "$RUNNER_TEMP/0151-original-cif-audit"

      - name: Verify actual real-source totals, no TEST parse and scientific NO-GO
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/0151-original-cif-audit" <<'PY'
          import json,sys
          from pathlib import Path
          d=Path(sys.argv[1])
          assert sorted(x.name for x in d.iterdir())==["cif_occupancy_source_audit_aggregate.json"]
          r=json.loads((d/"cif_occupancy_source_audit_aggregate.json").read_text())
          assert r["scope"]=="OFFICIAL_OBELIX_TRAIN_SOURCE_CIF_AUDIT"
          assert r["original_commit"]=="4eaac889809dd489e3bae468c45d5c0e02b9147a"
          assert r["original_all_source_rows"]==599
          assert r["original_official_train_rows"]==478
          assert r["original_official_test_rows_reserved_unparsed"]==121
          assert r["all_original_source_linked_CIFs_including_reserved_TEST"]==321
          assert sum(r[k] for k in ("train_exact_match_source_CIF_count",
              "train_close_match_CIF_count_NOT_phase_qualified",
              "train_no_matched_CIF_count"))==478
          assert sum(r["train_CIF_parse_category_counts"].values())==(
              r["train_exact_match_source_CIF_count"]
              +r["train_close_match_CIF_count_NOT_phase_qualified"])
          assert r["reproduced_0145_train_model_eligible_ORDERED_source_structures"]==39
          assert r["reproduced_0145_structure_screen_status"]["OFFICIAL_TEST_RESERVED_UNPARSED"]==121
          assert r["partial_occupancy_rounded_into_ordered_model"] is False
          assert r["geometry_CIF_close_match_promoted_to_exact_phase"] is False
          assert 0 <= r["source_paper_review_queue_count"] <= 10
          assert r["primary_source_papers_actually_read"]==0
          assert r["specimen_phase_and_exact_measurement_temperature_verified"]==0
          assert r["new_independent_physical_materials_qualified"]==0
          assert r["MD_or_ionic_transport_computed_this_checkpoint"] is False
          assert r["scientific_qualification_authorized"] is False
          assert all(r[k]=="BLOCKED" for k in ("P0_01_status","P0_02_status","P0_03_status"))
          assert all(row["paper_review_status"]=="NOT_REVIEWED" and
                     row["phase_identity"]=="UNATTESTED" and
                     row["original_cif_match"]=="Match"
                     for row in r["review_queue_first_party_public_DOI_and_source_CIF_links_ONLY"])
          print("0151_REAL_ORIGINAL_TRAIN_CIF_OCCUPANCY_PHASE_SOURCE_AUDIT_PASS")
          print(json.dumps({
              "total_source":599, "train":478, "test_reserved":121,
              "train_exact_CIF":r["train_exact_match_source_CIF_count"],
              "train_close_CIF":r["train_close_match_CIF_count_NOT_phase_qualified"],
              "train_parsed":r["train_parsed_structures_with_site_diagnostics"],
              "fractional_occupancy_structures":r["train_structures_containing_fractional_occupancy_sites"],
              "vacancy_structures":r["train_structures_containing_partial_vacancy_sites"],
              "ordered_MACE_admitted":39,
              "DOI_review_candidates":r["source_paper_review_queue_count"],
              "paper_verified":0,
              "science_GO":False,
          },sort_keys=True))
          PY

      - name: Upload only bounded public DOI review queue and aggregate scientific diagnostics
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase3-0151-firstparty-obelix-train-occupancy-paper-review-queue
          path: ${{ runner.temp }}/0151-original-cif-audit/cif_occupancy_source_audit_aggregate.json
          if-no-files-found: error
          retention-days: 30
