name: Phase 3 0178 Actual XRD EIS Worksheet Physical Sample Identity
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: actual-specimen-worksheet-0178-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-source-cell-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Falsify sample-name-as-pellet and source misidentification
        run: |
          set -euo pipefail
          python -m pip install -c scripts/ci/constraints.txt pytest
          python -m pytest -q tests/test_phase3_original_pellet_label_bridge_0178.py
      - name: Read ACTUAL publisher original supporting workbook cell headings
        run: |
          set -euo pipefail
          python -m scripts.science.original_pellet_label_bridge_0178 --live-original-cells --output-dir "$RUNNER_TEMP/physical-cell-evidence-0178"
      - name: Confirm read-only cell-scoped source but no fabricated pellet linkage
        run: |
          python - "$RUNNER_TEMP/physical-cell-evidence-0178/real_original_eis_xrd_labels_0178.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          assert d["original_supporting_workbook_SHA256_independently_rehashed"]=="22640fa76a00d90626cfe8fc2f3d4fc20ee71c3f87aba865f064960f1e3cd05e"
          assert len(d["actual_source_XRD_EIS_sheets_inspected"])==4
          assert all(v["text_row_count"]>=0 for v in d["actual_original_worksheet_text_rows"].values())
          assert d["overlapping_labels_are_NOT_same_physical_pellet_authentication"]
          assert d["new_authenticated_individual_physical_materials"]==0
          assert d["scientific_GO"] is False
          assert all(d[k]=="BLOCKED" for k in ("P0_01","P0_02","P0_03"))
          print("0178_ORIGINAL_REAL_XRD_EIS_CELL_IDENTITY_NOT_PELLET_CERTIFICATION_PASS")
          PY
      - name: Upload bounded actual public experimental cell-label evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase3-0178-original-public-cell-label-provenance
          path: ${{ runner.temp }}/physical-cell-evidence-0178/real_original_eis_xrd_labels_0178.json
          if-no-files-found: error
          retention-days: 30
