name: Phase 3 0162 Actual Physical Target and Experimental Measurement Scope
on:
  pull_request:
    paths:
      - "scripts/science/obelix_public_manuscript_0153.py"
      - "scripts/science/obelix_original_si_cif_0155.py"
      - "scripts/science/obelix_lagp_*.py"
      - "scripts/science/obelix_train_only_transport_0163.py"
      - "scripts/science/obelix_original_figure*.py"
      - "scripts/science/obelix_figshare_source_0154.py"
      - "scripts/science/obelix_supplementary_source_0154.py"
      - "tests/test_phase3_public_manuscript_0153.py"
      - "tests/test_phase3_lagp*.py"
      - "tests/test_phase3_strict_train_only_0163.py"
      - "scripts/ci/constraints.txt"
      - ".github/workflows/phase3-original-lagp-measurement-target-0162.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phase3-original-si-v-train-0162-${{ github.ref }}
  cancel-in-progress: true
jobs:
  actual-physical-source-crystal-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OPENBLAS_NUM_THREADS: "2"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      ORIGINAL_OBELIX_COMMIT: 4eaac889809dd489e3bae468c45d5c0e02b9147a
    steps:
      - name: Checkout exact triggering Rhombus commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Python 3.11 for first-party crystallography
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install pinned 0151 scientific dependencies
        run: |
          set -euo pipefail
          python -m pip install -c scripts/ci/constraints.txt pytest numpy scipy pyyaml pymatgen smact ase scikit-learn
          python -m pip install 'pypdf==5.9.0'
      - name: Test structure match and occupancy falsification fixtures
        run: python -m pytest -q tests/test_phase3_lagp_measurement_target_0162.py
      - name: Fetch exact publisher OBELiX first-party original repository
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none --no-checkout https://github.com/NRC-Mila/OBELiX.git "$RUNNER_TEMP/OBELiX-0162"
          git -C "$RUNNER_TEMP/OBELiX-0162" checkout --quiet --detach "$ORIGINAL_OBELIX_COMMIT"
          test "$(git -C "$RUNNER_TEMP/OBELiX-0162" rev-parse HEAD)" = "$ORIGINAL_OBELIX_COMMIT"
          test -z "$(git -C "$RUNNER_TEMP/OBELiX-0162" status --porcelain --untracked-files=all)"
      - name: Download genuine pinned SI ZIP then analyze publisher 8 CIF against 2 original TRAIN
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE" python scripts/science/obelix_lagp_measurement_target_0162.py \
            --original-obelix-checkout "$RUNNER_TEMP/OBELiX-0162" \
            --output-dir "$RUNNER_TEMP/0162-real-CIF-join" --live-original
      - name: Falsify false specimen conductivity qualification and check actual primary paper method
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/0162-real-CIF-join" <<'PY'
          import json,math,sys
          from pathlib import Path
          p=Path(sys.argv[1])
          assert sorted(x.name for x in p.iterdir())==["lagp_physical_measurement_target_audit_0162.json"]
          j=json.loads((p/"lagp_physical_measurement_target_audit_0162.json").read_text())
          assert j["original_OBELIX_pinned_commit"]=="4eaac889809dd489e3bae468c45d5c0e02b9147a"
          assert j["original_publication_DOI"]=="10.1021/acsami.8b00842"
          assert j["original_source_total_records"]==599
          assert j["original_official_TRAIN"]==478
          assert j["original_official_TEST_not_used_as_target_or_model_comparator"]==121
          assert j["note_legacy_intake_reads_TEST_metadata_so_NOT_strong_unparsed_claim"] is True
          assert j["publisher_original_CIF_zip_sha256"]=="dc88a0a83857b172ebe7a8194eb1b50148f117d6cddb39f1adbb628ac7d1c382"
          assert j["Rietveld_SI_pdf_sha256"]=="db747a82235860cdcd21a798ad51d2fd0d22b906d3a213cd31e9ea9af72d94d3"
          paper=j["author_manuscript_method_scope"]
          assert paper["source_sha256"]=="e5fc22ec69db52f403f8776cbcf10e11ed771d6abf69b3c3ac610bb30edfe368"
          assert paper["paper_pages"]==26
          assert paper["reciprocal_resistance_must_not_be_silently_converted_to_sigma"] is True
          assert paper["definite_temperature_bulk_total_sample_label_links"]==0
          pair=j["source_pair_diagnostics"]
          assert len(pair["two_original_TRAIN_literature_source_records"])==2
          assert math.isfinite(pair["source_label_ratio_log10_x0p6_minus_x0p2"])
          assert pair["the_ratio_is_NOT_a_matched_specimen_transport_effect"]
          assert all(v["independently_qualified_transport_truth"] is False for v in pair["two_original_TRAIN_literature_source_records"])
          assert all(v["exact_temperature_K_verified"] is False and v["bulk_or_total_measurement_identity_verified"] is False for v in pair["two_original_TRAIN_literature_source_records"])
          assert j["source_CIF_to_actual_pellet_measurement_qualified"]==0
          assert j["original_exact_temperature_bulk_total_conductivity_qualified"]==0
          assert j["physically_independent_experimental_materials_qualified"]==0
          assert j["MLIP_finite_T_transport_actual_executed"] is False
          assert j["scientific_GO"] is False
          assert all(j[k]=="BLOCKED" for k in ("P0_01","P0_02","P0_03"))
          serialized=(p/"lagp_physical_measurement_target_audit_0162.json").read_text()
          assert "reported_ionic_conductivity_text" not in serialized
          print("0162_REAL_PINNED_SOURCE_TRAIN_LABEL_VS_PHYSICAL_MEASUREMENT_TARGET_PASS")
          print(json.dumps({
            "labels_log10_ratio":pair["source_label_ratio_log10_x0p6_minus_x0p2"],
            "source_pair_trend":pair["processed_source_pair_reported_trend"],
            "actual_paper_method_pages":paper["transport_method_indicator_pages"],
            "qualified":0,"scientific_GO":False,
          },sort_keys=True))
          PY
      - name: Retain only bounded crystallographic source aggregate without CIF structures
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase3-0162-real-LAGP-publisher-measurement-scope-and-unqualified-source-labels
          path: ${{ runner.temp }}/0162-real-CIF-join/lagp_physical_measurement_target_audit_0162.json
          if-no-files-found: error
          retention-days: 30
