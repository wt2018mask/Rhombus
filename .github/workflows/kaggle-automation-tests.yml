name: Kaggle controller offline verification
on:
  pull_request:
    paths:
      - 'rhombus/automation/**'
      - 'tests/test_kaggle_automation*'
      - 'tests/test_kaggle_bootstrap_inspection.py'
      - 'scripts/tools/validate_kaggle_bootstrap.py'
      - 'scripts/tools/kaggle_deployment_inventory.py'
      - 'scripts/tools/rehearse_kaggle_minimal.py'
      - 'tests/test_kaggle_minimal_rehearsal.py'
      - '.github/workflows/kaggle-*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -c scripts/ci/constraints.txt pytest numpy scipy ase pymatgen smact pyyaml 'mcp==2.3.0' kaggle==2.2.5 kagglesdk==0.1.38
      - run: python -m pytest -q tests/test_kaggle_minimal_rehearsal.py tests/test_kaggle_bootstrap_inspection.py tests/test_kaggle_automation.py tests/test_kaggle_automation_science.py tests/test_kaggle_thermal_0201.py tests/test_owner_thermal_notebook.py
      - run: python scripts/development/continuity.py check
