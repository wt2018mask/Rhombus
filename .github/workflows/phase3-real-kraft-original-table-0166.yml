name: Phase 3 0166 Real Kraft 2018 SI Table S17 Bulk Resistance and Temperature
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phase3-original-kraft-s17-0166-${{ github.ref }}
  cancel-in-progress: true
jobs:
  actual-primary-original-paper-table:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - name: Checkout triggering exact Rhombus HEAD
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Use Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install bounded real-source PDF numerics
        run: |
          set -euo pipefail
          python -m pip install -c scripts/ci/constraints.txt pytest numpy
          python -m pip install 'pypdf==5.9.0'
      - name: Falsify invented physical units and schema drift
        run: python -m pytest -q tests/test_phase3_kraft_original_table_s17_0166.py
      - name: Analyze original institutional author SI exact tabulated 120 Ohm observations
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE" python scripts/science/obelix_kraft_original_tabular_impedance_0166.py \
            --output-dir "$RUNNER_TEMP/0166-kraft-original-primary-numerical"
      - name: Validate original quantitative source and no figure-label or pellet inflation
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/0166-kraft-original-primary-numerical" <<'PY'
          import json, math, sys
          from pathlib import Path
          p=Path(sys.argv[1])
          assert sorted(x.name for x in p.iterdir())==["source_Kraft_TableS17_bulk_R_T_diagnostic_0166.json"]
          d=json.loads((p/"source_Kraft_TableS17_bulk_R_T_diagnostic_0166.json").read_text())
          assert d["DOI"]=="10.1021/jacs.8b10282"
          assert d["source_institutional_host"]=="purehost.bath.ac.uk"
          assert d["source_original_SI_pages"]==23
          assert d["source_TableS17_pdf_page_one_based"]==20
          assert len(d["source_original_SI_SHA256"])==64
          assert d["original_S17_canonical_numeric_table_SHA256"]=="1eb7ad5527b18040239b341ba6171aad3453113c700c2edf4ca271a1eba84d7d"
          assert d["original_institutional_full_PDF_SHA256_not_immutable_due_to_cover_or_metadata"] is True
          q=d["quantitative_physical_bulk_R_temperature_evidence"]
          assert q["original_distinct_nominal_compositions"]==10
          assert q["nominal_temperature_rows"]==12
          assert q["unique_temperatures_K"]==11
          assert q["raw_source_fit_resistance_values_read_NOT_REPUBLISHED"]==120
          assert q["source_original_thickness_column_values_read"]==10
          assert q["duplicate_298K_Rbulk_records"]==10
          assert q["repeat_298K_rows_not_proven_independent_pellets"] is True
          assert q["higher_nominal_x_bulk_fitting_reported_unresolved_in_SI"] is True
          assert q["R_bulk_ohm_NOT_S_per_cm"] is True
          assert q["electrode_area_for_each_original_table_column_verified"] is False
          assert q["individual_true_sample_labels_qualified"]==0
          for v in q["298K_two_table_rows_R_relative_differences_pct"].values():
              assert math.isfinite(v) and 0<=v<=100
          for v in q["Arrhenius_bulk_R_only_activation_Ea_eV_DIAGNOSTIC"].values():
              assert math.isfinite(v) and 0<v<=2
          assert d["new_independent_blind"] is False
          assert d["original_source_table_rows_republished"] is False
          assert d["source_original_pdf_or_numerical_table_uploaded"] is False
          assert d["transport_MD_executed"] is False
          assert all(d[k]=="BLOCKED" for k in ("P0_01","P0_02","P0_03"))
          assert d["scientific_GO"] is False
          print("0166_REAL_2018_KRAFT_SI_SOURCE_TABLE_120_RBULK_VALUES_10_COMPOSITIONS_ACTUALLY_PARSED_PASS")
          print(json.dumps({"source_sha256":d["source_original_SI_SHA256"],
              "original_numeric_counts":120,
              "RT_internal_difference":q["298K_two_table_rows_R_relative_differences_pct"],
              "Arrhenius_bulk_R_diagnostics":q["Arrhenius_bulk_R_only_activation_Ea_eV_DIAGNOSTIC"],
              "admitted_independent_physical_specimens":0},sort_keys=True))
          PY
      - name: Save ONLY bounded primary-source statistical receipt no raw table or PDF
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase3-0166-real-kraft-original-table17-bulk-R-T
          path: ${{ runner.temp }}/0166-kraft-original-primary-numerical/source_Kraft_TableS17_bulk_R_T_diagnostic_0166.json
          if-no-files-found: error
          retention-days: 30
