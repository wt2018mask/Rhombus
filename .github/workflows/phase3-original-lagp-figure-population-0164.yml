name: Phase 3 0164 Original LAGP Figure 6 Inverse R vs Figure 7 Multi-Sample Conductivity
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phase3-original-si-v-train-0164-${{ github.ref }}
  cancel-in-progress: true
jobs:
  actual-physical-source-crystal-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OPENBLAS_NUM_THREADS: "2"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      ORIGINAL_OBELIX_COMMIT: 4eaac889809dd489e3bae468c45d5c0e02b9147a
    steps:
      - name: Checkout exact triggering Rhombus commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Python 3.11 for first-party crystallography
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install pinned 0151 scientific dependencies
        run: |
          set -euo pipefail
          python -m pip install -c scripts/ci/constraints.txt pytest numpy scipy pyyaml pymatgen smact ase scikit-learn
          python -m pip install 'pypdf==5.9.0'
      - name: Test structure match and occupancy falsification fixtures
        run: python -m pytest -q tests/test_phase3_lagp_figure_population_0164.py
      - name: Fetch exact publisher OBELiX first-party original repository
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none --no-checkout https://github.com/NRC-Mila/OBELiX.git "$RUNNER_TEMP/OBELiX-0164"
          git -C "$RUNNER_TEMP/OBELiX-0164" checkout --quiet --detach "$ORIGINAL_OBELIX_COMMIT"
          test "$(git -C "$RUNNER_TEMP/OBELiX-0164" rev-parse HEAD)" = "$ORIGINAL_OBELIX_COMMIT"
          test -z "$(git -C "$RUNNER_TEMP/OBELiX-0164" status --porcelain --untracked-files=all)"
      - name: Download genuine pinned SI ZIP then analyze publisher 8 CIF against 2 original TRAIN
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE" python scripts/science/obelix_lagp_figure_population_0164.py \
            --original-obelix-checkout "$RUNNER_TEMP/OBELiX-0164" \
            --output-dir "$RUNNER_TEMP/0164-real-CIF-join"
      - name: Verify frozen original paper Figure 6 inverse R / Figure 7 multi-pellet experimental identity
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/0164-real-CIF-join" <<'PY'
          import json,math,sys
          from pathlib import Path
          p=Path(sys.argv[1])
          assert sorted(x.name for x in p.iterdir())==["original_LAGP_figure_population_truth_0164.json"]
          q=json.loads((p/"original_LAGP_figure_population_truth_0164.json").read_text())
          assert q["pinned_OBELIX_commit"]=="4eaac889809dd489e3bae468c45d5c0e02b9147a"
          assert q["original_DOI"]=="10.1021/acsami.8b00842"
          assert q["original_author_pdf_sha256"]=="e5fc22ec69db52f403f8776cbcf10e11ed771d6abf69b3c3ac610bb30edfe368"
          paper=q["figure_audit"]
          assert paper["original_manuscript_pages"]==26
          assert paper["figure7_anchor_pages"]==[16]
          assert paper["figure7_population_word_cue_pages_NOT_a_singular_sample"]==[17]
          assert paper["figure7_mean_SD_caption_anchored_to_same_or_next_page"] is True
          assert paper["figure6_reciprocal_R_cue_pages_NOT_a_S_per_cm"]==[15]
          assert paper["original_primary_PDF_words_do_NOT_digitize_any_figure"] is True
          assert paper["exact_per_sample_figure7_sigma_S_per_cm_NOT_extracted"] is True
          assert q["TEST_original_CSV_formula_DOI_conductivity_fields_parsed"]==0
          assert q["TEST_source_raw_bytes_passed_over_in_mixed_original_file"] is True
          assert math.isclose(q["original_processed_TRAIN_log10_label_contrast_x0p6_minus_x0p2"],0.76937121,abs_tol=1e-8)
          assert {r["original_TRAIN_id"] for r in q["original_TRAIN_CIF_contexts"]}=={"0fh","1dm"}
          assert q["figure6_semantics"]=="REPRESENTATIVE_x0p6_ARRHENIUS_INVERSE_RESISTANCE"
          assert q["figure7_semantics"]=="NOMINAL_x_SERIES_MULTI_SAMPLE_MEAN_ROOM_TEMPERATURE_BULK_AND_TOTAL_SIGMA_WITH_SD"
          for row in q["original_TRAIN_CIF_contexts"]:
            assert row["source_row_qualified_to_any_figure_point"] is False
            assert row["physical_transport_model_input_admitted"] is False
            assert row["figure6"]["source_observable"]=="RECIPROCAL_RESISTANCE"
            assert "INVERSE_R_NOT_CONDUCTIVITY_S_PER_CM" in row["figure6"]["blockers"]
            assert row["figure7_bulk"]["scientific_unit"]=="NOMINAL_COMPOSITION_PELLET_POPULATION"
            assert row["figure7_total"]["scientific_unit"]=="NOMINAL_COMPOSITION_PELLET_POPULATION"
            assert "FIGURE7_POPULATION_MEAN_NOT_AN_INDIVIDUAL_SPECIMEN" in row["figure7_total"]["blockers"]
            assert "INDEPENDENT_EXPERIMENTAL_CUSTODIAN_ATTESTATION_ABSENT" in row["figure7_total"]["blockers"]
          assert q["original_measured_physical_pellets_qualified"]==0
          assert q["original_fig7_group_means_digitized_qualified"]==0
          assert q["actual_transport_MD_executed"] is False
          assert q["scientific_GO"] is False
          assert all(q[k]=="BLOCKED" for k in ("P0_01","P0_02","P0_03"))
          raw=(p/"original_LAGP_figure_population_truth_0164.json").read_text()
          assert "reported_ionic_conductivity_text" not in raw
          print("0164_ACTUAL_PRIMARY_PAPER_FIG6_R_INVERSE_V_FIG7_MULTI_PELLET_MEAN_PASS")
          print(json.dumps({"figure6_primary_PDF_page_cues":paper["figure6_reciprocal_R_cue_pages_NOT_a_S_per_cm"],
                            "figure7_primary_PDF_pop_pages":paper["figure7_population_word_cue_pages_NOT_a_singular_sample"],
                            "qualified":0,"scientific_GO":False},sort_keys=True))
          PY
      - name: Retain only bounded crystallographic source aggregate without CIF structures
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase3-0164-original-figure6-inverse-R-figure7-population-truth
          path: ${{ runner.temp }}/0164-real-CIF-join/original_LAGP_figure_population_truth_0164.json
          if-no-files-found: error
          retention-days: 30
