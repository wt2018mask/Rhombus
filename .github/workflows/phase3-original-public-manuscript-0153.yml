name: Phase 3 Public Original Author Manuscript Evidence 0153

on:
  pull_request:
    paths:
      - "scripts/science/obelix_public_manuscript_0153.py"
      - "scripts/science/obelix_original_si_cif_0155.py"
      - "scripts/science/obelix_lagp_*.py"
      - "scripts/science/obelix_train_only_transport_0163.py"
      - "scripts/science/obelix_original_figure*.py"
      - "scripts/science/obelix_figshare_source_0154.py"
      - "scripts/science/obelix_supplementary_source_0154.py"
      - "tests/test_phase3_public_manuscript_0153.py"
      - "tests/test_phase3_lagp*.py"
      - "tests/test_phase3_strict_train_only_0163.py"
      - "scripts/ci/constraints.txt"
      - ".github/workflows/phase3-original-public-manuscript-0153.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase3-0153-public-manuscript-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actual-firstparty-author-manuscript:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout immutable triggering Rhombus HEAD
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Configure Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install bounded PDF parser and testing
        run: python -m pip install 'pypdf==5.9.0' 'pytest==8.3.5'
      - name: Prove document identity and negative science gates in fixtures
        run: python -m pytest -q tests/test_phase3_public_manuscript_0153.py
      - name: Acquire actual OSTI public manuscript bytes and extract bounded evidence
        run: |
          set -euo pipefail
          python scripts/science/obelix_public_manuscript_0153.py --live-original --output-dir "$RUNNER_TEMP/0153-original-osti-manuscript"
      - name: Only upload bounded source/metadata verification receipt
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase3-0153-original-osti-accepted-manuscript-aggregate
          path: ${{ runner.temp }}/0153-original-osti-manuscript/original_author_manuscript_access_audit.json
          if-no-files-found: error
          retention-days: 30
