name: Retrospective 0198 observation budget (no new measurements)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "rhombus/qualification/observation_budget.py"
      - "scripts/science/observation_budget_0198.py"
      - "tests/test_observation_budget_0198.py"
      - "data/development/observation_budget_0198*"
      - ".github/workflows/phase3-observation-budget-0198.yml"
permissions:
  contents: read
jobs:
  frozen-offline-utility:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Validate analytic, hostile and source-binding controls
        run: |
          set -euo pipefail
          python -m pip install -c scripts/ci/constraints.txt pytest
          python -m pytest -q tests/test_observation_budget_0198.py
      - name: Recompute exact finite-cohort metrics with original source receipt
        run: |
          set -euo pipefail
          python -m scripts.science.observation_budget_0198 --output "$RUNNER_TEMP/observation-budget.json"
          python - "$RUNNER_TEMP/observation-budget.json" <<'PY'
          import json, sys
          from pathlib import Path
          observed = json.loads(Path(sys.argv[1]).read_text())
          retained = json.loads(Path('data/development/observation_budget_0198_result_v1.json').read_text())
          assert {k: v for k, v in observed.items() if k != 'cost'} == {k: v for k, v in retained.items() if k != 'cost'}
          assert observed['scientific_GO'] is False
          print('FROZEN_OFFLINE_METRICS_REPRODUCED_NOT_NEW_SOURCE_AUTHENTICATION')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retrospective-observation-budget-0198
          path: ${{ runner.temp }}/observation-budget.json
          if-no-files-found: error
