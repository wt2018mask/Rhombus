name: R2 AI MCP Stdio Contract

on:
  pull_request:
    paths:
      - "rhombus/domain/context.py"
      - "rhombus/tools/evidence_query.py"
      - "tests/test_research_context_mcp.py"
      - "rhombus/tools/mcp_server.py"
      - "tests/test_r2_ai_mcp_stdio.py"
      - "tests/test_r2_ai_mcp_process.py"
      - "scripts/tools/verify_mcp_stdio.py"
      - "scripts/tools/verify_computed_evidence_0197.py"
      - "rhombus/tools/read_only_analysis.py"
      - "rhombus/tools/evidence_manifest.py"
      - "rhombus/tools/task_proposal.py"
      - "rhombus/tools/task_status.py"
      - "tests/test_r2_ai_task_status.py"
      - "tests/test_r2_ai_task_status_mcp.py"
      - "tests/test_r2_ai_task_proposal.py"
      - "tests/test_r2_ai_task_proposal_mcp.py"
      - "tests/test_r2_ai_manifest.py"
      - "tests/test_r2_ai_manifest_mcp.py"
      - "tests/test_r2_ai_analysis.py"
      - "tests/test_r2_ai_analysis_mcp.py"
      - "docs/AI_TOOLS_MCP_STDIO_V1.md"
      - "pyproject.toml"
      - ".github/workflows/r2-ai-mcp-stdio-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mcp-stdio:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install official MCP SDK v2 and tests
        run: python -m pip install -q "mcp>=2,<3" pytest pymatgen ase
      - name: MCP discovery and call integrity
        run: >-
          python -m pytest -q
          tests/test_r2_ai_tools.py tests/test_r2_ai_mcp_stdio.py
          tests/test_r2_ai_analysis.py tests/test_r2_ai_analysis_mcp.py
          tests/test_r2_ai_manifest.py tests/test_r2_ai_manifest_mcp.py
          tests/test_r2_ai_task_proposal.py tests/test_r2_ai_task_proposal_mcp.py
          tests/test_r2_ai_task_status.py tests/test_r2_ai_task_status_mcp.py
          tests/test_r2_ai_mcp_process.py
          tests/test_research_context_mcp.py
      - name: Measure real stdio lifecycle on retained historical evidence
        run: python -m scripts.tools.verify_mcp_stdio --output "${{ runner.temp }}/rhombus-mcp-stdio.json"
      - name: Retrieve actual source-out computational evidence through existing tools
        run: python -m scripts.tools.verify_computed_evidence_0197 --output "${{ runner.temp }}/rhombus-computed-evidence.json"
      - name: Retain MCP protocol observations
        uses: actions/upload-artifact@v4
        with:
          name: rhombus-real-mcp-stdio
          path: |
            ${{ runner.temp }}/rhombus-mcp-stdio.json
            ${{ runner.temp }}/rhombus-computed-evidence.json
