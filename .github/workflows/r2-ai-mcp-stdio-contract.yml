name: R2 AI MCP Stdio Contract

on:
  pull_request:
    paths:
      - "rhombus/tools/mcp_server.py"
      - "tests/test_r2_ai_mcp_stdio.py"
      - "tests/test_r2_ai_preflight_mcp.py"
      - "tests/test_r2_ai_preflight.py"
      - "rhombus/tools/preflight.py"
      - "docs/AI_TOOLS_MCP_STDIO_V1.md"
      - "pyproject.toml"
      - ".github/workflows/r2-ai-mcp-stdio-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mcp-stdio:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install official MCP SDK v2 and tests
        run: python -m pip install -q "mcp>=2,<3" pytest "numpy>=1.24" "pymatgen>=2023.0.0" "ase>=3.26.0" "scipy>=1.10" "pyyaml>=6" "smact>=2.5" "ase-db-backends>=0.10"
      - name: MCP discovery and call integrity
        run: python -m pytest -q tests/test_r2_ai_tools.py tests/test_r2_ai_mcp_stdio.py tests/test_r2_ai_preflight.py tests/test_r2_ai_preflight_mcp.py
