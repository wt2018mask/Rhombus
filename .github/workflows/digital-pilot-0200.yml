name: Digital pilot 0200 retained-computation verification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "rhombus/qualification/digital.py"
      - "rhombus/qualification/pilot_artifacts.py"
      - "scripts/science/digital_pilot_0200.py"
      - "scripts/tools/verify_digital_pilot.py"
      - "tests/test_digital*"
      - "data/development/0200.json"
      - "data/development/digital_pilot_0200_protocol_v1.json"
      - "data/development/digital0200/**"
      - ".github/workflows/digital-pilot-0200.yml"
permissions:
  contents: read
jobs:
  verify-retained-digital-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install offline verification dependencies (no MLIP download or inference)
        run: python -m pip install -c scripts/ci/constraints.txt pytest numpy scipy pymatgen ase smact pyyaml "mcp==2.3.0"
      - name: Verify source normalization, claims and real retained artifacts
        run: python -m pytest -q tests/test_digital_qualification.py tests/test_digital_pilot_0200.py
      - name: Retrieve actual computed evidence through existing MCP server
        run: python -m scripts.tools.verify_digital_pilot --output "${{ runner.temp }}/digital-pilot-mcp.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: digital-pilot-retained-evidence-verification
          path: ${{ runner.temp }}/digital-pilot-mcp.json
          if-no-files-found: error
