name: R2 Security Contract

on:
  pull_request:
    paths:
      - ".github/workflows/r2-phase3-salex-kaggle-full-run.yml"
      - ".github/workflows/r2-phase3-salex-kaggle-launch.yml"
      - ".github/workflows/r2-security-contract.yml"
      - "scripts/security/**"
      - "tests/test_r2_security.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -q pytest
      - run: python -m pytest -q tests/test_r2_security.py tests/test_phase3_salex_kaggle_automation.py
