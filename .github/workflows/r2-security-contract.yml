name: R2 Security Contract

on:
  pull_request:
    paths:
      - ".github/workflows/r2-phase3-salex-kaggle-full-run.yml"
      - ".github/workflows/r2-phase3-salex-kaggle-launch.yml"
      - ".github/workflows/r2-security-contract.yml"
      - "scripts/security/**"
      - "tests/test_r2_security.py"
      - "tests/test_redteam_*.py"
      - "tests/test_security_outgoing_artifact_scanner.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # resolved v5
        with:
          python-version: "3.11"
      - run: python -m pip install -c scripts/ci/constraints.txt pytest pyyaml
      - run: python -m pytest -q tests/test_r2_security.py tests/test_phase3_salex_kaggle_automation.py tests/test_security_outgoing_artifact_scanner.py tests/test_redteam_artifact_safety.py tests/test_redteam_kaggle_replay_safety.py
