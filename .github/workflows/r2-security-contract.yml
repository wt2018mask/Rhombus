name: R2 Security Boundary Contract

on:
  pull_request:
    paths:
      - ".github/workflows/r2-phase3-salex-kaggle-full-run.yml"
      - ".github/workflows/r2-phase3-salex-kaggle-launch.yml"
      - "scripts/security/**"
      - "tests/test_r2_security_boundaries.py"
      - ".github/workflows/r2-security-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install small test runtime
        run: python -m pip install -q pytest
      - name: Audit API-key boundary and fail-closed upload guard
        run: |
          python -m pytest -q tests/test_r2_security_boundaries.py
          python scripts/security/scan_secrets.py docs/SECURITY_AUDIT_2026_10_08.md
