name: Phase 3 0187 SOLO Two Original DOI O_ONLY 25C Total Comparison
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: solo-0187-${{ github.ref }}
  cancel-in-progress: true
jobs:
  actual-second-publisher-doi:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: "2"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OBELIX_PIN: "4eaac889809dd489e3bae468c45d5c0e02b9147a"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install frozen source numerical dependencies and PDF page parser
        run: |
          set -euo pipefail
          python -m pip install -c scripts/ci/constraints.txt pytest numpy scipy pyyaml pymatgen smact ase scikit-learn
          python -m pip install pymupdf==1.26.5
          python - <<'PY'
          import sklearn,fitz
          assert sklearn.__version__=="1.9.1"
          print("PyMuPDF",fitz.VersionBind)
          PY
      - name: Focused hostile secondary PDF and TEST embargo checks
        run: |
          python -m pytest -q tests/test_phase3_obelix_solo_oxide_independent_doi_0187.py tests/test_phase3_obelix_solo_oxide_primary_0186.py
      - name: Freeze genuine OBELiX original TRAIN source
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none --no-checkout https://github.com/NRC-Mila/OBELiX.git "$RUNNER_TEMP/OBELiX-0187"
          git -C "$RUNNER_TEMP/OBELiX-0187" checkout --quiet --detach "$OBELIX_PIN"
          test "$(git -C "$RUNNER_TEMP/OBELiX-0187" rev-parse HEAD)" = "$OBELIX_PIN"
      - name: Fetch two ORIGINAL publisher papers and score five single material reference states
        run: |
          set -euo pipefail
          python -m scripts.science.obelix_solo_oxide_independent_doi_0187 --original-obelix-checkout "$RUNNER_TEMP/OBELiX-0187" --output-dir "$RUNNER_TEMP/0187-two-doi"
      - name: Enforce exact two DOI original-source truth/no extra samples/no false GO
        run: |
          python - "$RUNNER_TEMP/0187-two-doi/0187_two_primary_DOI_O_ONLY_25C_total.json" <<'PY'
          import json,sys,math
          x=json.load(open(sys.argv[1]))
          assert x["independent_publisher_papers"]==2
          assert x["source_DOI_groups"]==["10.1039/d5ra03917g","10.1016/j.jeurceramsoc.2024.116936"]
          assert x["measurement_temperature_C"]==25 and x["measurement_type"]=="AUTHOR_TOTAL_IONIC_CONDUCTIVITY"
          assert x["source_0186_reference_rows"]==2 and x["source_0187_single_material_reference_rows"]==3
          assert x["source_0187_heterogeneous_two_layer_composite_EXCLUDED"]==2
          assert x["different_nominal_formulas_total"]==3
          assert x["original_OBELIX_TEST_reserved_UNREAD"]==121 and not x["original_OBELIX_TEST_field_decode_performed"]
          assert len(x["source_independent_paper_macro_results"])==4
          assert all(math.isfinite(v["equal_independent_paper_macro_MAE_log10"]) for v in x["source_independent_paper_macro_results"].values())
          assert x["two_paper_group_bootstrap_forbidden"] and not x["two_paper_group_robust_success"]
          assert not x["production_O_ONLY_router_enabled"] and not x["scientific_EXTERNAL_GO"]
          assert all(x[k]=="BLOCKED" for k in ("P0_01","P0_02","P0_03"))
          print("0187_ORIGINAL_TWO_DIFFERENT_DOI_FIVE_REAL_SINGLE_MATERIAL_STATES_NO_FALSE_GO_PASS")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: phase3-0187-two-author-DOI-original-O_ONLY-25C-total
          path: ${{ runner.temp }}/0187-two-doi/0187_two_primary_DOI_O_ONLY_25C_total.json
          if-no-files-found: error
          retention-days: 30
