name: Phase 3 0187 SOLO Three Original DOI O_ONLY 25C Total Author Tables
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: solo-0187-original-${{ github.ref }}
  cancel-in-progress: true
jobs:
  genuine-original-jats-multi-doi:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OPENBLAS_NUM_THREADS: "2"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OBELIX_COMMIT: "4eaac889809dd489e3bae468c45d5c0e02b9147a"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Frozen original CPU numerical dependencies
        run: |
          python -m pip install -c scripts/ci/constraints.txt pytest numpy scipy pyyaml pymatgen smact ase scikit-learn
          python - <<'PY'
          import sklearn
          assert sklearn.__version__=="1.9.1"
          PY
      - name: Run hostile author-table and TEST leakage tests
        run: |
          python -m pytest -q tests/test_phase3_obelix_solo_oxide_jats_three_doi_0187.py tests/test_phase3_obelix_solo_oxide_primary_0186.py
      - name: Checkout original OBELiX TRAIN exact source
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none --no-checkout https://github.com/NRC-Mila/OBELiX.git "$RUNNER_TEMP/OBELiX-0187"
          git -C "$RUNNER_TEMP/OBELiX-0187" checkout --quiet --detach "$OBELIX_COMMIT"
          test "$(git -C "$RUNNER_TEMP/OBELiX-0187" rev-parse HEAD)" = "$OBELIX_COMMIT"
      - name: Read original 2025 RSC 2022 Nanomaterials 2020 Materials JATS and score real 25C TOTAL
        run: |
          set -euo pipefail
          python -m scripts.science.obelix_solo_oxide_jats_three_doi_0187 --original-obelix-checkout "$RUNNER_TEMP/OBELiX-0187" --output-dir "$RUNNER_TEMP/0187-originals"
      - name: Deny any fabricated independent material success
        run: |
          python - "$RUNNER_TEMP/0187-originals/0187_three_original_doi_25C_TOTAL.json" <<'PY'
          import json,sys,math
          x=json.load(open(sys.argv[1],encoding="utf8"))
          assert x["DOI_groups"]==3 and len(x["source_DOIs"])==3
          assert x["experimental_condition_rows"]==13
          assert x["measurement_temperature_C"]==25
          assert x["target"]=="AUTHOR_TOTAL_IONIC_CONDUCTIVITY_S_CM"
          assert x["original_official_TEST_RESERVED_UNREAD"]==121 and not x["original_official_TEST_parsed"]
          assert x["2022_initial_Li_theoretical_formula_not_certified_pellet"]
          assert x["three_DOI_not_sufficient_for_statistical_generalization"]
          assert not x["domain_model_activated"] and not x["scientific_external_GO"]
          assert len(x["scores"])==4
          for val in x["scores"].values():
              assert len(val["source_group_MAE_log10"])==3
              assert math.isfinite(val["equal_DOI_group_macro_MAE_log10"])
          assert all(x[k]=="BLOCKED" for k in ("P0_01","P0_02","P0_03"))
          print("0187_THREE_REAL_ORIGINAL_DOI_25C_TOTAL_WITHOUT_FALSE_GO_PASS")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: phase3-0187-real-original-three-DOI-O_ONLY-25C-total
          path: ${{ runner.temp }}/0187-originals/0187_three_original_doi_25C_TOTAL.json
          if-no-files-found: error
          retention-days: 30
