      - name: Compute 0171 exact independent-material power sensitivity (aggregate assumptions only)
        run: |
          set -euo pipefail
          python -m scripts.science.paired_power_0171 --output-dir "$RUNNER_TEMP/material-power-0171"
          python - "$RUNNER_TEMP/material-power-0171/power_plan_0171.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          assert d["status"]=="PLANNING_SENSITIVITY_NOT_INDEPENDENT_EXPERIMENT"
          assert d["scientific_GO"] is False
          assert [r["minimum_independent_enrolled_materials_assuming_IID"] for r in d["power_scenarios"]]==[246,148,138,83,342,205,191,114]
          assert all(d[k]=="BLOCKED" for k in ("P0_01","P0_02","P0_03"))
          assert not d["sealed_roster_truth_or_individual_sample_IDs_accessed"]
          print("0171_EXACT_PAIRED_MATERIAL_POWER_E2E_PASS")
          PY

      - name: Report fast tier completion
        run: echo "R2_FAST_CI_OK"
