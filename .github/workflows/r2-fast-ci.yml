name: R2 Fast CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r2-fast-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/ci/constraints.txt

      - name: Install fast contract dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -c scripts/ci/constraints.txt             pytest numpy scipy pyyaml pymatgen smact ase ase-db-backends ijson==3.5.1
          python -m pip install --no-deps -e .

      - name: Compile AI-first and continuity surfaces
        run: |
          set -euo pipefail
          python -m compileall -q rhombus scripts/development
          python -m py_compile             rudeus/mlip/p2.py             rudeus/mlip/p25.py             rudeus/mlip/p2_traj.py

      - name: Validate compact continuity
        run: |
          set -euo pipefail
          python scripts/development/continuity.py check
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python scripts/development/continuity.py check-pr               --base-ref "${{ github.event.pull_request.base.sha }}"               --pr-number "${{ github.event.pull_request.number }}"
          fi

      - name: Run fast scientific contracts
        run: |
          set -euo pipefail
          python -m pytest -q             tests/test_ai_first_naming.py \
            tests/test_r2_ai_tools.py \
            tests/test_r2_ai_manifest.py \
            tests/test_r2_ai_task_proposal.py \
            tests/test_r2_ai_task_status.py \
            tests/test_r2_ai_analysis.py             tests/test_p2.py             tests/test_known_material_b5_p2_ase_units_diagnostic.py             tests/test_known_material_b5_p2_hex_semantic_recheck.py             tests/test_known_material_b5_p2_remaining_evidence.py             tests/test_known_material_b5_transport_regime_admission.py             tests/test_known_material_b5_transport_regime_classification.py             tests/test_known_material_b5_gamma_transport_regime_evidence.py \
            tests/test_known_material_b5_gamma_transport_extension_authorization.py \
            tests/test_known_material_b5_gamma_kaggle_dispatch.py \
            tests/test_known_material_b5_gamma_github_extension.py \
            tests/test_phase0_closure.py \
            tests/test_r2_evidence_compatibility.py \
            tests/test_phase2_evidence_ledger_freeze.py \
            tests/test_r2_domain_foundation.py \
            tests/test_r2_structural_distance_baseline.py \
            tests/test_r2_reference_coverage_calibration.py \
            tests/test_r2_empirical_calibration_readiness.py \
            tests/test_phase3_reference_error_source_plan.py \
            tests/test_phase3_wbm_source_sampling_contract.py \
            tests/test_phase3_wbm_file_freeze_exposure_audit.py \
            tests/test_phase3_wbm_file_verifier.py \
            tests/test_phase3_wbm_exposure_audit_inputs.py \
            tests/test_phase3_membership_index.py \
            tests/test_phase3_remote_file_hash.py \
            tests/test_phase3_mptrj_source_verification.py \
            tests/test_phase3_mptrj_streaming.py \
            tests/test_phase3_mptrj_source_integrity.py \
            tests/test_phase3_mptrj_range_prefix_probe.py \
            tests/test_phase3_mptrj_energy_labels.py \
            tests/test_phase3_mptrj_complete_prefix_frame.py \
            tests/test_phase3_mpa0_training_lineage_review.py \
            tests/test_phase3_mptrj_manual_actions.py \
            tests/test_phase3_mptrj_probe_receipt.py \
            tests/test_phase3_mptrj_run_metadata_review.py \
            tests/test_phase3_mptrj_artifact_zip.py \
            tests/test_phase3_mptrj_live_github_rest_review.py \
            tests/test_phase3_mptrj_prefix_sample_replay.py \
            tests/test_phase3_mptrj_real_observation_preservation.py \
            tests/test_phase3_mptrj_reobservation.py \
            tests/test_phase3_mptrj_bounded_multiframe.py \
            tests/test_phase3_mptrj_multiframe_manual.py \
            tests/test_phase3_mptrj_remote_stream.py \
            tests/test_phase3_salex_source_adapter.py \
            tests/test_phase3_structure_protocols.py \
            tests/test_phase3_wbm_salex_overlap.py \
            tests/test_phase3_salex_kaggle_automation.py \
            tests/test_security_outgoing_artifact_scanner.py \
            tests/test_phase3_salex_output_recovery.py \
            tests/test_phase3_salex_release_archiver.py

      - name: Report fast tier completion
        run: echo "R2_FAST_CI_OK"
