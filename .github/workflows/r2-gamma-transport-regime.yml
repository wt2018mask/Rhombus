name: R2 Gamma Transport Regime Classification

on:
  pull_request:
    paths:
      - ".github/workflows/r2-gamma-transport-regime.yml"
      - "rhombus/transport/**"
      - "tests/test_known_material_b5_transport_regime_classification.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  classify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/ci/constraints.txt

      - name: Install analysis dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -c scripts/ci/constraints.txt numpy scipy pyyaml ase pymatgen smact
          python -m pip install --no-deps -e .

      - name: Download corrected gamma stability artifact
        uses: actions/download-artifact@v4
        with:
          name: b5-dev-real-p2-pilot-77eea954bfe3366c40f3c5807e7d207a0e8c4f73
          path: artifacts
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37545842461

      - name: Verify source binding and classify regime
        run: |
          set -euo pipefail
          mkdir -p artifacts/transport-regime
          python - <<'PY'
          import json
          from pathlib import Path
          from rhombus.transport import classify_transport_regime

          src = Path("artifacts/b5-p2/df4431260652d2ea.json")
          assert src.is_file(), src
          payload = json.loads(src.read_text(encoding="utf-8"))
          result = payload["result"]
          binding = result["trajectory_artifact"]
          assert binding["path"] == (
              "artifacts/b5-p2-traj/df4431260652d2ea.npz"
          )
          assert binding["sha256"] == (
              "b68c805b8f69bb2346ad3f5337cf5df64d9dd0c882af74bed397dcc00af34f02"
          )
          assert result["p2_verdict"] == "PASS"
          assert result["dynamic_state"] == "PASS"
          assert result["numerical_abort"] is None

          classified = classify_transport_regime(
              stability_payload=payload,
              worker_info={"session": "github-r2-gamma-transport-regime"},
          )
          assert classified["capability"] == "classify_transport_regime"
          assert classified["operational_status"] == "SUCCEEDED"
          assert classified["admission"]["admission_status"] == "ELIGIBLE"
          assert classified["transport_state"] in {
              "DIFFUSIVE", "NONDIFFUSIVE", "INDETERMINATE"
          }
          legacy = classified["legacy_result"]
          assert legacy is not None
          assert legacy["transport_state"] == classified["transport_state"]
          assert legacy["provenance"]["trajectory_artifact_sha256"] == (
              "b68c805b8f69bb2346ad3f5337cf5df64d9dd0c882af74bed397dcc00af34f02"
          )
          assert "conductivity" not in legacy

          out = Path(
              "artifacts/transport-regime/"
              "df4431260652d2ea.transport-regime.json"
          )
          out.write_text(
              json.dumps(classified, indent=2, sort_keys=True),
              encoding="utf-8",
          )
          print("GAMMA_TRANSPORT_REGIME", classified["transport_state"])
          PY

      - name: Upload transport-regime evidence
        uses: actions/upload-artifact@v4
        with:
          name: r2-gamma-transport-regime-${{ github.sha }}
          path: artifacts/transport-regime/
          if-no-files-found: error
          retention-days: 30
