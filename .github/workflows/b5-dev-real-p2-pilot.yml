name: B5 DEV Real P2 Pilot

on:
  pull_request:
    paths:
      - ".github/workflows/b5-dev-real-p2-pilot.yml"
      - "rudeus/mlip/p2.py"
      - "rudeus/mlip/run_p2.py"
      - "rudeus/mlip/calibration.py"
      - "data/benchmarks/known_material/b5_p2_authorization_v1.json"
      - "config.yaml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: b5-dev-real-p2-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-p2-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/ci/constraints.txt

      - name: Install pinned CPU P2 dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -c scripts/ci/constraints.txt \
            torch==2.14.1 mace-torch==0.3.16 e3nn==0.4.4 \
            numpy scipy pyyaml pymatgen smact ase
          python -m pip install --no-deps -e .

      - name: Download exact retained real P1 artifact
        uses: actions/download-artifact@v4
        with:
          name: b5-dev-real-p1-fef4fcbe08829683d5bd601701a2dea6b57a891b
          path: artifacts/p1-source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37523686854

      - name: Verify exact P1 cohort against P2 authorization
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from rudeus.mlip.p2 import load_authorization_manifest

          done = Path("artifacts/p1-source/b5-p1-real/done")
          assert done.is_dir(), done
          allow = load_authorization_manifest(
              "data/benchmarks/known_material/b5_p2_authorization_v1.json",
              done,
          )
          assert allow == {
              "4ab81ca72174667c",
              "df4431260652d2ea",
              "f47d66515f55ce3e",
          }
          print("B5_P2_EXACT_COHORT_OK", sorted(allow))
          PY

      - name: Execute one full-protocol real DEV P2 pilot on CPU
        run: |
          set -euo pipefail
          mkdir -p artifacts/b5-p2 artifacts/b5-p2-traj
          python -m rudeus.mlip.run_p2 \
            --p1-done artifacts/p1-source/b5-p1-real/done \
            --out artifacts/b5-p2 \
            --traj-out artifacts/b5-p2-traj \
            --authorized-manifest data/benchmarks/known_material/b5_p2_authorization_v1.json \
            --device cpu \
            --worker github-b5-dev-p2-pilot \
            --batch-id df4431260652d2ea

      - name: Validate pilot P2 result binding
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          batch_id = "df4431260652d2ea"
          p = Path("artifacts/b5-p2") / f"{batch_id}.json"
          assert p.exists(), p
          row = json.loads(p.read_text())
          assert row["batch_id"] == batch_id
          result = row["result"]
          assert result["p2_verdict"] in {"PASS", "FAIL", "INDETERMINATE"}, result
          assert result["dynamic_state"] in {"PASS", "FAIL", "INDETERMINATE"}, result
          assert result["p2_input_relaxed_sha256"] == (
              "5aa6b2073c4921428bb3c8bd164e018f6889888ab6d6831b48eac8316ffd787d"
          )
          assert result["p2_config_hash"]
          assert result["transport_state"] if "transport_state" in result else True
          print("B5_REAL_P2_PILOT", json.dumps({
              "batch_id": batch_id,
              "p2_verdict": result["p2_verdict"],
              "dynamic_state": result["dynamic_state"],
              "production_steps_completed": result.get("production_steps_completed"),
              "early_stop_reason": result.get("early_stop_reason"),
              "p2_config_hash": result["p2_config_hash"],
          }, sort_keys=True))
          PY

      - name: Upload real P2 pilot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b5-dev-real-p2-pilot-${{ github.sha }}
          path: |
            artifacts/b5-p2/
            artifacts/b5-p2-traj/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
