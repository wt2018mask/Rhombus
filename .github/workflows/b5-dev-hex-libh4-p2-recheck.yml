name: B5 DEV Hex LiBH4 P2 Semantic Recheck

on:
  pull_request:
    paths:
      - ".github/workflows/b5-dev-hex-libh4-p2-recheck.yml"
      - "rudeus/mlip/p2.py"
      - "tests/test_p2.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  recheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/ci/constraints.txt

      - name: Install pinned CPU P2 dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -c scripts/ci/constraints.txt             torch==2.14.1 mace-torch==0.3.16 e3nn==0.4.4             numpy scipy pyyaml pymatgen smact ase
          python -m pip install --no-deps -e .

      - name: Download exact retained real P1 artifact
        uses: actions/download-artifact@v4
        with:
          name: b5-dev-real-p1-fef4fcbe08829683d5bd601701a2dea6b57a891b
          path: artifacts/p1-source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37523686854

      - name: Execute hexagonal LiBH4 semantic recheck
        run: |
          set -euo pipefail
          mkdir -p artifacts/b5-p2 artifacts/b5-p2-traj
          python -m rudeus.mlip.run_p2             --p1-done artifacts/p1-source/b5-p1-real/done             --out artifacts/b5-p2             --traj-out artifacts/b5-p2-traj             --authorized-manifest data/benchmarks/known_material/b5_p2_authorization_v1.json             --device cpu             --worker github-b5-hex-libh4-p2-semantic-recheck             --batch-id 4ab81ca72174667c

      - name: Require host-instability FAIL under evaluation policy v2
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          row = json.loads(
              Path("artifacts/b5-p2/4ab81ca72174667c.json").read_text()
          )
          result = row["result"]
          assert result["p2_protocol_version"] == (
              "p2-adaptive-v3-ase-units-fixcom-provisional"
          )
          assert result["p2_evaluation_policy_version"] == (
              "p2-stability-eval-v2-host-first-mobile-neutral"
          )
          assert result["dynamic_state"] == "FAIL", result
          assert result["p2_verdict"] == "FAIL", result
          assert result["early_stop_reason"] == "clear_failure", result
          assert result["mobile_ion_metrics"]["n_mobile"] == 2
          assert any(
              str(reason).startswith("instability:")
              for reason in result["reasons"]
          )
          assert not any(
              "only 2 mobile ions" in str(reason)
              for reason in result["reasons"]
          )
          assert "transport_state" not in result
          print("HEX_LIBH4_P2_SEMANTIC_RECHECK_OK")
          PY

      - name: Upload exact recheck evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b5-hex-libh4-p2-semantic-recheck-${{ github.sha }}
          path: |
            artifacts/b5-p2/
            artifacts/b5-p2-traj/
          if-no-files-found: warn
          retention-days: 30
