name: Phase 3 Real OBELiX Original Author Features Ablation 0149

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase3-0149-source-original-author-features-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-frozen-original-train-author-feature-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OPENBLAS_NUM_THREADS: "2"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OBELIX_PINNED_COMMIT: "4eaac889809dd489e3bae468c45d5c0e02b9147a"
    steps:
      - name: Checkout Rhombus exact triggering HEAD
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # pinned v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Configure scientific Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pinned v5
        with:
          python-version: "3.11"

      - name: Install pinned source/numerical/ML test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -c scripts/ci/constraints.txt \
            pytest numpy scipy pyyaml pymatgen smact ase scikit-learn
          python - <<'PY'
          import sklearn
          assert sklearn.__version__ == "1.9.1"
          print("0149_PINNED_SCIKIT_LEARN_READY")
          PY

      - name: Adversarial fixture regressions for 0146-0149 same-fold models
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_phase3_obelix_real_grouped_oof_0146.py \
            tests/test_phase3_rf_mlp_frozen_group_oof_0147.py \
            tests/test_phase3_obelix_group_failure_audit_0148.py \
            tests/test_phase3_obelix_author_features_0149.py

      - name: Fetch original publisher OBELiX exact public source
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none --no-checkout \
            https://github.com/NRC-Mila/OBELiX.git "$RUNNER_TEMP/OBELiX-0149"
          git -C "$RUNNER_TEMP/OBELiX-0149" checkout --quiet --detach "$OBELIX_PINNED_COMMIT"
          test "$(git -C "$RUNNER_TEMP/OBELiX-0149" rev-parse HEAD)" = "$OBELIX_PINNED_COMMIT"
          test -z "$(git -C "$RUNNER_TEMP/OBELiX-0149" status --porcelain --untracked-files=all)"
          echo "0149_EXACT_ORIGINAL_SOURCE_AND_PUBLIC_TRAIN_BOUNDARY_VERIFIED"

      - name: Real original 449-row fixed-fold two-arm RF/MLP feature ablation
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE"
          python scripts/science/obelix_original_author_features_0149.py \
            --original-obelix-checkout "$RUNNER_TEMP/OBELiX-0149" \
            --output-dir "$RUNNER_TEMP/0149-original-source-author-features"

      - name: Validate identical cohort, frozen models and exploratory-only scientific claims
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/0149-original-source-author-features" <<'PY'
          import json, math, sys
          from pathlib import Path
          root=Path(sys.argv[1])
          assert sorted(x.name for x in root.iterdir()) == ["author_feature_ablation_aggregate.json"]
          r=json.loads((root/"author_feature_ablation_aggregate.json").read_text())
          assert r["source_original_commit"] == "4eaac889809dd489e3bae468c45d5c0e02b9147a"
          assert r["source_original_train_rows"] == 478
          assert r["official_public_TEST_reserved_unread"] == 121
          assert r["official_public_TEST_predictions"] == 0
          assert r["original_source_censored_upper_bounds_excluded"] == 29
          assert r["real_source_numeric_rows_scored_per_model"] == 449
          assert r["connected_source_DOI_formula_groups"] == 102
          assert r["original_exact_0146_fold_assignments_reused"] is True
          assert r["identical_frozen_0147_RF_MLP_hyperparameters_and_seeds"] is True
          assert r["train_only_median_geometry_imputation_and_MLP_feature_scaling"] is True
          assert r["original_existing_fraction_models_log10_MAE"] == {
             "mean":1.86702336,"RF":1.94487886,"MLP":2.26334295,"Ridge":2.29511512
          }
          assert len(r["two_predeclared_feature_arms"]) == 2
          assert len(r["publisher_spacegroup_and_lattice_columns"]) == 7
          assert len(r["per_fold_scores"]) == 5
          assert sum(f["heldout_source_records"] for f in r["per_fold_scores"]) == 449
          assert sum(f["heldout_connected_groups"] for f in r["per_fold_scores"]) == 102
          assert all(f["group_leak_count"]==0 for f in r["per_fold_scores"])
          assert set(r["actual_oof_results"]) == set(r["two_predeclared_feature_arms"])
          for arm in r["two_predeclared_feature_arms"]:
             assert set(r["actual_oof_results"][arm]) == {"RF","MLP"}
             for name,result in r["actual_oof_results"][arm].items():
                 assert result["all_frozen_source_records_predicted_once"] == 449
                 assert result["connected_identity_groups_scored"] == 102
                 assert math.isfinite(result["log10_MAE"]) and math.isfinite(result["log10_RMSE"])
                 assert result["score_measured_after_previous_feature_model_results_visible"] is True
                 assert result["independent_test_generalization_claim_authorized"] is False
          assert r["original_author_paper_exact_feature_tuning_cv_reproduction"] is False
          assert r["unseen_fresh_holdout_evaluated"] is False
          assert r["science_go"] is False
          assert r["independent_physical_materials_authenticated"] is None
          assert all(r[k]=="BLOCKED" for k in ("P0_01_status","P0_02_status","P0_03_status"))
          print("0149_REAL_ORIGINAL_OBELIX_449_AUTHOR_FEATURE_ABLATION_PASS")
          print(json.dumps({
             "real_original_numeric_TRAIN":449,
             "connected_DOI_formula_groups":102,
             "old_mean_MAE":r["original_existing_fraction_models_log10_MAE"]["mean"],
             "new_arm_MAE":{arm:{name:res["log10_MAE"] for name,res in models.items()} for arm,models in r["actual_oof_results"].items()},
             "geometry_missingness":r["missing_lattice_fields_by_column"],
             "science_go":False
          },sort_keys=True))
          PY

      - name: Upload only aggregate posthoc exploration; no raw original source data
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # pinned v4
        with:
          name: phase3-0149-original-train-posthoc-author-feature-ablation-aggregate
          path: ${{ runner.temp }}/0149-original-source-author-features/author_feature_ablation_aggregate.json
          if-no-files-found: error
          retention-days: 30
