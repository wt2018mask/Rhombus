name: Phase 3 0194 SOLO New Original Te Garnet Hot Press
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: solo-0194-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unverified-frozen-table-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install bounded original source parser
        run: |
          python -m pip install -c scripts/ci/constraints.txt pytest beautifulsoup4 numpy
      - name: Validate original author identity, mutant tables and scientific refusal
        run: |
          python -m pytest -q tests/test_phase3_obelix_solo_oxide_author_te_hotpress_0194.py tests/test_phase3_obelix_solo_oxide_nonmonotonic_choice_0193.py
      - name: Attempt publisher source; if blocked run explicitly UNVERIFIED author-table diagnostic
        run: |
          python -m scripts.science.obelix_solo_oxide_author_te_hotpress_0194 --output "$RUNNER_TEMP/0194-first-party-hotpress.json" --allow-unverified-frozen-diagnostic
      - name: Assert numerical source diagnostic and fail-closed live evidence identity
        run: |
          python - "$RUNNER_TEMP/0194-first-party-hotpress.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1],encoding="utf-8"))
          assert x["doi"]=="10.1002/cssc.202300399"
          if not x["publisher_live_source_verified"]:
              assert x["original_source_admission"]=="BLOCKED_PUBLISHER_ACCESS"
              assert x["source_unavailable_diagnostic_only"]
              assert x["first_party_html_sha256"] is None
              print("0194_PUBLISHER_ACCESS_BLOCKED_DIAGNOSTIC_NOT_LIVE_SOURCE_VERIFICATION")
          else:
              assert x["original_source_admission"]=="SOURCE_VERIFIED"
              assert len(x["first_party_html_sha256"])==64
          assert x["author_original_DOI_count"]==1 and x["author_conditions"]==18
          assert x["nominal_series_count"]==6 and x["author_reported_target_temperature_C"]==25
          assert x["nonmonotonic_series"]==["Te0.1"] and x["always_hottest_successes"]==5
          assert x["always_hottest_failures"]==1 and x["0191_model_route_abstentions"]==6
          assert not x["0191_process_model_compatible"] and not x["scientific_GO"]
          assert x["original_OBELiX_official_TEST_121_unread"] and not x["production_enabled"]
          assert all(x[k]=="BLOCKED" for k in ("P0_01","P0_02","P0_03"))
          print("0194_TABLE_DIAGNOSTIC_HOTTER_FAILS_ONE_NO_SCIENTIFIC_GO")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: phase3-0194-table-diagnostic-source-status-required
          path: ${{ runner.temp }}/0194-first-party-hotpress.json
          if-no-files-found: error
          retention-days: 30
  live-source-verification:
    name: Strict live publisher source verification
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install original source parser
        run: python -m pip install beautifulsoup4
      - name: Authenticate live original source without diagnostic fallback
        run: |
          python -m scripts.science.obelix_solo_oxide_author_te_hotpress_0194 --output "$RUNNER_TEMP/0194-verified-source.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase3-0194-live-source-verified
          path: ${{ runner.temp }}/0194-verified-source.json
          if-no-files-found: error
          retention-days: 30
