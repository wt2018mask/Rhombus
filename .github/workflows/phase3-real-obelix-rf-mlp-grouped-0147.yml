name: Phase 3 Real OBELiX Strong Grouped RF MLP Baselines 0147

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase3-science-0147-strong-source-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-public-train-rf-mlp:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OPENBLAS_NUM_THREADS: "2"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OBELIX_PINNED_COMMIT: 4eaac889809dd489e3bae468c45d5c0e02b9147a
    steps:
      - name: Check out exact triggering Rhombus commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install pinned original source plus machine-learning baseline dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -c scripts/ci/constraints.txt \
            pytest numpy scipy pyyaml pymatgen smact ase scikit-learn
          python - <<'PY'
          import sklearn
          assert sklearn.__version__ == "1.9.1"
          print("0147_PINNED_SKLEARN_1_9_1_READY")
          PY

      - name: Verify original 0146 unchanged and red-team model/source isolation
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_phase3_obelix_real_grouped_oof_0146.py \
            tests/test_phase3_rf_mlp_frozen_group_oof_0147.py

      - name: Checkout exact public upstream original OBELiX source
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none --no-checkout \
            https://github.com/NRC-Mila/OBELiX.git "$RUNNER_TEMP/OBELiX-0147"
          git -C "$RUNNER_TEMP/OBELiX-0147" checkout --quiet --detach "$OBELIX_PINNED_COMMIT"
          test "$(git -C "$RUNNER_TEMP/OBELiX-0147" rev-parse HEAD)" = "$OBELIX_PINNED_COMMIT"
          test -z "$(git -C "$RUNNER_TEMP/OBELiX-0147" status --porcelain --untracked-files=all)"
          echo "0147_REAL_ORIGINAL_SOURCE_COMMIT_VERIFIED"

      - name: Train genuine original TRAIN RF and MLP on exactly existing 0146 held-out groups
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE"
          python scripts/science/obelix_rf_mlp_frozen_group_oof_0147.py \
            --original-obelix-checkout "$RUNNER_TEMP/OBELiX-0147" \
            --output-dir "$RUNNER_TEMP/0147-real-predictive-aggregate"

      - name: Require exact 0146 Ridge and mean scores, fully source-linked genuine model predictions
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/0147-real-predictive-aggregate" <<'PY'
          import json, math, sys
          from pathlib import Path
          root=Path(sys.argv[1])
          assert sorted(x.name for x in root.iterdir()) == ["source_group_rf_mlp_aggregate.json"]
          r=json.loads((root/"source_group_rf_mlp_aggregate.json").read_text())
          assert r["original_source_commit"] == "4eaac889809dd489e3bae468c45d5c0e02b9147a"
          assert r["original_official_train_records"] == 478
          assert r["original_official_test_reserved_unread"] == 121
          assert r["original_source_numeric_point_metadata"] == 449
          assert r["censored_source_upper_bounds_excluded"] == 29
          assert r["real_out_of_fold_source_record_predictions_per_model"] == 449
          assert r["source_DOI_formula_connected_groups_scored"] == 102
          assert r["original_paper_baseline_protocol_exactly_reproduced"] is False
          assert r["upstream_publication_has_different_features_and_hyperparameter_search"] is True
          assert len(r["fold_metrics"]) == 5
          assert sum(f["heldout_source_record_count"] for f in r["fold_metrics"]) == 449
          assert sum(f["heldout_connected_identity_group_count"] for f in r["fold_metrics"]) == 102
          assert all(f["group_leakage_count"] == 0 for f in r["fold_metrics"])
          vals=r["out_of_fold_metrics"]
          assert vals["ridge_0146"]["log10_MAE"] == 2.29511512
          assert vals["training_fold_mean_0146"]["log10_MAE"] == 1.86702336
          for key in ("random_forest","mlp","ridge_0146","training_fold_mean_0146"):
              v=vals[key]
              assert v["group_count"] == 102
              assert v["source_record_out_of_fold_count"] == 449
              assert math.isfinite(v["log10_MAE"]) and math.isfinite(v["log10_RMSE"])
              assert v["log10_MAE"] >= 0
              assert v["bootstrap_scope"] == "HEURISTIC_SHARED_DOI_FORMULA_GROUPS_NOT_IID_PHYSICAL_SAMPLES"
          assert r["official_public_TEST_predictions"] == 0
          assert r["independent_physical_material_count"] is None
          assert not r["scientific_qualification_authorized"]
          assert all(r[k] == "BLOCKED" for k in ("P0_01_status","P0_02_status","P0_03_status"))
          print("0147_REAL_449_TRAIN_RF_MLP_RIDGE_MEAN_OOF_GROUPED_MODEL_COMPARISON_PASS")
          print(json.dumps({
              "original_public_train":478, "oof_source_rows":449,
              "connected_groups":102,
              "RF_log10_MAE":vals["random_forest"]["log10_MAE"],
              "MLP_log10_MAE":vals["mlp"]["log10_MAE"],
              "Ridge_log10_MAE":vals["ridge_0146"]["log10_MAE"],
              "Mean_log10_MAE":vals["training_fold_mean_0146"]["log10_MAE"],
              "RF_beats_mean":vals["random_forest"]["log10_MAE"] < vals["training_fold_mean_0146"]["log10_MAE"],
              "MLP_beats_mean":vals["mlp"]["log10_MAE"] < vals["training_fold_mean_0146"]["log10_MAE"],
              "science_GO":False
          },sort_keys=True))
          PY

      - name: Upload only aggregate publicly safe grouped OOF source diagnostics
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase3-0147-source-TRAIN-frozen-group-RF-MLP-ridge-mean
          path: ${{ runner.temp }}/0147-real-predictive-aggregate/source_group_rf_mlp_aggregate.json
          if-no-files-found: error
          retention-days: 30
