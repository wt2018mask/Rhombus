name: Phase 3 0169 Two Genuine Original Publications Cross-Paper Transfer
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: original-crosspaper-0169-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deterministic-regression:
    name: Offline source-transfer regression (not live authentication)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Verify deterministic calculations and hostile synthetic source fixtures
        run: |
          set -euo pipefail
          python -m pip install -c scripts/ci/constraints.txt pytest
          python -m pytest -q tests/test_phase3_original_cross_paper_transfer_0169.py tests/test_phase3_original_process_holdout_0168.py
  # PR timeout mode records unavailability after real offline regressions.
  # Manual workflow_dispatch remains strict and requires live source bytes.
  independent-primary-science:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Run source isolation and hostile scientific fixtures
        run: |
          set -euo pipefail
          python -m pip install -c scripts/ci/constraints.txt pytest pymupdf
          python -m pytest -q tests/test_phase3_original_cross_paper_transfer_0169.py tests/test_phase3_original_process_holdout_0168.py
      - name: Fetch two independent real primary sources and evaluate directional transfers
        run: |
          set -euo pipefail
          if test '${{ github.event_name }}' = 'pull_request'; then
            python -m scripts.science.original_cross_paper_transfer_0169 --live-original --allow-source-timeout --output-dir "$RUNNER_TEMP/source-transfer-0169"
          else
            python -m scripts.science.original_cross_paper_transfer_0169 --live-original --require-live-network --output-dir "$RUNNER_TEMP/source-transfer-0169"
          fi
      - name: Require truthful source-only exploratory outcome
        # Only a PR timeout plus verified offline tests may finish without bytes.
        run: |
          python - "$RUNNER_TEMP/source-transfer-0169" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1])
          if (p/"source-unavailable.json").exists():
              import os
              receipt=json.loads((p/"source-unavailable.json").read_text())
              assert os.environ['GITHUB_EVENT_NAME']=='pull_request'
              assert receipt['offline_regression_status']=='VERIFIED' and receipt['sha256'] is None
              assert receipt['live_network_status']=='EXTERNAL_HOST_UNREACHABLE_TIMEOUT'
              assert not receipt['original_bytes_authenticated'] and not receipt['scientific_GO']
              print('OFFLINE_VERIFIED_LIVE_SOURCE_UNAVAILABLE'); sys.exit(0)
          assert sorted(f.name for f in p.iterdir())==["original_cross_paper_transfer_0169.json"]
          r=json.loads((p/"original_cross_paper_transfer_0169.json").read_text())
          assert r["independent_publications"]==2
          assert r["original_public_source_conditions_total"]==14
          assert r["independent_material_compositions"]==1
          assert r["independently_physical_attested_pellets"]==0
          assert r["exact_numeric_temperature_matched_heldout_papers"] is False
          assert r["exploratory_sources_seen_before_protocol"] is True
          assert r["independently_sealed_blind"] is False
          assert r["genuine_out_of_paper_not_out_of_chemistry"] is True
          assert r["MLIP_transport_improvement_shown"] is False
          assert r["scientific_GO"] is False
          assert all(r[k]=="BLOCKED" for k in ("P0_01","P0_02","P0_03"))
          for key in ("Yubuchi_2019_to_Yu_2019","Yu_2019_to_Yubuchi_2019"):
              assert r[key]["no_target_paper_labels_fitted"]
          assert r["Yubuchi_2019_to_Yu_2019"]["process_temperature_OLS_train_paper_log10MAE"]==0.20572061
          assert r["Yu_2019_to_Yubuchi_2019"]["process_temperature_OLS_train_paper_log10MAE"]==0.22463230
          raw=(p/"original_cross_paper_transfer_0169.json").read_text()
          assert "YU_SIGMA_S_CM" not in raw and "six_original_public_process_condition_points" not in raw
          print("0169_INDEPENDENT_REAL_SOURCE_CROSS_PAPER_DIAGNOSTIC_PASS")
          PY
      - name: Upload aggregate-only source analysis
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase3-0169-two-primary-source-exploratory-cross-paper-diagnostic
          path: ${{ runner.temp }}/source-transfer-0169/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Preserve source timeout receipt
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase3-0169-source-outage
          path: ${{ runner.temp }}/source-transfer-0169/source-unavailable.json
          if-no-files-found: ignore
