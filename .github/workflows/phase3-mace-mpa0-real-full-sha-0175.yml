name: Phase 3 0175 Actual MACE MPA0 Entire Model SHA256
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: original-mpa0-0175-${{ github.ref }}
  cancel-in-progress: true
jobs:
  full-actual-checkpoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Hostile full model identity and source stream tests
        run: |
          set -euo pipefail
          python -m pip install -c scripts/ci/constraints.txt pytest
          python -m pytest -q tests/test_phase3_mace_checkpoint_binary_0175.py
      - name: Stream entire upstream 79MB exact model without storing it
        run: |
          set -euo pipefail
          python -m scripts.science.mace_checkpoint_binary_0175 --real-original-complete-checkpoint --output-dir "$RUNNER_TEMP/original-model-0175"
      - name: Strictly separate actual byte verification from training membership
        run: |
          python - "$RUNNER_TEMP/original-model-0175/full_checkpoint_digest_0175.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding="utf-8"))
          b=r["independent_full_binary_observation"]
          assert b["observed_byte_length"]==79_462_305
          assert b["observed_SHA256"]=="75428afe3a1d7d8062e19bcaabd5c433623cabf308242ec9fb493e38604fb638"
          assert b["hash_scope"]=="FULL_FILE"
          assert b["model_weights_retained"] is False
          assert r["whole_checkpoint_binary_SHA256_actually_measured"]
          assert not r["third_party_auditor_receipt_authenticated"]
          assert not r["selected_MPtrj_training_frames_authenticated"]
          assert not r["selected_sAlex_training_frames_authenticated"]
          assert not r["independent_eval_material_membership_audited"]
          assert all(r[k]=="BLOCKED" for k in ("P0_01","P0_02","P0_03"))
          assert r["scientific_GO"] is False
          print("0175_FULL_SOURCE_BINARY_VERIFIED_BUT_SCIENTIFIC_NO_GO_PASS")
          PY
      - name: Archive receipt only; never archive original weights
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase3-0175-real-entire-mpa0-model-sha256-receipt-only
          path: ${{ runner.temp }}/original-model-0175/full_checkpoint_digest_0175.json
          if-no-files-found: error
          retention-days: 30
