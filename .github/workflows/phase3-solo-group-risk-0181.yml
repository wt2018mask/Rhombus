name: Phase 3 0181 SOLO Original Group Size and Risk Coverage
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: solo-original-public-risk-0181-${{ github.ref }}
  cancel-in-progress: true
jobs:
  actual-public-source-risk-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OPENBLAS_NUM_THREADS: "2"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OBELIX_PINNED_COMMIT: "4eaac889809dd489e3bae468c45d5c0e02b9147a"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install public original OBELiX pinned CPU science libraries
        run: |
          set -euo pipefail
          python -m pip install -c scripts/ci/constraints.txt pytest numpy scipy pyyaml pymatgen smact ase scikit-learn
          python - <<'PY'
          import sklearn
          assert sklearn.__version__=="1.9.1"
          PY
      - name: Reject toy false leak and false certainty certification
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_phase3_obelix_solo_group_risk_0181.py tests/test_phase3_obelix_real_grouped_oof_0146.py
      - name: Fetch immutable upstream original public OBELiX source
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none --no-checkout https://github.com/NRC-Mila/OBELiX.git "$RUNNER_TEMP/OBELiX-0181"
          git -C "$RUNNER_TEMP/OBELiX-0181" checkout --quiet --detach "$OBELIX_PINNED_COMMIT"
          test "$(git -C "$RUNNER_TEMP/OBELiX-0181" rev-parse HEAD)" = "$OBELIX_PINNED_COMMIT"
          test -z "$(git -C "$RUNNER_TEMP/OBELiX-0181" status --porcelain --untracked-files=all)"
      - name: Compute genuine 449 source-row RF dispersion and 102-source-group risk coverage
        run: |
          set -euo pipefail
          python -m scripts.science.obelix_solo_group_risk_0181 --original-obelix-checkout "$RUNNER_TEMP/OBELiX-0181" --output-dir "$RUNNER_TEMP/0181-public-group-risk"
      - name: Require frozen TRAIN TEST split and uncertainty diagnostic truth
        run: |
          python - "$RUNNER_TEMP/0181-public-group-risk/original_source_group_risk_0181.json" <<'PY'
          import json,math,sys
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          assert d["original_upstream_commit"]=="4eaac889809dd489e3bae468c45d5c0e02b9147a"
          assert d["public_source_TRAIN_count"]==478
          assert d["public_source_TEST_count_reserved_unread"]==121
          assert d["public_source_TEST_used_in_any_selection"] is False
          assert d["public_numeric_uncensored_source_rows"]==449
          assert d["original_source_upper_bound_labels_excluded"]==29
          assert d["source_connected_groups"]==102
          assert sum(d["original_outer_fold_connected_group_counts"])==102
          assert d["model_error"]["RF_row_log10_MAE"]==1.94487886
          assert d["model_error"]["cheap_mean_row_log10_MAE"]==1.86702336
          assert d["model_error"]["RF_macro_group_log10_MAE"]==1.90046024
          assert d["model_error"]["cheap_mean_macro_group_log10_MAE"]==2.26818583
          assert set(d["risk_coverage"])=={"60pct","80pct"}
          assert all(v["blind_uniform_group_selection_trials"]==128 for v in d["risk_coverage"].values())
          assert d["public_retrospective_outcomes_exposed_before_0181_experiment"]
          assert d["RF_ensemble_tree_std_NOT_validated_uncertainty_probability"]
          assert d["physical_scientific_GO"] is False
          assert all(d[k]=="BLOCKED" for k in ("P0_01","P0_02","P0_03"))
          print("0181_PUBLIC_SOURCE_EXACT_GROUP_RISK_NOT_EXPERIMENTAL_GO_PASS")
          PY
      - name: Upload aggregate-only public group risk and size evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase3-0181-solo-original-public-group-size-dispersion-risk
          path: ${{ runner.temp }}/0181-public-group-risk/original_source_group_risk_0181.json
          if-no-files-found: error
          retention-days: 30
