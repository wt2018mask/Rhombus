name: V3 Fixed Rmin CIF and Full Pytest Audit

on:
  push:
    branches:
      - worker/k203-automation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v3-fixed-rmin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact triggering commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install existing pinned science test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c scripts/ci/constraints.txt pytest numpy scipy pyyaml pymatgen smact ase ase-db-backends scikit-learn ijson==3.5.1 cryptography==50.0.2 pypdf pyxlsb
          python -m pip install 'mcp>=2,<3' beautifulsoup4
          # Full-suite P2 tests import torch at collection time. Install pinned
          # CPU build; no GPU device or Kaggle action is requested.
          python -m pip install -c scripts/ci/constraints.txt torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-deps -e .
      - name: Verify continuity and Python syntax
        run: |
          python scripts/development/continuity.py check
          python -m compileall -q rhombus scripts/benchmark
          python -m pytest -q -p no:cacheprovider tests/test_canonical_softbv_policy.py tests/test_v3_cif_inventory.py tests/test_coordination_pairwise_model.py
      - name: Run fixed universal model on seven CIFs, OBELiX, and ten canonical structures
        run: |
          python -m scripts.benchmark.audit_v3_fixed_rmin --output "$RUNNER_TEMP/v3-fixed-rmin-audit.json"
          python - "$RUNNER_TEMP/v3-fixed-rmin-audit.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding='utf-8'))
          assert len(data['cifs'])==9 and len(data['canonical_archetypes'])==10
          for kind in ('cifs','canonical_archetypes'):
              for r in data[kind]:
                  print(kind,json.dumps(r,ensure_ascii=False,sort_keys=True))
          PY
      - name: Run all repository pytest tests without cache
        run: python -m pytest -p no:cacheprovider
      - name: Publish read-only audit results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v3-fixed-rmin-audit
          path: ${{ runner.temp }}/v3-fixed-rmin-audit.json
          if-no-files-found: warn
          retention-days: 7
