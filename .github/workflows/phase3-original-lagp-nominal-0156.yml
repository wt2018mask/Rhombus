name: Phase 3 LAGP Original CIF Nominal x and Real Author SI PDFs 0156
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phase3-original-si-v-train-0156-${{ github.ref }}
  cancel-in-progress: true
jobs:
  actual-physical-source-crystal-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OPENBLAS_NUM_THREADS: "2"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      ORIGINAL_OBELIX_COMMIT: 4eaac889809dd489e3bae468c45d5c0e02b9147a
    steps:
      - name: Checkout exact triggering Rhombus commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Python 3.11 for first-party crystallography
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install pinned 0151 scientific dependencies
        run: |
          set -euo pipefail
          python -m pip install -c scripts/ci/constraints.txt pytest numpy scipy pyyaml pymatgen smact ase scikit-learn
          python -m pip install 'pypdf==5.9.0'
      - name: Test structure match and occupancy falsification fixtures
        run: python -m pytest -q tests/test_phase3_lagp_original_nominal_0156.py
      - name: Fetch exact publisher OBELiX first-party original repository
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none --no-checkout https://github.com/NRC-Mila/OBELiX.git "$RUNNER_TEMP/OBELiX-0156"
          git -C "$RUNNER_TEMP/OBELiX-0156" checkout --quiet --detach "$ORIGINAL_OBELIX_COMMIT"
          test "$(git -C "$RUNNER_TEMP/OBELiX-0156" rev-parse HEAD)" = "$ORIGINAL_OBELIX_COMMIT"
          test -z "$(git -C "$RUNNER_TEMP/OBELiX-0156" status --porcelain --untracked-files=all)"
      - name: Download genuine pinned SI ZIP then analyze publisher 8 CIF against 2 original TRAIN
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE" python scripts/science/obelix_lagp_nominal_series_0156.py \
            --original-obelix-checkout "$RUNNER_TEMP/OBELiX-0156" \
            --output-dir "$RUNNER_TEMP/0156-real-CIF-join" --live-original
      - name: Assert original files, sample-label scope and no false science
        run: |
          python - "$RUNNER_TEMP/0156-real-CIF-join" <<'PY'
          import json,sys
          from pathlib import Path
          d=json.loads((Path(sys.argv[1])/"original_0156_nominal_Rietveld_and_paper_context.json").read_text())
          assert d["original_public_TEST_reserved_unread_count"]==121
          assert len(d["source_TRAIN_nominal_CIF_links"])==2
          assert d["full_author_accepted_manuscript_page_context"]["sha256"]=="e5fc22ec69db52f403f8776cbcf10e11ed771d6abf69b3c3ac610bb30edfe368"
          assert d["firstparty_original_SI_Rietveld_pdf_page_context"]["sha256"]=="db747a82235860cdcd21a798ad51d2fd0d22b906d3a213cd31e9ea9af72d94d3"
          actual=[(q["OBELiX_TRAIN_entry"],q["published_SI_CIF_filename"],q["CIF_filename_nominal_series_x"],q["publisher_Rietveld_refined_x_Al"]) for q in d["source_TRAIN_nominal_CIF_links"]]
          assert actual==[("0fh","lagp-1.2.cif",0.2,0.242),("1dm","lagp-1.6.cif",0.6,0.48)]
          assert d["original_exact_specimen_phase_sample_links_qualified"]==0
          assert d["original_temperature_bulk_total_conductivity_rows_qualified"]==0
          assert d["independent_physical_materials_qualified"]==0
          assert d["scientific_GO"] is False and d["MACE_MD_transport_computed"] is False
          assert all(d[k]=="BLOCKED" for k in ("P0_01","P0_02","P0_03"))
          print("0156_FIRSTPARTY_NOMINAL_SERIES_REFINED_X_AND_PAPER_CONTEXT_NO_FALSE_SCIENCE_PASS")
          PY
      - name: Retain only bounded crystallographic source aggregate without CIF structures
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase3-0156-actual-8-firstparty-CIF-x-2-TRAIN-structure-diagnostic
          path: ${{ runner.temp }}/0156-real-CIF-join/original_0156_nominal_Rietveld_and_paper_context.json
          if-no-files-found: error
          retention-days: 30
