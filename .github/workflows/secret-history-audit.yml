name: Secret History and Artifact Audit

on:
  push:
    branches:
      - main
    paths:
      - "scripts/security/**"
      - ".github/workflows/secret-history-audit.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout all reachable history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Scan reachable Git objects and accessible Actions artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p security-results
          python scripts/security/audit_credential_history.py \
            --repository "${{ github.repository }}" \
            --output security-results/secret-audit-receipt.json
      - name: Upload metadata-only security audit receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rhombus-secret-audit-${{ github.run_id }}
          path: security-results/
          if-no-files-found: warn
          retention-days: 14
