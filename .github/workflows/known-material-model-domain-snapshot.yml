name: Known Material Model Domain Snapshot

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Model-domain snapshot scope
        required: true
        default: unresolved
        type: choice
        options:
          - unresolved
          - all
          - domain
      selector:
        description: Domain key for domain scope; leave blank for unresolved/all
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: known-material-model-domain-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out current canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/ci/constraints.txt

      - name: Install pinned model-domain environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c scripts/ci/constraints.txt torch mace-torch ase pymatgen pyyaml pytest
          python -m pip install --no-deps -e .

      - name: Run pre-snapshot focused regression
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            rudeus/science/known_material_model_domain.py \
            scripts/benchmark/snapshot_model_domains.py \
            scripts/benchmark/verify_model_domain_snapshots.py
          python -m pytest -q \
            tests/test_known_material_model_domain.py \
            tests/test_known_material_failure_control.py \
            tests/test_known_material_failure_control_execution.py

      - name: Extract selected model domains from pinned checkpoints
        shell: bash
        env:
          SCOPE: ${{ inputs.scope }}
          SELECTOR: ${{ inputs.selector }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          args=(--scope "${SCOPE}")
          if [[ -n "${SELECTOR}" ]]; then
            args+=(--selector "${SELECTOR}")
          fi
          python scripts/benchmark/snapshot_model_domains.py "${args[@]}" | tee artifacts/model-domain-snapshot.json

      - name: Verify persisted model-domain state
        shell: bash
        run: |
          set -euo pipefail
          python scripts/benchmark/verify_model_domain_snapshots.py | tee artifacts/model-domain-verification.json

      - name: Retain model-domain run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-domain-snapshot-${{ inputs.scope }}-${{ github.run_id }}
          path: |
            artifacts/model-domain-snapshot.json
            artifacts/model-domain-verification.json
          retention-days: 30
          if-no-files-found: warn

      - name: Commit verified snapshots on data branch
        shell: bash
        env:
          SCOPE: ${{ inputs.scope }}
        run: |
          set -euo pipefail
          branch="bot/b2-model-domain-${SCOPE}-${GITHUB_RUN_ID}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${branch}"

          git add data/benchmarks/known_material/model_domain_snapshot_index_v1.json
          git add data/benchmarks/known_material/model_domains

          if git diff --cached --quiet; then
            echo "No model-domain snapshot changes to commit." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          git commit -m "data(benchmark): retain pinned model-domain snapshots"
          git push origin "HEAD:refs/heads/${branch}"

          echo "Verified data branch: ${branch}" | tee -a "${GITHUB_STEP_SUMMARY}"
          echo "This workflow never merges or self-approves scientific data." | tee -a "${GITHUB_STEP_SUMMARY}"
