name: Herdr worker offline tests

on:
  pull_request:
    paths:
      - "scripts/development/herdr_issue_worker.py"
      - "tests/test_herdr_issue_worker.py"
      - "docs/HERDR_AUTONOMOUS_WORKER_V1.md"
      - ".github/workflows/herdr-worker-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile worker and tests
        run: python -m py_compile scripts/development/herdr_issue_worker.py tests/test_herdr_issue_worker.py
      - name: Run deterministic offline tests
        run: python -m unittest discover -s tests -p test_herdr_issue_worker.py -v
