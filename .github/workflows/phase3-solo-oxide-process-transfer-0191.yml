name: Phase 3 0191 SOLO Real Original Process DOI Transfer
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: solo-0191-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-process-source-heldout:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: "2"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OBELIX_COMMIT: "4eaac889809dd489e3bae468c45d5c0e02b9147a"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install frozen source CPU requirements
        run: |
          set -euo pipefail
          python -m pip install -c scripts/ci/constraints.txt pytest numpy scipy pyyaml pymatgen smact ase scikit-learn
          python - <<'PY'
          import sklearn
          assert sklearn.__version__=="1.9.1"
          PY
      - name: Execute negative DOI-linked manufacturing source tests
        run: |
          python -m pytest -q tests/test_phase3_obelix_solo_oxide_process_transfer_0191.py tests/test_phase3_obelix_solo_oxide_original_manufacturing_0190.py
      - name: Download pinned original publisher OBELiX source
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none --no-checkout https://github.com/NRC-Mila/OBELiX.git "$RUNNER_TEMP/OBELiX-0191"
          git -C "$RUNNER_TEMP/OBELiX-0191" checkout --quiet --detach "$OBELIX_COMMIT"
          test "$(git -C "$RUNNER_TEMP/OBELiX-0191" rev-parse HEAD)" = "$OBELIX_COMMIT"
      - name: Run actual original 2018 versus 2020 heldout DOI experiment
        run: |
          python -m scripts.science.obelix_solo_oxide_process_transfer_0191 --original-obelix-checkout "$RUNNER_TEMP/OBELiX-0191" --output-dir "$RUNNER_TEMP/0191-real"
      - name: Require measured author results but deny unsafe scientific promotion
        run: |
          python - "$RUNNER_TEMP/0191-real/0191_process_source_transfer.json" <<'PY'
          import json,sys,math
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          assert d["paper_groups"]==2 and d["source_conditions"]==10
          assert len(d["folds"])==2 and d["original_TEST_unread"]==121
          assert all(f["train_DOI"]!=f["test_DOI"] for f in d["folds"])
          assert all(math.isfinite(v["paper_macro_mae"]) for v in d["paper_macro"].values())
          assert d["categorical_sn_route_pairs_abstained"]==4
          assert not d["scientific_GO"] and not d["production_enabled"]
          assert all(d[x]=="BLOCKED" for x in ("P0_01","P0_02","P0_03"))
          print("0191_REAL_SOURCE_DOI_HELDOUT_NO_GO")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: phase3-0191-source-separated-process-transfer
          path: ${{ runner.temp }}/0191-real/0191_process_source_transfer.json
          if-no-files-found: error
          retention-days: 30
