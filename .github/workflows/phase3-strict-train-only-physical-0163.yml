name: Phase 3 0163 Pinned Original TRAIN-Only Physics Target Without TEST Field Decode
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phase3-original-si-v-train-0163-${{ github.ref }}
  cancel-in-progress: true
jobs:
  actual-physical-source-crystal-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OPENBLAS_NUM_THREADS: "2"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      ORIGINAL_OBELIX_COMMIT: 4eaac889809dd489e3bae468c45d5c0e02b9147a
    steps:
      - name: Checkout exact triggering Rhombus commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Python 3.11 for first-party crystallography
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install pinned 0151 scientific dependencies
        run: |
          set -euo pipefail
          python -m pip install -c scripts/ci/constraints.txt pytest numpy scipy pyyaml pymatgen smact ase scikit-learn
          python -m pip install 'pypdf==5.9.0'
      - name: Test structure match and occupancy falsification fixtures
        run: python -m pytest -q tests/test_phase3_strict_train_only_0163.py
      - name: Fetch exact publisher OBELiX first-party original repository
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none --no-checkout https://github.com/NRC-Mila/OBELiX.git "$RUNNER_TEMP/OBELiX-0163"
          git -C "$RUNNER_TEMP/OBELiX-0163" checkout --quiet --detach "$ORIGINAL_OBELIX_COMMIT"
          test "$(git -C "$RUNNER_TEMP/OBELiX-0163" rev-parse HEAD)" = "$ORIGINAL_OBELIX_COMMIT"
          test -z "$(git -C "$RUNNER_TEMP/OBELiX-0163" status --porcelain --untracked-files=all)"
      - name: Download genuine pinned SI ZIP then analyze publisher 8 CIF against 2 original TRAIN
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE" python scripts/science/obelix_train_only_transport_0163.py \
            --original-obelix-checkout "$RUNNER_TEMP/OBELiX-0163" \
            --output-dir "$RUNNER_TEMP/0163-real-CIF-join"
      - name: Assert no TEST labels/formula/DOI CSV parse and authentic original physics sources
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/0163-real-CIF-join" <<'PY'
          import json,math,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          assert sorted(p.name for p in root.iterdir())==["strict_original_TRAIN_lagp_target_0163.json"]
          j=json.loads((root/"strict_original_TRAIN_lagp_target_0163.json").read_text())
          assert j["original_SOURCE_git_commit"]=="4eaac889809dd489e3bae468c45d5c0e02b9147a"
          assert j["source_paper_DOI"]=="10.1021/acsami.8b00842"
          a=j["source_TRAIN_intake_summary"]
          assert a["official_TRAIN_ids"]==478 and a["official_TEST_ids"]==121
          assert a["source_TRAIN_parsed_rows"]==478
          assert a["source_TEST_only_first_column_IDs_seen"]==121
          assert a["source_TEST_DOI_formula_conductivity_cells_parsed"]==0
          assert a["source_TEST_CIF_bytes_read"]==0
          assert a["single_processed_CSV_stream_raw_TEST_bytes_passed_over"] is True
          assert a["source_reader_not_a_cryptographic_blind"] is True
          assert a["TRAIN_reported_numeric_point"]==478
          assert a["TRAIN_censored_upper_bound"]==0
          assert a["processed_file_may_flatten_original_raw_censoring"] is True
          assert a["raw_workbook_original_449_point_29_censored_not_rechecked_in_this_pipeline"] is True
          assert j["processed_point_label_is_not_raw_measurement_point_admission"] is True
          assert j["original_TEST_label_formula_DOI_CIF_FIELDS_CSV_PARSED"]==0
          assert j["original_publisher_CIF_archive_SHA256"]=="dc88a0a83857b172ebe7a8194eb1b50148f117d6cddb39f1adbb628ac7d1c382"
          assert j["real_author_original_manuscript_SHA256"]=="e5fc22ec69db52f403f8776cbcf10e11ed771d6abf69b3c3ac610bb30edfe368"
          assert j["real_rietveld_SI_SHA256"]=="db747a82235860cdcd21a798ad51d2fd0d22b906d3a213cd31e9ea9af72d94d3"
          assert len(j["original_TWO_source_TRAIN_structure_and_label_leads"])==2
          assert {x["original_TRAIN_id"] for x in j["original_TWO_source_TRAIN_structure_and_label_leads"]}=={"0fh","1dm"}
          assert j["processed_source_TRAIN_label_log10_ratio_1dm_minus_0fh"]==0.76937121
          assert j["reproduces_0162_original_processed_label_ratio"] is True
          assert j["paper_shows_reciprocal_resistance_instead_of_conductivity_context_only"] is True
          assert all(not x["ready_for_physical_MLIP_MD_as_experiment_reference"]
                     for x in j["original_TWO_source_TRAIN_structure_and_label_leads"])
          assert j["actual_independently_qualified_transport_specimens"]==0
          assert j["paper_numeric_graph_sample_bulk_total_T_and_pellet_join_adjudicated"] is False
          assert j["new_external_blind"] is False and j["new_finite_T_MD"] is False
          assert j["scientific_GO"] is False
          assert all(j[k]=="BLOCKED" for k in ("P0_01","P0_02","P0_03"))
          serialized=(root/"strict_original_TRAIN_lagp_target_0163.json").read_text()
          assert "reported_ionic_conductivity_text" not in serialized
          print("0163_REAL_TRAIN_ONLY_NO_TEST_DOI_LABEL_CELLS_PARSED_EXACT_SOURCE_PASS")
          print(json.dumps({"TRAIN":a["source_TRAIN_parsed_rows"],
                            "TEST_fields_parsed":a["source_TEST_DOI_formula_conductivity_cells_parsed"],
                            "source_processed_log10_ratio":j["processed_source_TRAIN_label_log10_ratio_1dm_minus_0fh"],
                            "physically_qualified":0,"GO":False},sort_keys=True))
          PY
      - name: Retain only bounded crystallographic source aggregate without CIF structures
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase3-0163-pinned-original-strict-TRAIN-only-physical-audit
          path: ${{ runner.temp }}/0163-real-CIF-join/strict_original_TRAIN_lagp_target_0163.json
          if-no-files-found: error
          retention-days: 30
