name: Phase 3 0168 Actual Original Same-Composition Process Condition Prediction
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: process-holdout-0168-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-process-science:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout immutable PR head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Run original source and heldout falsification tests
        run: |
          set -euo pipefail
          python -m pip install -c scripts/ci/constraints.txt pytest
          python -m pytest -q tests/test_phase3_original_process_holdout_0168.py tests/test_phase3_original_sulfide_table_0166.py
      - name: Perform frozen original primary-source measured conductivity LOO
        run: |
          set -euo pipefail
          python -m scripts.science.original_process_holdout_0168 --live-original --output-dir "$RUNNER_TEMP/source-process-0168"
      - name: Reject invalid scientific validation and check actual out-of-condition errors
        run: |
          python - "$RUNNER_TEMP/source-process-0168" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1])
          assert sorted(x.name for x in p.iterdir())==["original_process_condition_LOO_0168.json"]
          report=json.loads((p/"original_process_condition_LOO_0168.json").read_text())
          assert report["primary_source_DOI"]=="10.1039/c9ra00949c"
          assert report["real_original_25_C_source_measurement"] is True
          assert report["process_treatments_C_versus_conductivity_measured_T_C_distinct"] is True
          d=report["experimental_cross_condition_diagnostics"]
          assert d["rows_evaluated_as_retrospective_LOO"]==6
          assert d["independent_material_compositions"]==1
          assert d["fold_training_row_count"]==5
          assert d["chemistry_only_five_fold_train_median_LOO_MAE_log10_S_per_cm"]==0.55728689
          assert d["process_temp_five_fold_train_OLS_LOO_MAE_log10_S_per_cm"]==0.13095762
          assert d["process_OLS_minus_chemistry_median_MAE"]<0
          assert d["process_temp_OLS_relative_MAE_reduction_over_training_median"]==0.76500861
          assert d["no_heldout_source_label_in_any_fit"]
          assert d["within_one_paper_LOO_not_blind_material_generalization"]
          assert d["exploratory_source_selected_after_public_labels_seen"]
          assert d["not_a_causal_effect_of_heat_treatment"]
          assert report["independent_exact_pellet_samples_physically_qualified"]==0
          assert report["external_prospectively_sealed_independent_blind"] is False
          assert report["material_level_out_of_family_evaluation"] is False
          assert report["physical_MLIP_MD_benchmark_improved"] is False
          assert all(report[k]=="BLOCKED" for k in ("P0_01","P0_02","P0_03"))
          assert report["scientific_GO"] is False
          raw=(p/"original_process_condition_LOO_0168.json").read_text()
          assert "six_original_public_process_condition_points" not in raw
          print("0168_ACTUAL_PRIMARY_PAPER_FIXED_LOO_PROCESS_VERSUS_STOICHIOMETRY_BASELINE_PASS")
          print(json.dumps({"median_cv_mae":d["chemistry_only_five_fold_train_median_LOO_MAE_log10_S_per_cm"],
                            "process_cv_mae":d["process_temp_five_fold_train_OLS_LOO_MAE_log10_S_per_cm"],
                            "physically_qualified_samples":0},sort_keys=True))
          PY
      - name: Publish aggregated error only
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase3-0168-real-firstparty-processing-predictive-diagnostic
          path: ${{ runner.temp }}/source-process-0168/original_process_condition_LOO_0168.json
          if-no-files-found: error
          retention-days: 30
