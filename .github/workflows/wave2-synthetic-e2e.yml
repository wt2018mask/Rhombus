name: Wave 2 Canonical Synthetic E2E

on:
  push:
    branches:
      - worker/wave2-e2e-release
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One canonical run per ref. New commits supersede obsolete work on the same PR/branch.
  group: wave2-synthetic-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/ci/constraints.txt

      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c scripts/ci/constraints.txt pytest numpy scipy pyyaml pymatgen smact ase
          python -m pip install --no-deps -e .

      - name: Compile changed Python modules
        run: python -m py_compile rudeus/science/evidence.py rudeus/science/pipeline_handoff.py rudeus/science/pipeline_release.py rudeus/science/known_material_benchmark.py rudeus/science/known_material_truth.py rudeus/science/known_material_universe.py rudeus/science/known_material_structure_binding.py rudeus/science/known_material_structure_import.py rudeus/science/known_material_artifact_curation.py rudeus/science/known_material_literature_structure.py rudeus/science/known_material_representation_policy.py rudeus/science/known_material_structure_resolution.py rudeus/science/known_material_b2_coverage.py rudeus/science/known_material_failure_control.py rudeus/science/known_material_failure_control_execution.py rudeus/science/known_material_model_domain.py rudeus/science/known_material_mlip_exposure.py rudeus/science/known_material_sample_size.py rudeus/science/known_material_b4_blinding_integrity.py rudeus/science/known_material_b5_dev_plan.py rudeus/science/known_material_b5_dev_units.py rudeus/science/known_material_b5_p0.py rudeus/science/known_material_cubic_llzo_p0_diagnostic.py rudeus/science/known_material_cubic_llzo_li2_feasibility.py rudeus/science/known_material_cubic_llzo_correlation_candidate.py rudeus/science/known_material_cubic_llzo_cross_pool_diagnostic.py rudeus/science/known_material_cubic_llzo_cross_pool_feasibility.py rudeus/science/known_material_cubic_llzo_joint_feasibility.py rudeus/science/constraint_aware_occupancy.py rudeus/science/known_material_cubic_llzo_representation_amendment.py rudeus/science/known_material_cubic_llzo_formal_amendment_proposal.py rudeus/science/known_material_b5_p0_semantics.py scripts/benchmark/curate_artifacts.py scripts/benchmark/verify_artifact_retention.py scripts/benchmark/audit_structure_resolution.py scripts/benchmark/run_failure_controls.py scripts/benchmark/audit_b2_coverage.py scripts/benchmark/audit_b4_blinding_integrity.py scripts/benchmark/render_b5_dev_diagnostic_plan.py scripts/benchmark/render_b5_dev_structure_units.py scripts/benchmark/run_b5_dev_p0.py scripts/benchmark/render_cubic_llzo_p0_diagnostic.py scripts/benchmark/render_cubic_llzo_li2_feasibility.py scripts/benchmark/render_cubic_llzo_correlation_candidate.py scripts/benchmark/render_cubic_llzo_cross_pool_diagnostic.py scripts/benchmark/render_cubic_llzo_cross_pool_feasibility.py scripts/benchmark/render_cubic_llzo_joint_feasibility.py scripts/benchmark/render_cubic_llzo_representation_amendment.py scripts/benchmark/render_cubic_llzo_formal_amendment_proposal.py scripts/benchmark/render_b5_ensemble_neutrality_semantics.py scripts/benchmark/snapshot_model_domains.py scripts/benchmark/verify_model_domain_snapshots.py tests/test_wave2_synthetic_e2e.py tests/test_known_material_benchmark.py tests/test_known_material_truth.py tests/test_known_material_universe.py

      - name: Run canonical synthetic E2E and directly required contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python -m pytest -q \
            tests/test_pipeline_handoff.py \
            tests/test_task_binding.py \
            tests/test_evidence.py \
            tests/test_constraint_aware_occupancy.py \
            tests/test_wave2_synthetic_e2e.py \
            tests/test_downstream.py \
            tests/test_known_material_*.py \
            tests/test_p3_series.py \
            tests/test_scheduler.py \
            tests/test_followups.py \
            --junitxml=artifacts/wave2-synthetic-e2e.xml 2>&1 | tee artifacts/wave2-synthetic-e2e.log

      - name: Render cubic LLZO B4 policy-evidence candidate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/benchmark/render_cubic_llzo_policy_evidence.py \
            | tee artifacts/cubic-llzo-policy-evidence-candidate.json

      - name: Audit canonical known-material structure resolution
        shell: bash
        run: |
          set -euo pipefail
          python scripts/benchmark/audit_structure_resolution.py | tee artifacts/known-material-structure-resolution.json

      - name: Verify canonical model-domain snapshot state
        shell: bash
        run: |
          set -euo pipefail
          python scripts/benchmark/verify_model_domain_snapshots.py | tee artifacts/known-material-model-domain.json

      - name: Run canonical B2 failure controls
        shell: bash
        run: |
          set -euo pipefail
          python scripts/benchmark/run_failure_controls.py | tee artifacts/known-material-failure-controls.json

      - name: Audit canonical B2 coverage gaps
        shell: bash
        run: |
          set -euo pipefail
          python scripts/benchmark/audit_b2_coverage.py | tee artifacts/known-material-b2-coverage.json

      - name: Audit canonical B4 blinding integrity
        shell: bash
        run: |
          set -euo pipefail
          python scripts/benchmark/audit_b4_blinding_integrity.py | tee artifacts/known-material-b4-blinding-integrity.json

      - name: Render canonical B5 DEV diagnostic plan
        shell: bash
        run: |
          set -euo pipefail
          python scripts/benchmark/render_b5_dev_diagnostic_plan.py | tee artifacts/known-material-b5-dev-diagnostic-plan.json

      - name: Render canonical B5 DEV structure units
        shell: bash
        run: |
          set -euo pipefail
          python scripts/benchmark/render_b5_dev_structure_units.py | tee artifacts/known-material-b5-dev-structure-units.json

      - name: Run canonical raw B5 DEV P0
        shell: bash
        run: |
          set -euo pipefail
          python scripts/benchmark/run_b5_dev_p0.py | tee artifacts/known-material-b5-dev-p0-raw.json

      - name: Render cubic LLZO B5 P0 diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python scripts/benchmark/render_cubic_llzo_p0_diagnostic.py \
            | tee artifacts/cubic-llzo-b5-p0-diagnostic.json

      - name: Render cubic LLZO Li2 correlation feasibility
        shell: bash
        run: |
          set -euo pipefail
          python scripts/benchmark/render_cubic_llzo_li2_feasibility.py \
            | tee artifacts/cubic-llzo-li2-correlation-feasibility.json

      - name: Render correlation-aware cubic LLZO candidates
        shell: bash
        run: |
          set -euo pipefail
          python scripts/benchmark/render_cubic_llzo_correlation_candidate.py \
            | tee artifacts/cubic-llzo-correlation-aware-candidate.json

      - name: Render cubic LLZO residual clash classes
        shell: bash
        run: |
          set -euo pipefail
          python scripts/benchmark/render_cubic_llzo_cross_pool_diagnostic.py \
            | tee artifacts/cubic-llzo-cross-pool-clash-diagnostic.json

      - name: Render cubic LLZO cross-pool feasibility
        shell: bash
        run: |
          set -euo pipefail
          python scripts/benchmark/render_cubic_llzo_cross_pool_feasibility.py \
            | tee artifacts/cubic-llzo-cross-pool-feasibility.json

      - name: Render cubic LLZO joint occupancy feasibility
        shell: bash
        run: |
          set -euo pipefail
          python scripts/benchmark/render_cubic_llzo_joint_feasibility.py \
            | tee artifacts/cubic-llzo-joint-occupancy-feasibility.json

      - name: Render cubic LLZO representation amendment candidate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/benchmark/render_cubic_llzo_representation_amendment.py \
            | tee artifacts/cubic-llzo-representation-amendment-candidate.json

      - name: Render cubic LLZO formal amendment proposal
        shell: bash
        run: |
          set -euo pipefail
          python scripts/benchmark/render_cubic_llzo_formal_amendment_proposal.py \
            | tee artifacts/cubic-llzo-formal-amendment-proposal.json

      - name: Render B5 ensemble neutrality semantics
        shell: bash
        run: |
          set -euo pipefail
          python scripts/benchmark/render_b5_ensemble_neutrality_semantics.py \
            | tee artifacts/b5-ensemble-neutrality-semantics.json

      - name: Retain test report and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave2-synthetic-e2e-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
