name: Wave 2 Canonical Synthetic E2E

on:
  push:
    branches:
      - worker/wave2-e2e-release
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One canonical run per ref. New commits supersede obsolete work on the same PR/branch.
  group: wave2-synthetic-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/ci/constraints.txt

      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c scripts/ci/constraints.txt pytest numpy scipy pyyaml pymatgen smact ase
          python -m pip install --no-deps -e .

      - name: Compile changed Python modules
        run: python -m py_compile rudeus/science/evidence.py rudeus/science/pipeline_handoff.py rudeus/science/pipeline_release.py rudeus/science/known_material_benchmark.py rudeus/science/known_material_truth.py rudeus/science/known_material_universe.py rudeus/science/known_material_structure_binding.py rudeus/science/known_material_structure_import.py rudeus/science/known_material_artifact_curation.py rudeus/science/known_material_representation_policy.py rudeus/science/known_material_structure_resolution.py rudeus/science/known_material_b2_coverage.py rudeus/science/known_material_failure_control.py rudeus/science/known_material_failure_control_execution.py rudeus/science/known_material_model_domain.py scripts/benchmark/curate_artifacts.py scripts/benchmark/verify_artifact_retention.py scripts/benchmark/audit_structure_resolution.py scripts/benchmark/run_failure_controls.py scripts/benchmark/audit_b2_coverage.py scripts/benchmark/snapshot_model_domains.py scripts/benchmark/verify_model_domain_snapshots.py tests/test_wave2_synthetic_e2e.py tests/test_known_material_benchmark.py tests/test_known_material_truth.py tests/test_known_material_universe.py

      - name: Run canonical synthetic E2E and directly required contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python -m pytest -q \
            tests/test_pipeline_handoff.py \
            tests/test_task_binding.py \
            tests/test_evidence.py \
            tests/test_wave2_synthetic_e2e.py \
            tests/test_downstream.py \
            tests/test_known_material_benchmark.py \
            tests/test_known_material_truth.py \
            tests/test_known_material_universe.py \
            tests/test_known_material_structure_binding.py \
            tests/test_known_material_structure_import.py \
            tests/test_known_material_artifact_curation.py \
            tests/test_known_material_representation_policy.py \
            tests/test_known_material_structure_resolution.py \
            tests/test_known_material_b2_coverage.py \
            tests/test_known_material_failure_control.py \
            tests/test_known_material_failure_control_execution.py \
            tests/test_known_material_model_domain.py \
            tests/test_p3_series.py \
            tests/test_scheduler.py \
            tests/test_followups.py \
            --junitxml=artifacts/wave2-synthetic-e2e.xml 2>&1 | tee artifacts/wave2-synthetic-e2e.log

      - name: Audit canonical known-material structure resolution
        shell: bash
        run: |
          set -euo pipefail
          python scripts/benchmark/audit_structure_resolution.py | tee artifacts/known-material-structure-resolution.json

      - name: Verify canonical model-domain snapshot state
        shell: bash
        run: |
          set -euo pipefail
          python scripts/benchmark/verify_model_domain_snapshots.py | tee artifacts/known-material-model-domain.json

      - name: Run canonical B2 failure controls
        shell: bash
        run: |
          set -euo pipefail
          python scripts/benchmark/run_failure_controls.py | tee artifacts/known-material-failure-controls.json

      - name: Audit canonical B2 coverage gaps
        shell: bash
        run: |
          set -euo pipefail
          python scripts/benchmark/audit_b2_coverage.py | tee artifacts/known-material-b2-coverage.json

      - name: Retain test report and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave2-synthetic-e2e-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
