name: Phase 3 0179 Actual Evidence Treatment Label is Not Physical Pellet
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-evidence-physical-join-denial:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Falsify source-label material identity promotion
        run: |
          set -euo pipefail
          python -m pip install -c scripts/ci/constraints.txt pytest
          python -m pytest -q tests/test_phase3_physical_sample_join_eligibility_0179.py
      - name: Evaluate author-original XRD EIS identity scope offline
        run: |
          set -euo pipefail
          python -m scripts.science.physical_sample_join_eligibility_0179 --input data/development/phase3_0179_pellet_bridge_source_v1.json --output "$RUNNER_TEMP/physical-join-0179/decision.json"
      - name: Verify P0 blocks and no counterfeit physical sample
        run: |
          python - "$RUNNER_TEMP/physical-join-0179/decision.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          assert [x["treatment"] for x in d["matched_conditions_only"]]==["Pristine","2 Li-OPA"]
          assert d["unique_independently_attested_pellet_pairs"]==0
          assert d["source_specific_raw_XRD_EIS_individual_pellet_IDs"] is None
          assert all(d[k]=="BLOCKED" for k in ("P0_01","P0_02","P0_03"))
          assert d["scientific_GO"] is False
          print("0179_EXACT_GROUP_LABELS_NOT_SAME_PELLET_SCIENTIFIC_NO_GO_PASS")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase3-0179-primary-source-treatment-is-not-physical-pellet
          path: ${{ runner.temp }}/physical-join-0179/decision.json
          if-no-files-found: error
          retention-days: 30
