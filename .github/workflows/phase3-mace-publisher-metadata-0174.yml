name: Phase 3 0174 Real Publisher MACE Split Metadata and Template Audit
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publisher-mace-splits-0174-${{ github.ref }}
  cancel-in-progress: true
jobs:
  actual-original-metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Falsify published sAlex split counts, URL and MACE template drift
        run: |
          set -euo pipefail
          python -m pip install -c scripts/ci/constraints.txt pytest
          python -m pytest -q tests/test_phase3_mace_publisher_source_metadata_0174.py tests/test_phase3_mace_author_training_splits_0173.py
      - name: Fetch ACTUAL two upstream publisher metadata sources
        run: |
          set -euo pipefail
          python -m scripts.science.mace_publisher_source_metadata_0174 --live-publisher --output-dir "$RUNNER_TEMP/primary-source-metadata-0174"
      - name: Explicitly forbid selected frame attestation and large archive claims
        run: |
          python - "$RUNNER_TEMP/primary-source-metadata-0174/actual_upstream_source_metadata_0174.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          assert d["meta_reported_sAlex_train_records_NOT_checkpoint_selected"]==10447765
          assert d["meta_reported_sAlex_valid_records_NOT_checkpoint_selected"]==553218
          assert d["original_MACE_upstream_template_blob_sha1"]=="68f58cd4076e8aaadee94b672cc4b019e9fbc046"
          assert d["sAlex_pub_archive_links_match_MPA0_developer_author_statement"]
          assert d["template_explicitly_named_OMAT_not_historical_MPA_training_receipt"]
          assert not d["dataset_selected_frame_ids_for_exact_MACE_checkpoint_authenticated"]
          assert not d["sAlex_training_archive_downloaded"]
          assert not d["source_archive_SHA256_independently_computed"]
          assert not d["independent_evaluation_material_overlap_audited"]
          assert all(d[k]=="BLOCKED" for k in ("P0_01","P0_02","P0_03"))
          assert d["scientific_GO"] is False
          print("0174_TWO_ORIGINAL_PUBLISHER_METADATA_NOT_TRAINING_SELECTION_PASS")
          PY
      - name: Save public metadata only
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase3-0174-upstream-original-mace-metadata-not-membership
          path: ${{ runner.temp }}/primary-source-metadata-0174/actual_upstream_source_metadata_0174.json
          if-no-files-found: error
          retention-days: 30
