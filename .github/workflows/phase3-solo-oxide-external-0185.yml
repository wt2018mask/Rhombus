name: Phase 3 0185 SOLO Genuine O_ONLY External LLZO Diagnostic
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: solo-0185-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: "2"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      SOURCE_OBELIX: "4eaac889809dd489e3bae468c45d5c0e02b9147a"
      SOURCE_LLZO: "e65ac023b0613185666ad492cedce79a86633614"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install pinned CPU science dependencies
        run: |
          set -euo pipefail
          python -m pip install -c scripts/ci/constraints.txt pytest numpy scipy pyyaml pymatgen smact ase scikit-learn
          python - <<'PY'
          import sklearn
          assert sklearn.__version__ == "1.9.1"
          PY
      - name: Check source falsification tests
        run: |
          python -m pytest -q tests/test_phase3_obelix_solo_oxide_external_0185.py tests/test_phase3_obelix_real_grouped_oof_0146.py
      - name: Pin independent Git source snapshots
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none --no-checkout https://github.com/NRC-Mila/OBELiX.git "$RUNNER_TEMP/OBELiX-0185"
          git -C "$RUNNER_TEMP/OBELiX-0185" checkout --quiet --detach "$SOURCE_OBELIX"
          test "$(git -C "$RUNNER_TEMP/OBELiX-0185" rev-parse HEAD)" = "$SOURCE_OBELIX"
          git clone --quiet --filter=blob:none --no-checkout https://github.com/abd-adhyatma/llzo-improvement.git "$RUNNER_TEMP/LLZO-0185"
          git -C "$RUNNER_TEMP/LLZO-0185" checkout --quiet --detach "$SOURCE_LLZO"
          test "$(git -C "$RUNNER_TEMP/LLZO-0185" rev-parse HEAD)" = "$SOURCE_LLZO"
          test "$(git -C "$RUNNER_TEMP/LLZO-0185" hash-object llzo_dataset_clean.csv)" = "5293f717aebcc2c1396db335f9ac2a250d5567eb"
      - name: Run actual outside-source O_ONLY paired numerical diagnostic
        run: |
          set -euo pipefail
          python -m scripts.science.obelix_solo_oxide_external_0185 --original-obelix-checkout "$RUNNER_TEMP/OBELiX-0185" --external-llzo-checkout "$RUNNER_TEMP/LLZO-0185" --output-dir "$RUNNER_TEMP/0185"
      - name: Verify aggregate diagnostic cannot claim false physical GO
        run: |
          python - "$RUNNER_TEMP/0185/0185_external_oxide_source_diagnostic.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r["original_official_TEST_reserved_UNREAD"]==121 and r["original_TEST_used"] is False
          assert r["external_nonempty_rows"]==176 and r["original_O_ONLY_TRAIN"]==307
          assert r["external_uncontrolled_measurement_temperature"] and r["external_bulk_total_unspecified"]
          assert r["O_ONLY_production_router_enabled"] is False and r["scientific_GO"] is False
          assert r["qualified_individual_physical_pellets"]==0
          assert all(r["physical_P0_0"+str(i)]=="BLOCKED" for i in (1,2,3))
          assert r["status"] in ("BLOCKED_TOO_FEW_NONOVERLAPPING_SOURCE_GROUPS","REAL_SOURCE_EXPLORATORY_NUMERICAL_DIAGNOSTIC_NOT_QUALIFIED")
          print("0185_REAL_ORIGINAL_NO_FALSE_GO_PASS")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: phase3-0185-oxide-original-external-diagnostic
          path: ${{ runner.temp }}/0185/0185_external_oxide_source_diagnostic.json
          if-no-files-found: error
          retention-days: 30
