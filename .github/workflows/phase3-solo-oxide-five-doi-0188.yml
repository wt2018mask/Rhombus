name: Phase 3 0188 SOLO Five Original DOI O_ONLY 25C TOTAL
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: solo-0188-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-source-five-doi:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: "2"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OBELIX_COMMIT: "4eaac889809dd489e3bae468c45d5c0e02b9147a"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install bounded original CPU science dependencies
        run: |
          set -euo pipefail
          python -m pip install -c scripts/ci/constraints.txt pytest numpy scipy pyyaml pymatgen smact ase scikit-learn
          python - <<'PY'
          import sklearn
          assert sklearn.__version__=="1.9.1"
          PY
      - name: Execute hostile source gate and TEST-quarantine tests
        run: |
          python -m pytest -q tests/test_phase3_obelix_solo_oxide_five_doi_0188.py tests/test_phase3_obelix_solo_oxide_jats_three_doi_0187.py
      - name: Fetch immutable original publisher OBELiX TRAIN
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none --no-checkout https://github.com/NRC-Mila/OBELiX.git "$RUNNER_TEMP/OBELiX-0188"
          git -C "$RUNNER_TEMP/OBELiX-0188" checkout --quiet --detach "$OBELIX_COMMIT"
          test "$(git -C "$RUNNER_TEMP/OBELiX-0188" rev-parse HEAD)" = "$OBELIX_COMMIT"
      - name: Compute five actual original 25C TOTAL DOI-group source transfer MAE
        run: |
          python -m scripts.science.obelix_solo_oxide_five_doi_0188 --original-obelix-checkout "$RUNNER_TEMP/OBELiX-0188" --output-dir "$RUNNER_TEMP/0188-original"
      - name: Deny numerical improvement as false independent physical GO
        run: |
          python - "$RUNNER_TEMP/0188-original/0188_five_original_DOI_25C_total.json" <<'PY'
          import json,sys,math
          x=json.load(open(sys.argv[1],encoding="utf-8"))
          assert x["distinct_DOI_groups"]==5
          assert x["actual_reference_conditions"]==22
          assert x["measurement_temperature_C"]==25
          assert x["measured_observable"]=="TOTAL_IONIC_CONDUCTIVITY_S_CM"
          assert x["original_official_TEST_reserved_UNREAD"]==121 and not x["original_TEST_fields_parsed"]
          assert len(x["model_scores"])==4 and all(len(v["source_DOI_MAE_log10"])==5 for v in x["model_scores"].values())
          assert all(math.isfinite(v["equal_DOI_macro_MAE_log10"]) for v in x["model_scores"].values())
          assert not x["production_O_ONLY_router_enabled"] and not x["scientific_GO"]
          assert all(x[g]=="BLOCKED" for g in ("P0_01","P0_02","P0_03"))
          print("0188_ACTUAL_FIVE_PAPER_25C_TOTAL_SOURCE_NO_FALSE_GO_PASS")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: phase3-0188-five-real-original-DOI-25C-total
          path: ${{ runner.temp }}/0188-original/0188_five_original_DOI_25C_total.json
          if-no-files-found: error
          retention-days: 30
