[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# Explicit package list: legacy rudeus and canonical Rhombus 2.0 namespaces
# both ship during migration; tests stay out of the distribution.
[tool.setuptools.packages.find]
include = ["rudeus*", "rhombus*"]

[project]
name = "rhombus"
version = "0.1.0"
description = "Rhombus: a zero-cost scientific discovery and qualification system for solid-ion conductors"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Rhombus Discovery Team" }
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "pymatgen>=2023.0.0",
    "ase>=3.26.0",
    "ase-db-backends>=0.10.0",
    "mace-torch>=0.3.0",
    "smact>=2.5.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "nbformat>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
